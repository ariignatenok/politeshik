<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Политешик — учебный планировщик</title>
  <meta name="theme-color" content="#0c0e16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Политешик">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Применяем сохранённую тему до отрисовки, чтобы не было «вспышки» -->
  <script>
    try {
      var _t = window.localStorage.getItem('politeshik:theme');
      if (!_t) {var _d = JSON.parse(window.localStorage.getItem('studyPlanner') || 'null'); if (_d && _d.settings) _t = _d.settings.theme;}
      if (_t && /^(light|dark|barbie|ocean|space|garden|magic)$/.test(_t)) document.documentElement.setAttribute('data-theme', _t);
    } catch (e) { }
  </script>
  <style>
    /* ==========================================================
   ТОКЕНЫ ДИЗАЙНА. Тёмная тема — по умолчанию, светлая — через data-theme="light"
   ========================================================== */
    :root {
      --bg: #0c0e16;
      --surface: #141826;
      --surface2: #1a1f31;
      --border: rgba(255, 255, 255, .08);
      --text: #e9ebf5;
      --muted: #9aa1ba;
      --accent: #6366f1;
      --accent-hover: #7377f3;
      --accent-soft: rgba(99, 102, 241, .16);
      --accent-text: #a5b4fc;
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, .11);
      --yellow: #fbbf24;
      --yellow-bg: rgba(251, 191, 36, .11);
      --green: #34d399;
      --mark: rgba(251, 191, 36, .28);
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      --radius: 12px;
      color-scheme: dark;
      /* безопасные зоны телефона */
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    :root[data-theme="light"] {
      --bg: #f4f5fb;
      --surface: #ffffff;
      --surface2: #eef0f8;
      --border: rgba(25, 30, 60, .10);
      --text: #1a1d2e;
      --muted: #667090;
      --accent-soft: rgba(99, 102, 241, .12);
      --accent-text: #4f46e5;
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, .08);
      --yellow: #b45309;
      --yellow-bg: rgba(245, 158, 11, .14);
      --green: #059669;
      --mark: rgba(250, 204, 21, .45);
      --shadow: 0 10px 30px rgba(40, 50, 110, .12);
      color-scheme: light;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background .25s, color .25s
    }

    body.modal-open {
      overflow: hidden
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--bg);
      z-index: 60
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      line-height: 1.25
    }

    a {
      color: var(--accent-text)
    }

    /* ---------- Каркас ---------- */
    .shell {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 248px;
      flex: none;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      align-self: flex-start;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-right: 1px solid var(--border)
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 8px
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 21px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      box-shadow: 0 6px 16px rgba(99, 102, 241, .4)
    }

    .brand b {
      display: block;
      font-size: 15px
    }

    .brand small {
      color: var(--muted);
      font-size: 12px
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-weight: 500;
      transition: .18s
    }

    .nav-btn .ico {
      font-size: 18px;
      width: 24px;
      text-align: center
    }

    .nav-btn:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .nav-btn.on {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .side-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .content {
      flex: 1;
      min-width: 0
    }

    .topbar {
      display: none
    }

    .view {
      max-width: 1120px;
      margin: 0 auto;
      padding: 30px 28px 60px
    }

    .rise {
      animation: rise .35s ease both
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .tabbar {
      display: none
    }

    /* ---------- Кнопки и поля ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      font-weight: 600;
      transition: .18s;
      white-space: nowrap
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent)
    }

    .btn:active {
      transform: none
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 6px 16px rgba(99, 102, 241, .35)
    }

    .btn.primary:hover {
      background: var(--accent-hover)
    }

    .btn.danger {
      color: var(--red);
      border-color: transparent;
      background: var(--red-bg)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.sm {
      padding: 6px 11px;
      font-size: 13px
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      transition: .15s;
      font-size: 15px
    }

    .icon-btn:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .input,
    select.input,
    textarea.input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      outline: none;
      transition: border-color .15s, box-shadow .15s
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft)
    }

    textarea.input {
      resize: vertical;
      min-height: 90px
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px
    }

    .field>span,
    .field>.lbl {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .seg {
      display: inline-flex;
      padding: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      gap: 2px
    }

    .seg button,
    .seg label {
      border: 0;
      background: transparent;
      padding: 7px 14px;
      border-radius: 9px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: .15s
    }

    .seg .on,
    .seg input:checked+span {
      background: var(--accent);
      color: #fff
    }

    .seg label {
      padding: 0
    }

    .seg label span {
      display: block;
      padding: 7px 14px;
      border-radius: 9px
    }

    .seg input {
      position: absolute;
      opacity: 0;
      pointer-events: none
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .swatches label {
      cursor: pointer
    }

    .swatches input {
      position: absolute;
      opacity: 0
    }

    .swatches span {
      display: block;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid transparent;
      transition: .15s
    }

    .swatches input:checked+span {
      border-color: var(--text);
      transform: scale(1.1)
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .checks label {
      cursor: pointer
    }

    .checks input {
      position: absolute;
      opacity: 0
    }

    .checks span {
      display: block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 13px;
      transition: .15s
    }

    .checks input:checked+span {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-text)
    }

    /* ---------- Карточки, заголовки ---------- */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px
    }

    .page-head h1 {
      font-size: 26px;
      letter-spacing: -.02em
    }

    .page-head p {
      margin: 4px 0 0;
      color: var(--muted)
    }

    .head-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow)
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px
    }

    .stat {
      padding: 16px 18px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border)
    }

    .stat b {
      display: block;
      font-size: 28px;
      letter-spacing: -.02em
    }

    .stat small {
      color: var(--muted)
    }

    .stat.red b {
      color: var(--red)
    }

    .dash-cols {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .fchip {
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition: .15s
    }

    .fchip.on {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-color: var(--accent)
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: color-mix(in srgb, var(--c, #6366f1) 20%, transparent);
      color: var(--text)
    }

    .chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c, #6366f1)
    }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--surface2);
      color: var(--muted)
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 34px 12px
    }

    .empty b {
      display: block;
      font-size: 34px;
      margin-bottom: 6px
    }

    /* ---------- Элементы списка работ ---------- */
    .items {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      position: relative;
      transition: .2s;
      animation: rise .3s ease both
    }

    .item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 4px;
      background: var(--border)
    }

    .item:hover {
      transform: translateX(2px)
    }

    .item.u-red {
      background: var(--red-bg);
      border-color: color-mix(in srgb, var(--red) 40%, transparent)
    }

    .item.u-red::before {
      background: var(--red)
    }

    .item.u-yellow {
      background: var(--yellow-bg);
      border-color: color-mix(in srgb, var(--yellow) 40%, transparent)
    }

    .item.u-yellow::before {
      background: var(--yellow)
    }

    .item.is-done .item-title {
      text-decoration: line-through;
      color: var(--muted)
    }

    .item.is-done {
      opacity: .65
    }

    .item-main {
      flex: 1;
      min-width: 0
    }

    .item-title {
      font-weight: 600;
      overflow-wrap: anywhere
    }

    .item-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 5px
    }

    .item-when {
      text-align: right;
      flex: none
    }

    .item-when b {
      display: block;
      font-size: 14px
    }

    .item-when small {
      color: var(--muted);
      font-size: 12px
    }

    .u-red .item-when b {
      color: var(--red)
    }

    .u-yellow .item-when b {
      color: var(--yellow)
    }

    .item-actions {
      display: flex;
      flex: none
    }

    .check {
      width: 28px;
      height: 28px;
      flex: none;
      border-radius: 9px;
      border: 2px solid var(--muted);
      background: transparent;
      color: transparent;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      transition: .18s
    }

    .check:hover {
      border-color: var(--accent)
    }

    .check.on {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      animation: pop .25s ease
    }

    @keyframes pop {
      50% {
        transform: scale(1.2)
      }
    }

    details.done-box {
      margin-top: 16px
    }

    details.done-box summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 10px
    }

    /* ---------- Расписание ---------- */
    .sched-grid {
      display: grid;
      grid-template-columns: 78px repeat(7, minmax(0, 1fr));
      gap: 6px
    }

    .g-day {
      padding: 8px;
      text-align: center;
      font-weight: 700;
      color: var(--muted);
      border-radius: 10px
    }

    .g-day.today {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .g-pair {
      border: 0;
      background: var(--surface);
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 84px;
      border: 1px solid var(--border)
    }

    .g-pair b {
      font-size: 18px
    }

    .g-pair small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      text-align: center
    }

    .g-pair:hover {
      border-color: var(--accent)
    }

    .g-cell {
      min-height: 84px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: .15s;
      position: relative
    }

    .g-cell:hover {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .g-cell:empty::after {
      content: "+";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--muted);
      opacity: 0;
      transition: .15s
    }

    .g-cell:empty:hover::after {
      opacity: 1
    }

    .g-cell.today {
      background: color-mix(in srgb, var(--accent) 6%, transparent)
    }

    .lesson {
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 4px solid var(--c);
      border-radius: 8px;
      padding: 6px 8px;
      background: color-mix(in srgb, var(--c) 17%, var(--surface));
      transition: .15s;
      display: block
    }

    .lesson:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow)
    }

    .lesson b {
      display: block;
      font-size: 13px;
      line-height: 1.25
    }

    .lesson small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      overflow-wrap: anywhere
    }

    .lesson .wk {
      display: inline-block;
      font-size: 10px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--surface2);
      color: var(--accent-text);
      margin-top: 2px
    }

    .sched-list {
      display: none
    }

    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px
    }

    .day-tab {
      flex: 1;
      min-width: 44px;
      padding: 9px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
      color: var(--muted)
    }

    .day-tab.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent)
    }

    .day-tab.is-today:not(.on) {
      border-color: var(--accent);
      color: var(--accent-text)
    }

    .l-row {
      display: flex;
      gap: 12px;
      margin-bottom: 10px
    }

    .l-num {
      width: 64px;
      flex: none;
      text-align: center;
      padding-top: 8px
    }

    .l-num b {
      font-size: 20px;
      display: block
    }

    .l-num small {
      color: var(--muted);
      font-size: 11px;
      display: block;
      line-height: 1.2
    }

    .l-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0
    }

    .l-empty {
      border: 1px dashed var(--border);
      background: transparent;
      border-radius: 10px;
      padding: 12px;
      color: var(--muted);
      text-align: left
    }

    .l-empty:hover {
      border-color: var(--accent);
      color: var(--accent-text)
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px
    }

    /* ---------- Предметы / карточки ---------- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px
    }

    .scard {
      position: relative;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 16px 16px 20px;
      box-shadow: var(--shadow);
      transition: .2s;
      overflow: hidden;
      animation: rise .3s ease both;
      display: block;
      width: 100%
    }

    .scard::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--c)
    }

    .scard:hover {
      transform: translateY(-3px);
      border-color: var(--c)
    }

    .scard h3 {
      font-size: 16px;
      margin-bottom: 2px
    }

    .scard .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      overflow-wrap: anywhere
    }

    .scard .meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .searchbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .searchbar .input {
      flex: 1;
      min-width: 180px
    }

    .searchbar select {
      flex: none;
      width: auto;
      min-width: 170px
    }

    .back {
      margin-bottom: 14px
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      overflow-x: auto
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 10px 16px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap
    }

    .tab.on {
      color: var(--accent-text);
      border-bottom-color: var(--accent)
    }

    .inline-add {
      display: grid;
      grid-template-columns: 1fr 170px auto;
      gap: 10px;
      margin-bottom: 16px
    }

    .note-card {
      text-align: left;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: .18s;
      display: block;
      animation: rise .3s ease both
    }

    .note-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px)
    }

    .note-card b {
      display: block;
      margin-bottom: 4px
    }

    .note-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere
    }

    .note-card small {
      color: var(--muted);
      font-size: 11px;
      display: block;
      margin-top: 8px
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--surface2);
      border: 1px solid var(--border)
    }

    .link-row a {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      overflow-wrap: anywhere;
      text-decoration: none
    }

    .link-row small {
      display: block;
      color: var(--muted);
      font-weight: 400;
      overflow-wrap: anywhere
    }

    /* ---------- Преподаватели ---------- */
    .tcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      animation: rise .3s ease both;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .t-top {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      flex: none;
      background: var(--c, #6366f1)
    }

    .t-top h3 {
      font-size: 16px;
      overflow-wrap: anywhere
    }

    .t-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px
    }

    .t-info span,
    .t-info a {
      overflow-wrap: anywhere
    }

    .t-notes {
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      overflow-wrap: anywhere
    }

    .t-actions {
      display: flex;
      gap: 6px;
      margin-top: auto
    }

    /* ---------- Markdown-разметка в конспектах ---------- */
    .md {
      line-height: 1.65;
      overflow-wrap: anywhere
    }

    .md h2 {
      font-size: 21px;
      margin: 18px 0 8px
    }

    .md h3 {
      font-size: 18px;
      margin: 16px 0 6px
    }

    .md h4 {
      font-size: 15px;
      margin: 14px 0 4px;
      color: var(--accent-text)
    }

    .md p {
      margin: 8px 0
    }

    .md ul,
    .md ol {
      padding-left: 22px;
      margin: 8px 0
    }

    .md li {
      margin: 3px 0
    }

    .md code {
      background: var(--surface2);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .9em
    }

    .md pre {
      background: var(--surface2);
      padding: 12px 14px;
      border-radius: var(--radius);
      overflow-x: auto;
      border: 1px solid var(--border)
    }

    .md pre code {
      background: none;
      padding: 0
    }

    .md blockquote {
      margin: 10px 0;
      padding: 6px 14px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 10px 10px 0
    }

    .md mark {
      background: var(--mark);
      color: inherit;
      padding: 0 4px;
      border-radius: 4px
    }

    .md hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 16px 0
    }

    .md .tbl {
      overflow-x: auto;
      margin: 10px 0
    }

    .md table {
      border-collapse: collapse;
      min-width: 60%
    }

    .md th,
    .md td {
      border: 1px solid var(--border);
      padding: 7px 12px;
      text-align: left
    }

    .md th {
      background: var(--accent-soft)
    }

    .md tr:nth-child(even) td {
      background: var(--surface2)
    }

    /* ---------- Модальные окна и уведомления ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 7, 15, .6);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
      animation: fade .2s ease both
    }

    #confirm-root .overlay {
      z-index: 70
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal {
      width: min(520px, 100%);
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      animation: pop-in .25s ease both
    }

    .modal.wide {
      width: min(860px, 100%)
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px 6px
    }

    .modal-body {
      padding: 10px 18px 18px;
      overflow-y: auto
    }

    .modal-foot {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
      flex-wrap: wrap
    }

    .modal-foot .left {
      margin-right: auto
    }

    .shake {
      animation: shake .35s
    }

    @keyframes shake {
      25% {
        transform: translateX(-6px)
      }

      75% {
        transform: translateX(6px)
      }
    }

    .editor {
      display: grid;
      gap: 12px
    }

    .editor textarea {
      min-height: 300px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px
    }

    .md-help {
      font-size: 12px;
      color: var(--muted)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none
    }

    .toast {
      background: var(--text);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: var(--shadow);
      animation: rise .25s ease both
    }

    .set-sec {
      margin-bottom: 18px
    }

    .set-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 10px 0;
      border-top: 1px solid var(--border)
    }

    .set-row:first-of-type {
      border-top: 0
    }

    .set-row p {
      margin: 0;
      color: var(--muted);
      font-size: 13px
    }

    .warn {
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--yellow-bg);
      color: var(--yellow);
      margin-bottom: 16px;
      font-size: 14px
    }

    .fab {
      display: none
    }

    /* ---------- Карточки (заучивание) и формулы ---------- */
    .deck-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .deck-stat {
      min-width: 200px;
      flex: 1;
      max-width: 340px
    }

    .deck-stat b {
      font-size: 22px
    }

    .deck-stat small {
      color: var(--muted);
      margin-left: 8px
    }

    .progress {
      height: 8px;
      border-radius: 99px;
      background: var(--surface2);
      overflow: hidden;
      margin-top: 8px
    }

    .progress i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 99px;
      transition: width .35s ease
    }

    .chk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer
    }

    .chk input {
      accent-color: var(--accent)
    }

    .crows {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .crow {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      transition: .15s
    }

    .crow:hover {
      border-color: var(--accent);
      transform: translateX(2px)
    }

    .crow .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      flex: none
    }

    .crow.ok .dot {
      background: var(--green)
    }

    .crow-q {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere
    }

    .crow .tag {
      flex: none;
      max-width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .study {
      max-width: 720px;
      margin: 0 auto
    }

    .study-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px
    }

    .study-n {
      margin-left: auto;
      color: var(--muted);
      font-weight: 600
    }

    .flip {
      margin: 18px 0;
      min-height: 260px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      outline: none;
      transition: border-color .2s
    }

    .flip:hover,
    .flip:focus-visible {
      border-color: var(--accent)
    }

    .face {
      flex: 1;
      padding: 26px 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0
    }

    .face>small {
      color: var(--accent-text);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 11px
    }

    .face.front {
      justify-content: center;
      text-align: center;
      align-items: center
    }

    .qtxt {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere
    }

    .tap {
      color: var(--muted);
      font-size: 13px
    }

    .face.back {
      max-height: 60vh;
      overflow-y: auto;
      cursor: default
    }

    .study-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .study-actions .btn {
      min-width: 160px;
      padding: 12px 18px
    }

    .study.done {
      text-align: center;
      padding: 40px 0
    }

    .study.done .big {
      font-size: 56px
    }

    .fgroup {
      margin: 22px 0 10px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .fgroup:first-child {
      margin-top: 4px
    }

    .fgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px
    }

    .fcard {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      animation: rise .3s ease both
    }

    .ftitle {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding-right: 64px
    }

    .fexpr {
      font-family: "Cambria Math", "STIX Two Math", Cambria, Georgia, "Times New Roman", serif;
      font-size: 19px;
      margin: 8px 0;
      overflow-x: auto;
      overflow-wrap: anywhere;
      color: var(--text);
      line-height: 1.7
    }

    .fexpr sub,
    .fexpr sup,
    #fm-preview sub,
    #fm-preview sup {
      font-size: .7em;
      line-height: 0
    }

    .fnote {
      font-size: 13px;
      color: var(--muted)
    }

    .fact {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex
    }

    .fact .icon-btn {
      width: 28px;
      height: 28px;
      font-size: 13px;
      opacity: .5
    }

    .fcard:hover .fact .icon-btn {
      opacity: 1
    }

    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      margin: 0 .2em;
      font-size: .95em;
      line-height: 1.25
    }

    .frac>span {
      padding: 0 .25em
    }

    .frac>span:first-child {
      border-bottom: 1.5px solid currentColor
    }

    #fm-preview {
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--surface2);
      font-family: Cambria, Georgia, serif;
      font-size: 19px;
      min-height: 42px;
      overflow-x: auto
    }

    .tabs .tag {
      margin-left: 2px
    }

    @media (max-width:760px) {
      .flip {
        min-height: 200px
      }

      .face {
        padding: 20px 16px
      }

      .qtxt {
        font-size: 19px
      }

      .fgrid {
        grid-template-columns: 1fr
      }

      .study-actions .btn {
        flex: 1;
        min-width: 0
      }
    }

    /* ---------- Политешик: житель, чат, посещаемость, группа ---------- */
    .brand-logo {
      background: none !important;
      box-shadow: none !important;
      width: 44px;
      height: 44px
    }

    .brand-logo svg {
      display: block
    }

    .tb-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .tb-brand svg {
      display: block
    }

    .mascot {
      display: block;
      overflow: visible
    }

    .hero {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, var(--accent-soft), transparent 70%)
    }

    .hero-av {
      flex: none;
      animation: bob 3.4s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px)
      }
    }

    .hero-t b {
      font-size: 17px
    }

    .hero-t p {
      margin: 4px 0 8px;
      color: var(--muted)
    }

    .mini-mascot {
      display: flex;
      justify-content: center;
      margin-bottom: 6px
    }

    .welcome {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
      font-size: 14px
    }

    .badge {
      position: absolute;
      top: 2px;
      right: calc(50% - 22px);
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center
    }

    .nav-btn {
      position: relative
    }

    .nav-btn .badge {
      position: static;
      margin-left: auto
    }

    .tabbar .nav-btn .badge {
      position: absolute
    }

    /* чат */
    .chat-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 110px - env(safe-area-inset-top, 0px));
      min-height: 420px
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 4px 12px;
      border-bottom: 1px solid var(--border)
    }

    .chat-head small {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: rise .25s ease both
    }

    .msg.me {
      justify-content: flex-end
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      overflow-wrap: anywhere
    }

    .msg.bot .bubble {
      border-bottom-left-radius: 4px
    }

    .msg.me .bubble {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px
    }

    .bubble small {
      display: block;
      margin-top: 4px;
      opacity: .6;
      font-size: 11px;
      text-align: right
    }

    .qr {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .chipbtn {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
      padding: 6px 12px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 13px;
      transition: .15s;
      text-align: left
    }

    .chipbtn:hover {
      background: var(--accent);
      color: #fff
    }

    .chipbtn.yes {
      border-color: var(--green);
      color: var(--green);
      background: transparent
    }

    .chipbtn.yes:hover {
      background: var(--green);
      color: #fff
    }

    .chipbtn.no {
      border-color: var(--red);
      color: var(--red);
      background: transparent
    }

    .chipbtn.no:hover {
      background: var(--red);
      color: #fff
    }

    .day-sep {
      align-self: center;
      font-size: 12px;
      color: var(--muted);
      padding: 2px 12px;
      border-radius: 99px;
      background: var(--surface2)
    }

    .chat-quick {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 0
    }

    .chat-in {
      display: flex;
      gap: 8px;
      padding-bottom: 6px
    }

    /* посещаемость */
    .att-row {
      align-items: center
    }

    .att-num {
      width: 54px;
      flex: none;
      text-align: center
    }

    .att-num b {
      font-size: 20px;
      display: block
    }

    .att-num small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.1;
      display: block
    }

    .att-btns {
      display: flex;
      gap: 6px;
      flex: none
    }

    .att-b {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: transparent;
      font-weight: 800;
      font-size: 18px;
      transition: .15s;
      text-transform: lowercase
    }

    .att-b:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .att-b.ok:hover,
    .att-b.ok.on {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    .att-b.late:hover,
    .att-b.late.on {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #fff
    }

    .att-b.no:hover,
    .att-b.no.on {
      background: var(--red);
      border-color: var(--red);
      color: #fff
    }

    .att-b.on {
      transform: scale(1.06);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25)
    }

    .tag.exc {
      background: rgba(59, 130, 246, .18);
      color: #60a5fa
    }

    .tag.adm {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .daynav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px
    }

    .daynav-t {
      flex: 1;
      text-align: center
    }

    .daynav-t b {
      display: block;
      text-transform: capitalize
    }

    .daynav-t small {
      color: var(--muted)
    }

    .sec-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0 12px
    }

    .sec-title h2 {
      font-size: 18px
    }

    .period {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .sec-title .period {
      margin: 0
    }

    .monthnav {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .monthnav b {
      min-width: 140px;
      text-align: center
    }

    .att-stats {
      grid-template-columns: repeat(6, 1fr)
    }

    .stat.ok b {
      color: var(--green)
    }

    .stat.late b {
      color: #f59e0b
    }

    .stat.exc b {
      color: #60a5fa
    }

    .tbl-wrap {
      overflow-x: auto
    }

    .grid-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    .grid-tbl th {
      text-align: left;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap
    }

    .grid-tbl td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle
    }

    .grid-tbl td.dim {
      color: var(--muted);
      text-align: center
    }

    .grid-tbl .clickrow {
      cursor: pointer;
      transition: background .15s
    }

    .grid-tbl .clickrow:hover {
      background: var(--accent-soft)
    }

    .pbar {
      position: relative;
      height: 22px;
      min-width: 90px;
      border-radius: 99px;
      background: var(--surface2);
      overflow: hidden
    }

    .pbar i {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--accent);
      opacity: .55
    }

    .pbar.good i {
      background: var(--green)
    }

    .pbar.mid i {
      background: #f59e0b
    }

    .pbar.bad i {
      background: var(--red)
    }

    .pbar span {
      position: relative;
      display: block;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 22px
    }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      background: var(--surface2);
      color: var(--muted)
    }

    .pill.good {
      background: rgba(52, 211, 153, .16);
      color: var(--green)
    }

    .pill.mid {
      background: rgba(245, 158, 11, .16);
      color: #f59e0b
    }

    .pill.bad {
      background: rgba(248, 113, 113, .16);
      color: var(--red)
    }

    .sym {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: 800;
      background: var(--surface2);
      color: var(--muted)
    }

    .sym.ok {
      background: var(--green);
      color: #fff
    }

    .sym.late {
      background: #f59e0b;
      color: #fff
    }

    .sym.no {
      background: var(--red);
      color: #fff
    }

    .sym.exc {
      background: #3b82f6;
      color: #fff
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px
    }

    .cal-h {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700
    }

    .cal-d {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      font-weight: 600;
      font-size: 13px;
      transition: .15s
    }

    .cal-d.none {
      color: var(--muted);
      opacity: .6
    }

    .cal-d.ok {
      background: rgba(52, 211, 153, .2);
      border-color: var(--green)
    }

    .cal-d.late {
      background: rgba(245, 158, 11, .2);
      border-color: #f59e0b
    }

    .cal-d.no {
      background: rgba(248, 113, 113, .2);
      border-color: var(--red)
    }

    .cal-d.exc {
      background: rgba(59, 130, 246, .2);
      border-color: #3b82f6
    }

    .cal-d.today {
      box-shadow: 0 0 0 2px var(--accent)
    }

    .cal-d.sel {
      outline: 2px solid var(--text)
    }

    .cal-d:disabled {
      cursor: default
    }

    .cal-legend {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    .dotl {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px
    }

    .dotl.ok {
      background: var(--green)
    }

    .dotl.late {
      background: #f59e0b
    }

    .dotl.no {
      background: var(--red)
    }

    .dotl.exc {
      background: #3b82f6
    }

    /* кабинет и группа */
    .cab-head {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .cab-pct {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .cab-pct b {
      font-size: 38px;
      letter-spacing: -.02em
    }

    .cab-pct small {
      color: var(--muted)
    }

    .cab-pct.good b {
      color: var(--green)
    }

    .cab-pct.mid b {
      color: #f59e0b
    }

    .cab-pct.bad b {
      color: var(--red)
    }

    .ready {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .img-box {
      text-align: center
    }

    .img-box img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      border: 1px solid var(--border)
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 22px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 600;
      transition: .18s;
      box-shadow: var(--shadow)
    }

    .tile span {
      font-size: 30px
    }

    .tile:hover {
      border-color: var(--accent);
      transform: translateY(-2px)
    }

    .stud-modal .grid-stats {
      margin-bottom: 8px
    }

    @media (max-width:900px) {
      .tabbar {
        grid-template-columns: repeat(6, 1fr)
      }

      .chat-wrap {
        height: calc(100vh - 180px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))
      }
    }

    @media (max-width:760px) {
      .att-stats {
        grid-template-columns: repeat(3, 1fr)
      }

      .att-row {
        flex-wrap: wrap
      }

      .att-row .item-main {
        flex: 1 1 calc(100% - 72px);
        min-width: 0
      }

      .att-btns {
        width: 100%;
        gap: 8px
      }

      .att-b {
        flex: 1;
        width: auto
      }

      .att-cell {
        width: 100%;
        align-items: stretch
      }

      .hero {
        flex-direction: column;
        text-align: center
      }

      .bubble {
        max-width: 90%
      }
    }

    /* ---------- Страница входа (пока нет личного кабинета, приложение закрыто) ---------- */
    body.gated {
      overflow: hidden
    }

    body.gated .shell,
    body.gated .tabbar,
    body.gated .fab {
      display: none !important
    }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      overflow-y: auto;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
      background: radial-gradient(circle at 50% -10%, rgba(99, 102, 241, .28), transparent 60%), var(--bg)
    }

    .gate-card {
      width: min(440px, 100%);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: var(--shadow);
      animation: pop-in .35s ease both
    }

    .gate-card h1 {
      font-size: 30px;
      margin: 6px 0 2px;
      letter-spacing: -.02em
    }

    .gate-sub {
      color: var(--accent-text);
      font-weight: 700;
      margin: 0 0 12px
    }

    .gate-text {
      color: var(--muted);
      margin: 0 0 16px;
      font-size: 14px
    }

    .gate-card .field {
      text-align: left
    }

    .gate-mascot {
      display: flex;
      justify-content: center;
      animation: bob 3.4s ease-in-out infinite
    }

    .btn.big {
      width: 100%;
      padding: 13px 18px;
      font-size: 16px
    }

    .gate-foot {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px
    }

    .gate-actions {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .gate-actions .btn {
      white-space: normal;
      line-height: 1.3;
      text-align: center
    }

    .gate-dots span {
      display: inline-block;
      animation: blink 1.2s infinite
    }

    .gate-dots span:nth-child(2) {
      animation-delay: .2s
    }

    .gate-dots span:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: .2
      }

      40% {
        opacity: 1
      }
    }

    #toast {
      z-index: 120
    }

    /* ---------- Журнал админа ---------- */
    .static-name {
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--surface2);
      font-weight: 700
    }

    .sum-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .tag.bad {
      background: rgba(248, 113, 113, .16);
      color: var(--red)
    }

    .dimrow td {
      opacity: .55
    }

    .grid-tbl .dim {
      color: var(--muted)
    }

    .jwrap {
      overflow: auto;
      max-height: 68vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface)
    }

    .jt {
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
      min-width: 100%
    }

    .jt th,
    .jt td {
      padding: 6px 9px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: center
    }

    .jt th {
      position: sticky;
      top: 0;
      background: var(--surface2);
      z-index: 3;
      font-size: 12px;
      color: var(--muted)
    }

    .jt th small {
      display: block;
      font-weight: 500;
      font-size: 10px
    }

    .jt .c1,
    .jt .c2 {
      position: sticky;
      background: var(--surface);
      z-index: 2;
      text-align: left
    }

    .jt th.c1,
    .jt th.c2 {
      background: var(--surface2);
      z-index: 4
    }

    .jt .c1 {
      left: 0;
      min-width: 34px
    }

    .jt .c2 {
      left: 34px;
      min-width: 190px;
      border-right: 1px solid var(--border)
    }

    .jt .jc {
      font-weight: 800;
      letter-spacing: .12em;
      min-width: 42px
    }

    .jt .jc.ok {
      background: rgba(52, 211, 153, .18);
      color: var(--green)
    }

    .jt .jc.late {
      background: rgba(245, 158, 11, .2);
      color: #f59e0b
    }

    .jt .jc.no {
      background: rgba(248, 113, 113, .2);
      color: var(--red)
    }

    .jt .jc.exc {
      background: rgba(59, 130, 246, .2);
      color: #60a5fa
    }

    .jt .dim {
      color: var(--muted);
      font-weight: 400
    }

    /* ---------- Лимит пропусков ---------- */
    .abs {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin: 16px 0
    }

    .abs-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center
    }

    .abs small {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .abs-num {
      font-size: 24px;
      font-weight: 800;
      white-space: nowrap
    }

    .abs p {
      margin: 8px 0 0;
      font-weight: 600
    }

    .abs-warn {
      border-color: #f59e0b
    }

    .abs-warn .progress i {
      background: #f59e0b
    }

    .abs-warn p,
    .abs-warn .abs-num {
      color: #f59e0b
    }

    .abs-red {
      border-color: var(--red);
      background: var(--red-bg)
    }

    .abs-red .progress i {
      background: var(--red)
    }

    .abs-red p,
    .abs-red .abs-num {
      color: var(--red)
    }

    .att-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px
    }

    .att-b.on:disabled {
      opacity: 1
    }

    .lock {
      color: var(--muted);
      font-size: 11px
    }

    .jt .jc[data-action] {
      cursor: pointer
    }

    .jt .jc[data-action]:hover {
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    /* ---------- Права: у студента нет кнопок правки ---------- */
    body.ro .inline-add,
    body.ro #fab {
      display: none !important
    }

    .g-day small {
      display: block;
      font-size: 10px;
      font-weight: 500;
      opacity: .8
    }

    .lesson.cancelled {
      background: var(--red-bg);
      border-left-color: var(--red);
      opacity: .9
    }

    .lesson.cancelled b {
      text-decoration: line-through
    }

    .lesson.was {
      opacity: .45
    }

    .lesson.repl {
      background: var(--yellow-bg);
      border-left-color: var(--yellow);
      cursor: default
    }

    .lesson .cancel-b {
      background: var(--red);
      color: #fff
    }

    .lesson .repl-b {
      background: var(--yellow);
      color: #1b1300
    }

    .tag.bad {
      background: rgba(248, 113, 113, .18);
      color: var(--red);
      font-weight: 700
    }

    .tag.warnb {
      background: var(--yellow-bg);
      color: var(--yellow);
      font-weight: 700
    }

    .chg-card {
      margin-bottom: 14px
    }

    .chg-box {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin: 6px 0 14px
    }

    .chg-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      padding-bottom: 14px
    }

    .notif-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      border-color: var(--accent)
    }

    .notif-banner p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 26px;
      flex: none
    }

    .switch input {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      z-index: 2
    }

    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: .2s
    }

    .switch span::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--muted);
      transition: .2s
    }

    .switch input:checked+span {
      background: var(--accent);
      border-color: var(--accent)
    }

    .switch input:checked+span::after {
      left: 20px;
      background: #fff
    }

    /* ==========================================================================
   ТЕМЫ ОФОРМЛЕНИЯ. Каждая тема — набор CSS-переменных (+ фоновый SVG-слой #bgfx, см. Themes.layer)
   ========================================================================== */
    body {
      background-image: var(--bg-image, none);
      background-attachment: fixed;
      background-size: cover
    }

    #bgfx {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden
    }

    #bgfx svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    .shell {
      position: relative;
      z-index: 1
    }

    /* 💗 Барби */
    :root[data-theme="barbie"] {
      --bg: #ffe6f2;
      --bg-image: radial-gradient(circle at 12% 8%, #fff 0, transparent 32%), linear-gradient(160deg, #ffd0e7, #ffeaf5 52%, #ffbfdc);
      --surface: #fff8fc;
      --surface2: #ffdff0;
      --border: rgba(214, 0, 111, .17);
      --text: #4d1034;
      --muted: #a05482;
      --accent: #ff2d95;
      --accent-hover: #ff59ac;
      --accent-soft: rgba(255, 45, 149, .14);
      --accent-text: #d40078;
      --red: #e11d48;
      --red-bg: rgba(225, 29, 72, .1);
      --yellow: #b45309;
      --yellow-bg: rgba(245, 158, 11, .16);
      --green: #059669;
      --mark: rgba(255, 45, 149, .25);
      --shadow: 0 10px 28px rgba(255, 45, 149, .22);
      color-scheme: light
    }

    :root[data-theme="barbie"] .btn.primary,
    :root[data-theme="barbie"] .att-b.on,
    :root[data-theme="barbie"] .seg .on {
      background-image: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 58%)
    }

    :root[data-theme="barbie"] .card,
    :root[data-theme="barbie"] .stat {
      background-image: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 40%)
    }

    :root[data-theme="barbie"] .page-head h1 {
      background: linear-gradient(90deg, #ff2d95, #ff7bc0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    /* 🌊 Океан */
    :root[data-theme="ocean"] {
      --bg: #031a2b;
      --bg-image: linear-gradient(180deg, #05405e 0, #032b43 42%, #02121f 100%);
      --surface: #07344d;
      --surface2: #0c4562;
      --border: rgba(125, 211, 252, .18);
      --text: #e4f6ff;
      --muted: #8fc3d9;
      --accent: #14b8c4;
      --accent-hover: #2dd4df;
      --accent-soft: rgba(20, 184, 196, .2);
      --accent-text: #6aeef5;
      --red: #fb7185;
      --red-bg: rgba(251, 113, 133, .13);
      --yellow: #fcd34d;
      --yellow-bg: rgba(252, 211, 77, .12);
      --green: #34d399;
      --mark: rgba(252, 211, 77, .28);
      --shadow: 0 10px 30px rgba(0, 20, 40, .5);
      color-scheme: dark
    }

    /* 🌌 Космос */
    :root[data-theme="space"] {
      --bg: #02030b;
      --bg-image: radial-gradient(ellipse at 82% 0, #1d1355 0, transparent 46%), radial-gradient(ellipse at 8% 100%, #0f2756 0, transparent 42%), #02030b;
      --surface: #0b1030;
      --surface2: #131a45;
      --border: rgba(165, 180, 252, .17);
      --text: #eaeefe;
      --muted: #9aa5d6;
      --accent: #8b7bff;
      --accent-hover: #a095ff;
      --accent-soft: rgba(139, 123, 255, .2);
      --accent-text: #c4bcff;
      --red: #ff7b8f;
      --red-bg: rgba(255, 123, 143, .12);
      --yellow: #ffd166;
      --yellow-bg: rgba(255, 209, 102, .12);
      --green: #5eead4;
      --mark: rgba(255, 209, 102, .26);
      --shadow: 0 10px 30px rgba(0, 0, 10, .6);
      color-scheme: dark
    }

    /* 🌿 Сад */
    :root[data-theme="garden"] {
      --bg: #e8f6e2;
      --bg-image: linear-gradient(170deg, #d8f0cd, #f1fbea 58%, #cfeac1);
      --surface: #fbfff8;
      --surface2: #e2f3da;
      --border: rgba(47, 120, 60, .17);
      --text: #1d3a25;
      --muted: #5d8967;
      --accent: #2f9e44;
      --accent-hover: #40c057;
      --accent-soft: rgba(47, 158, 68, .14);
      --accent-text: #1f7a33;
      --red: #d6336c;
      --red-bg: rgba(214, 51, 108, .09);
      --yellow: #a05a00;
      --yellow-bg: rgba(245, 158, 11, .16);
      --green: #2f9e44;
      --mark: rgba(250, 204, 21, .45);
      --shadow: 0 8px 24px rgba(40, 110, 50, .15);
      color-scheme: light
    }

    /* ✨ Магия */
    :root[data-theme="magic"] {
      --bg: #12062a;
      --bg-image: radial-gradient(circle at 18% 0, #3b1773 0, transparent 46%), radial-gradient(circle at 92% 92%, #5a1d6b 0, transparent 42%), #12062a;
      --surface: #1c0e3d;
      --surface2: #2a1658;
      --border: rgba(251, 191, 36, .22);
      --text: #f6efff;
      --muted: #bda6e6;
      --accent: #a78bfa;
      --accent-hover: #b9a3fc;
      --accent-soft: rgba(167, 139, 250, .2);
      --accent-text: #d6c8ff;
      --gold: #fbbf24;
      --red: #ff7b9c;
      --red-bg: rgba(255, 123, 156, .13);
      --yellow: #fbbf24;
      --yellow-bg: rgba(251, 191, 36, .13);
      --green: #6ee7b7;
      --mark: rgba(251, 191, 36, .3);
      --shadow: 0 10px 32px rgba(10, 0, 30, .6);
      color-scheme: dark
    }

    :root[data-theme="magic"] .page-head h1 {
      color: var(--gold);
      text-shadow: 0 0 20px rgba(251, 191, 36, .5)
    }

    :root[data-theme="magic"] .btn.primary {
      box-shadow: 0 0 20px rgba(167, 139, 250, .6)
    }

    :root[data-theme="magic"] .nav-btn.on {
      box-shadow: inset 0 0 0 1px var(--gold)
    }

    :root[data-theme="magic"] .card {
      box-shadow: var(--shadow), 0 0 0 1px rgba(251, 191, 36, .08)
    }

    /* переключатель тем */
    .theme-pop {
      position: fixed;
      z-index: 110;
      min-width: 210px;
      padding: 8px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: pop-in .2s ease both
    }

    .theme-pop button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      font-weight: 600
    }

    .theme-pop button:hover {
      background: var(--accent-soft)
    }

    .theme-pop button.on {
      background: var(--accent-soft);
      color: var(--accent-text)
    }

    .theme-pop .ti {
      font-size: 20px;
      width: 26px;
      text-align: center
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      flex: 1;
      max-width: 560px
    }

    .theme-grid button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface2);
      font-weight: 600;
      transition: .15s
    }

    .theme-grid button.on {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .theme-grid .sw {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex: none;
      border: 2px solid rgba(128, 128, 128, .4)
    }

    /* фоновые анимации тем */
    @keyframes twinkle {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: 1
      }
    }

    @keyframes drift {
      from {
        transform: translateX(0)
      }

      to {
        transform: translateX(-50%)
      }
    }

    @keyframes rise-b {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      15% {
        opacity: .7
      }

      100% {
        transform: translateY(-110vh);
        opacity: 0
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-4deg)
      }

      50% {
        transform: rotate(5deg)
      }
    }

    @keyframes spin-s {
      to {
        transform: rotate(360deg)
      }
    }

    .fx-tw {
      animation: twinkle 3s ease-in-out infinite
    }

    .fx-wave {
      animation: drift 18s linear infinite
    }

    .fx-wave.w2 {
      animation-duration: 27s;
      animation-direction: reverse
    }

    .fx-bub {
      animation: rise-b 14s linear infinite
    }

    .fx-leaf {
      transform-box: fill-box;
      transform-origin: 0 100%;
      animation: sway 6s ease-in-out infinite
    }

    .fx-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin-s 60s linear infinite
    }

    /* ==========================================================================
   ЖИВОЙ ПОЛИТЕШИК: дыхание, моргание, настроения, ходьба
   ========================================================================== */
    .mascot .m-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: breathe 3.4s ease-in-out infinite
    }

    .mascot.m-sleepy .m-body {
      animation-duration: 6s
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1, 1) rotate(-1deg)
      }

      50% {
        transform: scale(1.035, 1.07) rotate(1.5deg)
      }
    }

    .mascot .m-eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite
    }

    @keyframes blink {

      0%,
      93%,
      100% {
        transform: scaleY(1)
      }

      96% {
        transform: scaleY(.08)
      }
    }

    .mascot.m-cheer {
      animation: jump .75s ease-in-out infinite
    }

    @keyframes jump {

      0%,
      100% {
        transform: translateY(0)
      }

      35% {
        transform: translateY(-9px)
      }
    }

    .mascot .m-star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 1s ease-in-out infinite
    }

    .mascot .m-star.s2 {
      animation-delay: .35s
    }

    .mascot .m-star.s3 {
      animation-delay: .7s
    }

    .mascot .m-tear {
      animation: tear 2.2s ease-in infinite
    }

    @keyframes tear {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      15% {
        opacity: 1
      }

      100% {
        transform: translateY(14px);
        opacity: 0
      }
    }

    .mascot .m-zzz text {
      animation: zzz 3s ease-in-out infinite;
      opacity: 0
    }

    .mascot .m-zzz text:nth-child(2) {
      animation-delay: 1s
    }

    .mascot .m-zzz text:nth-child(3) {
      animation-delay: 2s
    }

    @keyframes zzz {
      0% {
        transform: translate(0, 6px);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(8px, -14px);
        opacity: 0
      }
    }

    .mascot .m-think circle.d {
      animation: twinkle 1.4s ease-in-out infinite
    }

    .mascot .m-think circle.d:nth-of-type(2) {
      animation-delay: .25s
    }

    .mascot .m-think circle.d:nth-of-type(3) {
      animation-delay: .5s
    }

    .mascot .m-anger {
      transform-box: fill-box;
      transform-origin: center;
      animation: throb .6s ease-in-out infinite
    }

    @keyframes throb {
      50% {
        transform: scale(1.25)
      }
    }

    .mascot.m-walking {
      animation: waddle .5s ease-in-out infinite
    }

    @keyframes waddle {

      0%,
      100% {
        transform: rotate(-5deg) translateY(0)
      }

      50% {
        transform: rotate(5deg) translateY(-4px)
      }
    }

    #walker {
      position: fixed;
      z-index: 55;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      left: -90px;
      pointer-events: none;
      animation: walk-x 2.6s linear forwards
    }

    @keyframes walk-x {
      to {
        transform: translateX(calc(100vw + 120px))
      }
    }

    #cheer-toast {
      position: fixed;
      z-index: 115;
      right: 16px;
      bottom: calc(86px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: rise .3s ease both;
      pointer-events: none
    }

    #cheer-toast .bubble-t {
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-weight: 700;
      box-shadow: var(--shadow);
      max-width: 230px
    }

    /* ---------- Профиль, достижения, рейтинг, вопросы Политешика ---------- */
    .av-em {
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      line-height: 1
    }

    .av-img {
      border-radius: 50%;
      object-fit: cover;
      display: block
    }

    .avbtn {
      position: relative;
      border: 0;
      background: none;
      padding: 0;
      border-radius: 50%;
      cursor: pointer
    }

    .avbtn .av-edit {
      position: absolute;
      right: -2px;
      bottom: -2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-size: 12px
    }

    .about-card {
      margin-bottom: 16px
    }

    .about-top {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap
    }

    .about-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .av-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 8px
    }

    .av-pick {
      border: 2px solid transparent;
      border-radius: 50%;
      background: none;
      padding: 2px;
      transition: .15s
    }

    .av-pick:hover,
    .av-pick.on {
      border-color: var(--accent);
      transform: scale(1.06)
    }

    .plaque {
      margin-bottom: 12px;
      border-color: var(--yellow);
      background: var(--yellow-bg);
      font-weight: 600
    }

    .ach-head {
      margin-bottom: 6px
    }

    .ach-head h2 {
      font-size: 20px
    }

    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px
    }

    .ach {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      opacity: .6;
      filter: grayscale(.85);
      transition: .2s
    }

    .ach.got {
      opacity: 1;
      filter: none;
      border-color: var(--yellow);
      box-shadow: 0 0 0 1px var(--yellow-bg), var(--shadow)
    }

    .ach-ico {
      font-size: 30px;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--surface2);
      flex: none
    }

    .ach.got .ach-ico {
      background: var(--yellow-bg)
    }

    .ach-t b {
      display: block
    }

    .ach-t small {
      display: block;
      color: var(--muted);
      font-size: 12px
    }

    .ach-d {
      color: var(--yellow) !important
    }

    .progress.sm {
      height: 5px;
      margin: 4px 0 2px
    }

    .rank {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .rank-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface)
    }

    .rank-row.me {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .rank-row.t1 {
      background: linear-gradient(90deg, rgba(251, 191, 36, .25), transparent)
    }

    .rank-row.t2 {
      background: linear-gradient(90deg, rgba(203, 213, 225, .25), transparent)
    }

    .rank-row.t3 {
      background: linear-gradient(90deg, rgba(217, 119, 6, .22), transparent)
    }

    .rk-p {
      width: 34px;
      text-align: center;
      font-weight: 800;
      font-size: 18px
    }

    .rk-n {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      overflow-wrap: anywhere
    }

    .rk-n small {
      color: var(--muted)
    }

    .rk-s {
      font-weight: 800;
      color: var(--accent-text)
    }

    .prize-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      border-color: var(--yellow)
    }

    .prize-bar small,
    .myplace small {
      display: block;
      color: var(--muted)
    }

    .myplace {
      text-align: right
    }

    .prize-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .prize-form .input {
      flex: 1;
      min-width: 220px
    }

    .faq-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px;
      scrollbar-width: thin
    }

    .faq-b {
      flex: none;
      max-width: 260px;
      white-space: normal;
      text-align: left;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3
    }

    .faq-b:hover {
      background: var(--accent);
      color: #fff
    }

    .faq-ed {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2)
    }

    .study-link {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border)
    }

    /* ---------- Виджет и офлайн-индикатор ---------- */
    .widget {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px
    }

    .wg {
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      min-width: 0
    }

    .wg small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .wg b {
      display: block;
      font-size: 17px;
      margin: 4px 0 2px;
      overflow-wrap: anywhere
    }

    .wg span {
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 600
    }

    #net-badge {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 125;
      padding: 6px 14px;
      border-radius: 99px;
      background: #334155;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      box-shadow: var(--shadow)
    }

    @media (max-width:760px) {
      .widget {
        grid-template-columns: 1fr
      }
    }

    /* ---------- ДЗ ---------- */
    .sub-h {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 8px
    }

    .stat.link {
      cursor: pointer;
      transition: .15s
    }

    .stat.link:hover {
      border-color: var(--accent);
      transform: translateY(-2px)
    }

    @media (max-width:900px) {
      .tabbar .nav-btn {
        font-size: 10px
      }
    }

    /* ---------- Сообщения админа, переписка, предупреждение ---------- */
.msg.admin .bubble{background:var(--accent-soft);border:1px solid var(--accent)}
.msg-name{font-size:11px;font-weight:800;color:var(--accent-text);margin-bottom:3px}
.adm-av{display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;border-radius:50%;width:38px;height:38px;font-size:13px;flex:none}
.thread{max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;background:var(--surface2)}
.thr{margin-bottom:8px}.thr small{color:var(--muted)}.thr-admin b{color:var(--accent-text)}
.warn{padding:10px 12px;border-radius:var(--radius);background:var(--yellow-bg);color:var(--yellow);margin:8px 0;font-size:13px;text-align:left}
/* ---------- Адаптив ---------- */
    @media (max-width:900px) {
      .sidebar {
        display: none
      }

      .topbar {
        display: flex;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 40;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border)
      }

      .topbar b {
        font-size: 16px
      }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 45;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--border);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px))
      }

      .tabbar .nav-btn {

        gap: 2px;
        padding: 6px 2px;
        font-size: 11px;
        text-align: center;
        align-items: center
      }

      .view {
        padding: 18px 14px calc(100px + env(safe-area-inset-bottom, 0px))
      }

      .dash-cols {
        grid-template-columns: 1fr
      }

      .fab {
        display: grid;
        position: fixed;
        right: 18px;
        bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        z-index: 44;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 0;
        background: var(--accent);
        color: #fff;
        font-size: 28px;
        place-items: center;
        box-shadow: 0 10px 24px rgba(99, 102, 241, .5)
      }
    }

    @media (max-width:760px) {
      .sched-grid {
        display: none
      }

      .sched-list {
        display: block
      }

      .grid-stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px
      }

      .stat {
        padding: 12px
      }

      .stat b {
        font-size: 22px
      }

      .inline-add {
        grid-template-columns: 1fr
      }

      .item {
        flex-wrap: wrap
      }

      .item-when {
        text-align: left;
        order: 3
      }

      .row2 {
        grid-template-columns: 1fr
      }

      .page-head h1 {
        font-size: 22px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

  <script type="application/json"
