щий другие элементы.\n- **Ребёнок** — элемент внутри родителя.\n- **Сосед** — элементы одного родителя.\n\nПример: в `\u003cdiv>\u003ch1>…\u003c/h1>\u003cp>…\u003c/p>\u003c/div>` div — родитель, h1 и p — дети и соседи."},{"id":"sd_c_prog_t16","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Какие поля и атрибуты бывают в формах HTML?","a":"| Поле | Что вводим |\n|---|---|\n| type=\"text\" | однострочный текст |\n| type=\"number\" | число |\n| type=\"password\" | пароль |\n| type=\"date\" | дата |\n| type=\"color\" | цвет |\n| textarea | многострочный текст |\n| select + option | выпадающий список |\n| button type=\"submit\" | отправка формы |\n\n**Атрибуты:** `for` (= id, связывает label и поле), `name` (имя при отправке), `required`, `min`, `placeholder`, `rows`, `value`."},{"id":"sd_c_prog_t17","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Как работает CSS: подключение, селекторы, блочная модель?","a":"Подключение: `\u003clink rel=\"stylesheet\" href=\"style.css\">`.\n\n| Селектор | Запись |\n|---|---|\n| по тегу | p { } |\n| по классу | .note { } |\n| по id (уникален) | #title { } |\n\n**Блочная модель:** margin (внешний отступ) → border (граница) → padding (внутренний отступ) → content.\n\n**Расчёт:** width 300 + padding 2·20 + border 2·1 + margin 2·30 = **402 px**."},{"id":"sd_c_prog_t18","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Как проверить веб-страницу?","a":"- **DevTools (F12):** кнопка выбора элемента и вкладка Elements — DOM и применённые стили.\n- **Network** — проверка загрузки картинок и CSS.\n- **Console** — сообщения об ошибках.\n- **Валидатор** — сравнивает разметку с правилами стандарта."},{"id":"sd_c_db_0","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое система?","a":"Совокупность элементов, взаимодействующих друг с другом и образующих определённую **целостность**, единство."},{"id":"sd_c_db_1","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое элемент системы?","a":"Часть системы, имеющая определённое **функциональное назначение**."},{"id":"sd_c_db_2","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое организация системы?","a":"**Внутренняя упорядоченность**, согласованность взаимодействия элементов системы."},{"id":"sd_c_db_3","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое структура системы?","a":"**Состав, порядок и принципы взаимодействия** элементов системы, определяющие её основные свойства."},{"id":"sd_c_db_4","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое архитектура системы?","a":"Совокупность свойств системы, **существенных для пользователя**."},{"id":"sd_c_db_5","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое целостность системы?","a":"Принципиальная **несводимость свойств системы к сумме свойств её элементов** и в то же время зависимость свойств каждого элемента от его места и функции внутри системы."},{"id":"sd_c_db_6","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое информационная система (ИС)?","a":"Взаимосвязанная совокупность **средств, методов и персонала**, используемых для **хранения, обработки и выдачи информации** в интересах достижения поставленной цели."},{"id":"sd_c_db_7","subjectId":"s_opbd","cat":"Системы и ИС","q":"В чём задача ИС?","a":"Обеспечить предоставление **достоверной информации** в определённое время, определённому лицу, для определённой цели."},{"id":"sd_c_db_8","subjectId":"s_opbd","cat":"Системы и ИС","q":"Как определяет ИС федеральный закон № 149-ФЗ?","a":"Совокупность содержащейся в **базах данных** информации и обеспечивающих её обработку **информационных технологий и технических средств**."},{"id":"sd_c_db_9","subjectId":"s_opbd","cat":"Системы и ИС","q":"По каким признакам классифицируют ИС?","a":"1. Характер хранимой информации\n2. Масштаб (объём решаемых задач)\n3. Характер обработки информации\n4. Способ организации (реализуемая архитектура)"},{"id":"sd_c_db_10","subjectId":"s_opbd","cat":"Системы и ИС","q":"На какие виды делятся ИС по характеру хранимой информации?","a":"**Фактографические** и **документальные**."},{"id":"sd_c_db_11","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое фактографическая система?","a":"Система, предназначенная для **хранения**. Информация представлена краткими сведениями: числовыми и текстовыми данными, наименованиями, описаниями."},{"id":"sd_c_db_12","subjectId":"s_opbd","cat":"Системы и ИС","q":"На какие виды делятся ИС по масштабу?","a":"**Локальные, сетевые, корпоративные.**"},{"id":"sd_c_db_13","subjectId":"s_opbd","cat":"Системы и ИС","q":"Какие архитектуры ИС бывают по способу организации?","a":"**Файл-сервер** и **клиент-сервер**."},{"id":"sd_c_db_14","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое файл-серверная архитектура?","a":"Возможна многопользовательская работа с БД. Запрос выполняется над **локальной копией данных** пользователя, которую берут с сетевого сервера."},{"id":"sd_c_db_15","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое архитектура клиент-сервер?","a":"Предназначена для решения проблем файл-серверной архитектуры. Использует **выделенный сервер баз данных**, который принимает **SQL-запросы**, выполняет поиск, сортировку и т.д."},{"id":"sd_c_db_16","subjectId":"s_opbd","cat":"Системы и ИС","q":"Какие компоненты есть у информационной системы?","a":"- **Словарь данных**\n- **Администратор банка данных**\n- **Вычислительная система**\n- **Обслуживающий персонал**"},{"id":"sd_c_db_17","subjectId":"s_opbd","cat":"Системы и ИС","q":"Для чего нужен словарь данных?","a":"Для **централизованного хранения информации** о структурах данных, взаимосвязях файлов БД, типах данных и форматах их представления, о правах доступа пользователей."},{"id":"sd_c_db_18","subjectId":"s_opbd","cat":"Системы и ИС","q":"Кто такой администратор банка данных?","a":"Человек или группа лиц, которые участвуют в **разработке БД** и принимают основные решения."},{"id":"sd_c_db_19","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое вычислительная система как компонент ИС?","a":"Совокупность **программных и аппаратных средств**, обеспечивающих автоматизацию процессов приёма, обработки и выдачи информации."},{"id":"sd_c_db_20","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что делает обслуживающий персонал?","a":"Выполняет функции **поддержки технических и программных средств** и их работоспособного состояния."},{"id":"sd_c_db_21","subjectId":"s_opbd","cat":"Системы и ИС","q":"Какие два вывода сделаны про современную ИС и базы данных?","a":"1. Современная ИС должна иметь данные, организованные в **базы данных**.\n2. Создание баз данных и поддержка их функционирования осуществляются с помощью **СУБД**."},{"id":"sd_c_db_22","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое АИС?","a":"**Автоматизированная информационная система:** совокупность программно-аппаратных средств для автоматизации деятельности, связанной с **хранением, передачей и обработкой** информации."},{"id":"sd_c_db_23","subjectId":"s_opbd","cat":"Системы и ИС","q":"Что такое управление данными (по ГОСТ 20886-85)?","a":"Совокупность функций обеспечения требуемого представления данных, их **накопления и хранения, обновления, удаления, поиска** по заданному критерию и выдачи данных."},{"id":"sd_c_db_24","subjectId":"s_opbd","cat":"Системы и ИС","q":"Из каких компонентов состоит система баз данных?","a":"**Прикладное программное обеспечение, СУБД, база данных.** Между компонентами идёт двусторонний обмен данными."},{"id":"sd_c_db_25","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое данные?","a":"Факты, записанные в некоторой форме, **без объяснения смысла**. Пример: «Иванов», 18, ИС-21."},{"id":"sd_c_db_26","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое информация?","a":"**Данные, которым придан смысл** и которые помогают принимать решения. Пример: «Студенту Иванову 18 лет, он учится в группе ИС-21»."},{"id":"sd_c_db_27","subjectId":"s_opbd","cat":"БД и СУБД","q":"Чем данные отличаются от информации?","a":"**Данные** — факты без смысла. **Информация** — данные, которым придан смысл."},{"id":"sd_c_db_28","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое база данных (БД)?","a":"**Упорядоченная совокупность данных**, хранимая на компьютере и организованная по определённой модели так, чтобы её можно было многократно использовать."},{"id":"sd_c_db_29","subjectId":"s_opbd","cat":"БД и СУБД","q":"Зачем нужны базы данных?","a":"Хранить большие объёмы данных, быстро находить нужное, давать **одновременный доступ** многим пользователям, не терять и не искажать данные, защищать их от посторонних."},{"id":"sd_c_db_30","subjectId":"s_opbd","cat":"БД и СУБД","q":"Чем БД лучше обычных файлов и Excel?","a":"Много пользователей, **связи между таблицами**, контроль целостности, права доступа, язык **SQL**, восстановление после сбоев."},{"id":"sd_c_db_31","subjectId":"s_opbd","cat":"БД и СУБД","q":"Сколько данных вмещают файлы, Excel и БД?","a":"- **Файлы:** объём ограничен удобством работы.\n- **Excel:** лист вмещает около миллиона строк.\n- **БД:** очень большие объёмы."},{"id":"sd_c_db_32","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как организована работа многих пользователей в файлах, Excel и БД?","a":"- **Файлы:** нет контроля, файл можно перезаписать.\n- **Excel:** ограниченно, возможны конфликты правок.\n- **БД:** одновременная работа, блокировки и транзакции."},{"id":"sd_c_db_33","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как реализованы связи между данными в файлах, Excel и БД?","a":"- **Файлы:** нет.\n- **Excel:** вручную (например, ВПР).\n- **БД:** внешние ключи, соединения JOIN."},{"id":"sd_c_db_34","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как контролируется корректность данных в файлах, Excel и БД?","a":"- **Файлы:** нет.\n- **Excel:** ограниченный (проверка данных).\n- **БД:** ключи, CHECK, NOT NULL и другие ограничения."},{"id":"sd_c_db_35","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как ищут данные в файлах, Excel и БД?","a":"- **Файлы:** своя программа.\n- **Excel:** фильтры и формулы.\n- **БД:** язык запросов SQL."},{"id":"sd_c_db_36","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как устроены права доступа в файлах, Excel и БД?","a":"- **Файлы:** права ОС на файл.\n- **Excel:** пароль на файл или лист.\n- **БД:** права для каждого пользователя и роли."},{"id":"sd_c_db_37","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как происходит восстановление данных в файлах, Excel и БД?","a":"- **Файлы:** ручные копии.\n- **Excel:** автосохранение, копии.\n- **БД:** журнал транзакций, резервные копии."},{"id":"sd_c_db_38","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое СУБД?","a":"Программное обеспечение для **создания БД, хранения, изменения и поиска данных** и управления доступом к ним. Приложение обращается к данным только через СУБД."},{"id":"sd_c_db_39","subjectId":"s_opbd","cat":"БД и СУБД","q":"Назови функции СУБД.","a":"1. Описание структуры\n2. Работа с данными\n3. Целостность\n4. Многопользовательская работа\n5. Транзакции\n6. Защита и права доступа\n7. Резервное копирование и восстановление\n8. Оптимизация запросов"},{"id":"sd_c_db_40","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД описывает структуру?","a":"Создаёт и изменяет **таблицы, типы данных, связи** (язык DDL)."},{"id":"sd_c_db_41","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД работает с данными?","a":"**Добавляет, изменяет, удаляет и выбирает** данные (язык DML)."},{"id":"sd_c_db_42","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД обеспечивает целостность?","a":"Следит, чтобы данные удовлетворяли **ограничениям и связям**."},{"id":"sd_c_db_43","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД обеспечивает многопользовательскую работу?","a":"Согласует одновременные обращения, **блокирует конфликтующие операции**."},{"id":"sd_c_db_44","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД работает с транзакциями?","a":"Выполняет группу операций **как одно целое**: либо все, либо ни одной."},{"id":"sd_c_db_45","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД защищает данные?","a":"Проверяет, что пользователю **разрешено видеть и менять**."},{"id":"sd_c_db_46","subjectId":"s_opbd","cat":"БД и СУБД","q":"Как СУБД восстанавливает данные?","a":"Возвращает БД в рабочее состояние **после сбоя** (резервное копирование и восстановление)."},{"id":"sd_c_db_47","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что делает оптимизация запросов в СУБД?","a":"Выбирает **быстрый способ** выполнить запрос, использует индексы."},{"id":"sd_c_db_48","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое транзакция?","a":"Набор операций, который выполняется **как единое целое**. Пример: перевод денег — списать с одного счёта и зачислить на другой. Если вторая операция не удалась, первая отменяется."},{"id":"sd_c_db_49","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое MySQL?","a":"Серверная СУБД с **открытым кодом**, очень популярна для сайтов и веб-приложений."},{"id":"sd_c_db_50","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое PostgreSQL?","a":"Мощная серверная СУБД с **открытым кодом**, богатые возможности SQL, расширяемость."},{"id":"sd_c_db_51","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое SQLite?","a":"**Встраиваемая** СУБД: вся БД лежит в одном файле, отдельный сервер не нужен. Используется в приложениях и на телефонах."},{"id":"sd_c_db_52","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое MS Access?","a":"**Настольная СУБД Microsoft** с графическим интерфейсом, для небольших БД."},{"id":"sd_c_db_53","subjectId":"s_opbd","cat":"БД и СУБД","q":"Какие СУБД относятся к коммерческим серверным для крупных организаций?","a":"**Oracle Database** и **MS SQL Server**."},{"id":"sd_c_db_54","subjectId":"s_opbd","cat":"БД и СУБД","q":"Назови свойства базы данных.","a":"1. Целостность\n2. Непротиворечивость\n3. Независимость данных\n4. Защита от сбоев\n5. Разграничение доступа"},{"id":"sd_c_db_55","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что значит свойство «целостность» БД?","a":"Данные **полны и корректны**, соблюдены все ограничения. Обеспечивается ключами, ограничениями, транзакциями."},{"id":"sd_c_db_56","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что значит свойство «непротиворечивость»?","a":"Один и тот же факт **не хранится в разных местах** с разными значениями. Обеспечивается нормализацией и ссылочной целостностью."},{"id":"sd_c_db_57","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что такое независимость данных?","a":"- **Логическая:** изменение логической структуры не ломает программы.\n- **Физическая:** изменение способа хранения (файлы, индексы) не влияет на логику и программы."},{"id":"sd_c_db_58","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что значит свойство «защита от сбоев»?","a":"После отключения питания или ошибки данные **не теряются и не искажаются**. Обеспечивается журналом транзакций и резервными копиями."},{"id":"sd_c_db_59","subjectId":"s_opbd","cat":"БД и СУБД","q":"Что значит свойство «разграничение доступа»?","a":"Каждый видит и меняет **только то, что ему разрешено**. Обеспечивается пользователями, ролями, правами (`GRANT`, `REVOKE`)."},{"id":"sd_c_db_60","subjectId":"s_opbd","cat":"БД и СУБД","q":"Какие требования предъявляют к СУБД?","a":"1. Эффективное выполнение функций ПО\n2. Минимизация избыточности\n3. Предоставление непротиворечивой информации\n4. Безопасность\n5. Простота в эксплуатации\n6. Простота в физической реорганизации\n7. Возможность централизованного управления\n8. Упрощение приложений"},{"id":"sd_c_db_61","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое модель данных?","a":"**Формализованное описание**, отражающее состав и типы данных, а также взаимосвязь между ними."},{"id":"sd_c_db_62","subjectId":"s_opbd","cat":"Модели данных","q":"Из каких трёх частей состоит модель данных?","a":"1. Набор **типов структур данных**\n2. Множество **допустимых операций**, выполняемых в структуре данных\n3. **Ограничения** для контроля целостности данных"},{"id":"sd_c_db_63","subjectId":"s_opbd","cat":"Модели данных","q":"Как модели данных делятся по поколениям?","a":"- **Первое:** иерархическая, сетевая.\n- **Второе:** реляционная.\n- **Третье:** объектно-ориентированная, объектно-реляционная."},{"id":"sd_c_db_64","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое иерархическая модель?","a":"**Дерево:** данные связаны по принципу «родитель — потомок». У каждой записи **не более одного родителя**. Типы связей: 1:M. Связь M:N приходится выражать дублированием данных."},{"id":"sd_c_db_65","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое сетевая модель?","a":"**Граф:** связи могут быть произвольными. У записи **может быть несколько родителей**. Допускает M:N."},{"id":"sd_c_db_66","subjectId":"s_opbd","cat":"Модели данных","q":"Чем иерархическая модель отличается от сетевой?","a":"- **Иерархическая:** дерево, не более одного родителя, связи 1:M.\n- **Сетевая:** граф, несколько родителей, допускает M:N."},{"id":"sd_c_db_67","subjectId":"s_opbd","cat":"Модели данных","q":"Плюсы и минусы иерархической модели?","a":"- **Плюсы:** простота, быстрый доступ по иерархии.\n- **Минусы:** жёсткая структура; удаление родителя ведёт к удалению потомков.\n\nПример: каталоги в файловой системе, СУБД IBM IMS."},{"id":"sd_c_db_68","subjectId":"s_opbd","cat":"Модели данных","q":"Плюсы и минусы сетевой модели?","a":"- **Плюсы:** гибче иерархической.\n- **Минусы:** сложная структура; программа должна «ходить» по связям вручную.\n\nПример: системы стандарта CODASYL."},{"id":"sd_c_db_69","subjectId":"s_opbd","cat":"Модели данных","q":"Кто и когда предложил реляционную модель?","a":"**Эдгар Кодд** (IBM), 1970 год. Все данные хранятся в таблицах, а связи между таблицами задаются значениями ключей."},{"id":"sd_c_db_70","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое отношение в реляционной модели?","a":"**Таблица** (например, `student`)."},{"id":"sd_c_db_71","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое кортеж?","a":"**Строка (запись)** таблицы."},{"id":"sd_c_db_72","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое атрибут в реляционной модели?","a":"**Столбец (поле)** таблицы, например `last_name`."},{"id":"sd_c_db_73","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое домен?","a":"**Множество допустимых значений** столбца. Пример: `birth_year` — целые числа."},{"id":"sd_c_db_74","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое степень отношения?","a":"Число **атрибутов (столбцов)**."},{"id":"sd_c_db_75","subjectId":"s_opbd","cat":"Модели данных","q":"Что такое кардинальность отношения?","a":"Число **кортежей (строк)**."},{"id":"sd_c_db_76","subjectId":"s_opbd","cat":"Модели данных","q":"В отношении student 5 столбцов и 6 строк. Чему равны степень и кардинальность?","a":"Степень **5**, кардинальность **6**."},{"id":"sd_c_db_77","subjectId":"s_opbd","cat":"Модели данных","q":"Назови свойства реляционной таблицы.","a":"1. Уникальность строк\n2. Порядок строк не важен\n3. Порядок столбцов не важен\n4. Атомарность значений\n5. Однотипность столбца"},{"id":"sd_c_db_78","subjectId":"s_opbd","cat":"Модели данных","q":"Что значит свойство «уникальность строк»?","a":"Нет двух одинаковых кортежей; каждую строку можно отличить по ключу. Нарушение: две одинаковые строки «Иванов Пётр 2006»."},{"id":"sd_c_db_79","subjectId":"s_opbd","cat":"Модели данных","q":"Важен ли порядок строк и столбцов в реляционной таблице?","a":"**Нет.** От перестановки строк смысл таблицы не меняется. Столбцы определяются **по имени**, а не по положению."},{"id":"sd_c_db_80","subjectId":"s_opbd","cat":"Модели данных","q":"Что значит свойство «атомарность значений»?","a":"В ячейке **одно неделимое значение**. Нарушение: в ячейке два телефона через запятую."},{"id":"sd_c_db_81","subjectId":"s_opbd","cat":"Модели данных","q":"Что значит свойство «однотипность столбца»?","a":"Все значения столбца одного типа (домена), имена столбцов уникальны. Нарушение: в столбце «год рождения» стоит слово «весна»."},{"id":"sd_c_db_82","subjectId":"s_opbd","cat":"Проектирование","q":"Назови три уровня проектирования БД.","a":"1. **Концептуальное** — ER-диаграмма\n2. **Логическое** — таблицы, ключи, связи\n3. **Физическое** — типы, индексы, хранение"},{"id":"sd_c_db_83","subjectId":"s_opbd","cat":"Проектирование","q":"Что делают на концептуальном уровне проектирования?","a":"Выясняют, какие **объекты и связи** нужны пользователям. Не привязано к конкретной СУБД. Результат: **ER-диаграмма**."},{"id":"sd_c_db_84","subjectId":"s_opbd","cat":"Проектирование","q":"Что делают на логическом уровне проектирования?","a":"Переводят ER-диаграмму в **таблицы** реляционной БД: ключи, связи, нормализация. Результат: схема таблиц."},{"id":"sd_c_db_85","subjectId":"s_opbd","cat":"Проектирование","q":"Что делают на физическом уровне проектирования?","a":"Выбирают **типы данных, индексы, способ хранения** на диске под конкретную СУБД. Результат: SQL-скрипт создания БД."},{"id":"sd_c_db_86","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое сущность?","a":"**Объект реального мира**, о котором нужно хранить данные. Примеры: студент, книга, группа."},{"id":"sd_c_db_87","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое атрибут сущности?","a":"**Свойство сущности.** Примеры: фамилия, год рождения."},{"id":"sd_c_db_88","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое связь между сущностями?","a":"**Отношение между сущностями.** Пример: студент учится в группе."},{"id":"sd_c_db_89","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое идентификатор сущности?","a":"Атрибут (набор атрибутов), **однозначно определяющий экземпляр** сущности. Пример: код студента."},{"id":"sd_c_db_90","subjectId":"s_opbd","cat":"Проектирование","q":"Какие типы связей бывают?","a":"**1:1** (один к одному), **1:M** (один ко многим), **M:N** (многие ко многим)."},{"id":"sd_c_db_91","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое связь 1:1 и как её реализуют?","a":"Одному экземпляру A соответствует **не более одного** экземпляра B и наоборот (человек — паспорт). Реализация: внешний ключ с ограничением **UNIQUE** или объединение таблиц."},{"id":"sd_c_db_92","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое связь 1:M и как её реализуют?","a":"Одному экземпляру A соответствует **много** экземпляров B (группа — студент). Реализация: **внешний ключ в таблице на стороне «многие»**."},{"id":"sd_c_db_93","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое связь M:N и как её реализуют?","a":"Много экземпляров A связано с многими экземплярами B (студент — дисциплина). Реализация: **отдельная связующая таблица с двумя внешними ключами**."},{"id":"sd_c_db_94","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое ER-диаграмма и кто её предложил?","a":"Entity-Relationship, «сущность — связь»: графическая модель, предложенная **Питером Ченом** в 1976 году."},{"id":"sd_c_db_95","subjectId":"s_opbd","cat":"Проектирование","q":"Что обозначают фигуры в нотации Чена?","a":"- **Прямоугольник** — сущность\n- **Ромб** — связь\n- **Овал** — атрибут\n\nВозле линий записывают тип связи (1, M, N)."},{"id":"sd_c_db_96","subjectId":"s_opbd","cat":"Проектирование","q":"Во что превращаются элементы ER-диаграммы при логическом проектировании?","a":"- Сущность → **таблица**\n- Атрибут → **столбец**\n- Идентификатор → **первичный ключ**\n- Связь 1:M → внешний ключ на стороне «многие»\n- Связь M:N → отдельная таблица с двумя внешними ключами\n- Связь 1:1 → внешний ключ с UNIQUE или общая таблица"},{"id":"sd_c_db_97","subjectId":"s_opbd","cat":"Проектирование","q":"Какая схема получается для примера «Университет»?","a":"~~~\nstudy_group (group_id PK, name)\nstudent (student_id PK, last_name, first_name,\n         birth_year, group_id FK -> study_group)\ndiscipline (discipline_id PK, title)\ngrade (student_id PK FK -> student,\n       discipline_id PK FK -> discipline, mark)\n~~~"},{"id":"sd_c_db_98","subjectId":"s_opbd","cat":"Проектирование","q":"Во что превратилась связь «Студент — Дисциплина» типа M:N?","a":"В таблицу `grade`: одна запись — **«оценка студента по дисциплине»**."},{"id":"sd_c_db_99","subjectId":"s_opbd","cat":"Проектирование","q":"Почему таблица называется study_group, а не group?","a":"Слово **group** в SQL **зарезервировано** (GROUP BY)."},{"id":"sd_c_db_100","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `INT`?","a":"**Целые числа.** Примеры: student_id, birth_year."},{"id":"sd_c_db_101","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `VARCHAR(n)`?","a":"**Строка переменной длины** до n символов. Пример: `last_name VARCHAR(50)`."},{"id":"sd_c_db_102","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `TEXT`?","a":"**Длинный текст.** Пример: примечание."},{"id":"sd_c_db_103","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `DATE`?","a":"**Дата.** Пример: 2007-05-14."},{"id":"sd_c_db_104","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `DECIMAL(p, s)`?","a":"**Точные дробные числа** (деньги). Пример: цена 199.90."},{"id":"sd_c_db_105","subjectId":"s_opbd","cat":"Проектирование","q":"Для чего нужен тип `BOOLEAN`?","a":"**Логическое значение** «да / нет». Пример: признак «отчислен»."},{"id":"sd_c_db_106","subjectId":"s_opbd","cat":"Проектирование","q":"Что такое индекс?","a":"Вспомогательная структура, которая **ускоряет поиск** по столбцу (как алфавитный указатель в книге)."},{"id":"sd_c_db_107","subjectId":"s_opbd","cat":"Проектирование","q":"Какова цена индекса и для каких столбцов его создают?","a":"Индекс занимает место на диске и **замедляет добавление и изменение** данных. Его создают для столбцов, по которым часто ищут или соединяют таблицы. По первичному ключу индекс создаётся **автоматически**."},{"id":"sd_c_db_108","subjectId":"s_opbd","cat":"Проектирование","q":"От чего зависят параметры хранения?","a":"От **СУБД**: расположение файлов, табличные пространства, разделение больших таблиц на части (партиции), настройки кэша."},{"id":"sd_c_db_109","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое первичный ключ (Primary Key, PK)?","a":"Поле или набор полей, которое **уникально определяет каждую запись** в таблице. Пример: `student_id` в `student`."},{"id":"sd_c_db_110","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое составной ключ?","a":"Ключ из **нескольких столбцов**: только вместе они однозначно определяют запись. Пример: `(student_id, discipline_id)` в `grade`."},{"id":"sd_c_db_111","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое внешний ключ (Foreign Key, FK)?","a":"Поле, которое **ссылается на первичный ключ другой таблицы** и создаёт связь. Пример: `group_id` в `student` ссылается на `study_group`."},{"id":"sd_c_db_112","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое потенциальный ключ?","a":"Любой набор полей, который **мог бы стать первичным** ключом (один из них выбирают первичным). Пример: номер зачётки и код студента."},{"id":"sd_c_db_113","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое суррогатный ключ?","a":"**Искусственный номер**, не несущий смысла (счётчик), в отличие от естественного ключа из самих данных. Пример: student_id = 1, 2, 3..."},{"id":"sd_c_db_114","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Какие требования предъявляют к первичному ключу?","a":"- **Уникален** в пределах таблицы\n- Не содержит **NULL**\n- Значение **не меняется**\n- **Минимален**: лишних столбцов в нём нет"},{"id":"sd_c_db_115","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое NULL?","a":"Не ноль и не пустая строка, а **«значение неизвестно или отсутствует»**."},{"id":"sd_c_db_116","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Как создать таблицу study_group с ключом и ограничениями?","a":"~~~\nCREATE TABLE study_group (\n  group_id INT PRIMARY KEY,\n  name VARCHAR(20) NOT NULL UNIQUE\n);\n~~~"},{"id":"sd_c_db_117","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Как создать таблицу student с проверкой и внешним ключом?","a":"~~~\nCREATE TABLE student (\n  student_id INT PRIMARY KEY,\n  last_name VARCHAR(50) NOT NULL,\n  first_name VARCHAR(50) NOT NULL,\n  birth_year INT CHECK (birth_year >= 1950),\n  group_id INT,\n  FOREIGN KEY (group_id)\n    REFERENCES study_group (group_id)\n);\n~~~"},{"id":"sd_c_db_118","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Как создать таблицу grade с составным ключом?","a":"~~~\nCREATE TABLE grade (\n  student_id INT,\n  discipline_id INT,\n  mark INT CHECK (mark BETWEEN 2 AND 5),\n  PRIMARY KEY (student_id, discipline_id),\n  FOREIGN KEY (student_id)\n    REFERENCES student (student_id),\n  FOREIGN KEY (discipline_id)\n    REFERENCES discipline (discipline_id)\n);\n~~~"},{"id":"sd_c_db_119","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Какие виды целостности есть?","a":"**Сущностная, ссылочная, доменная.**"},{"id":"sd_c_db_120","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое сущностная целостность?","a":"У каждой записи есть **уникальный идентификатор**. Задаётся `PRIMARY KEY` (UNIQUE + NOT NULL). Пример: нет двух студентов с одним student_id."},{"id":"sd_c_db_121","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое ссылочная целостность?","a":"Внешний ключ указывает на **существующую запись** (или равен NULL). Нельзя удалить запись, на которую ссылаются. Задаётся `FOREIGN KEY ... REFERENCES`. Пример: нельзя удалить группу, пока в ней есть студенты."},{"id":"sd_c_db_122","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что такое доменная целостность?","a":"Значения **допустимы для столбца**. Задаётся типом данных, `NOT NULL`, `UNIQUE`, `DEFAULT`, `CHECK`. Пример: mark только от 2 до 5."},{"id":"sd_c_db_123","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что делать при удалении записи, на которую есть ссылки?","a":"Действие **ON DELETE**: `RESTRICT / NO ACTION`, `CASCADE`, `SET NULL`, `SET DEFAULT`."},{"id":"sd_c_db_124","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что делает `RESTRICT / NO ACTION`?","a":"**Удаление запрещено**, пока есть связанные записи."},{"id":"sd_c_db_125","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что делает `CASCADE`?","a":"Связанные записи **удаляются вместе с главной**."},{"id":"sd_c_db_126","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что делает `SET NULL`?","a":"В связанных записях внешний ключ становится **NULL**."},{"id":"sd_c_db_127","subjectId":"s_opbd","cat":"Ключи и целостность","q":"Что делает `SET DEFAULT`?","a":"Внешний ключ получает **значение по умолчанию**."},{"id":"sd_c_db_128","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое нормализация?","a":"Процесс устранения **избыточности (дублирования)** данных и предотвращения аномалий при добавлении, изменении и удалении записей. Таблицу шаг за шагом приводят к нормальным формам."},{"id":"sd_c_db_129","subjectId":"s_opbd","cat":"Нормализация","q":"Зачем нужна нормализация?","a":"Убрать избыточность и аномалии **вставки, обновления, удаления**."},{"id":"sd_c_db_130","subjectId":"s_opbd","cat":"Нормализация","q":"Какие аномалии бывают в ненормализованной таблице?","a":"- **Избыточность**\n- **Аномалия обновления**\n- **Аномалия вставки**\n- **Аномалия удаления**"},{"id":"sd_c_db_131","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое избыточность?","a":"Данные клиента (например, телефон) **повторяются** в каждой строке заказа."},{"id":"sd_c_db_132","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое аномалия обновления?","a":"Клиент сменил телефон: нужно исправить все строки. Забыли одну, и данные **противоречат друг другу**."},{"id":"sd_c_db_133","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое аномалия вставки?","a":"Нельзя добавить нового клиента или товар, **пока нет заказа**."},{"id":"sd_c_db_134","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое аномалия удаления?","a":"Удалили единственный заказ Белова и **потеряли сведения о самом клиенте**."},{"id":"sd_c_db_135","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое функциональная зависимость?","a":"**A → B:** значение A однозначно определяет значение B. Например, `student_id → last_name`."},{"id":"sd_c_db_136","subjectId":"s_opbd","cat":"Нормализация","q":"Какие нормальные формы нужно знать?","a":"**1НФ, 2НФ, 3НФ.** Есть и более высокие (нормальная форма Бойса — Кодда, 4НФ, 5НФ), но на практике чаще всего достаточно 3НФ."},{"id":"sd_c_db_137","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое 1НФ?","a":"Все значения **атомарны**: в одной ячейке не может быть списка или массива."},{"id":"sd_c_db_138","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое 2НФ?","a":"Таблица в 1НФ и каждый неключевой атрибут зависит **от всего первичного ключа целиком** (не от его части)."},{"id":"sd_c_db_139","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое 3НФ?","a":"Таблица в 2НФ и нет **транзитивных зависимостей**: неключевые атрибуты зависят только от ключа, а не друг от друга."},{"id":"sd_c_db_140","subjectId":"s_opbd","cat":"Нормализация","q":"Как запомнить 1НФ, 2НФ и 3НФ?","a":"Каждый неключевой атрибут должен зависеть **от ключа** (1НФ), **от всего ключа** (2НФ) и **ни от чего, кроме ключа** (3НФ)."},{"id":"sd_c_db_141","subjectId":"s_opbd","cat":"Нормализация","q":"Как привести к 1НФ ячейку с двумя телефонами «111-11; 222-22»?","a":"Сделать каждое значение атомарным: две строки по одному телефону. Лучше вынести телефоны в **отдельную таблицу**."},{"id":"sd_c_db_142","subjectId":"s_opbd","cat":"Нормализация","q":"Как привести к 2НФ таблицу grade(student_id, discipline_id, mark, title)?","a":"Название дисциплины зависит только от `discipline_id`, а ключ составной. Его **выносят в отдельную таблицу** `discipline`: теперь оно хранится один раз."},{"id":"sd_c_db_143","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое транзитивная зависимость?","a":"Цепочка вида `student_id → group_id → group_name`: неключевой атрибут зависит от другого неключевого атрибута."},{"id":"sd_c_db_144","subjectId":"s_opbd","cat":"Нормализация","q":"Как привести к 3НФ таблицу student(student_id, last_name, group_id, group_name)?","a":"Название группы выносят в таблицу `study_group`. Теперь **переименование группы** — правка одной строки."},{"id":"sd_c_db_145","subjectId":"s_opbd","cat":"Нормализация","q":"Что такое денормализация?","a":"**Сознательное нарушение** нормальной формы ради скорости работы."},{"id":"sd_c_db_146","subjectId":"s_opbd","cat":"Нормализация","q":"Зачем нужна денормализация?","a":"Ускорить частые выборки и отчёты, не делать много дорогих соединений **JOIN**, хранить рассчитанные значения (например, итоговую сумму заказа), строить аналитические хранилища."},{"id":"sd_c_db_147","subjectId":"s_opbd","cat":"Нормализация","q":"Какова цена денормализации?","a":"Избыточность, риск противоречий, больше места, сложнее обновлять."},{"id":"sd_c_db_148","subjectId":"s_opbd","cat":"Нормализация","q":"Каково правило денормализации?","a":"**Сначала нормализуйте**, а денормализуйте только когда проблема с производительностью доказана."},{"id":"sd_c_db_149","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое SQL?","a":"**Structured Query Language** — декларативный язык: мы описываем, **что нужно получить**, а не как это сделать. Есть международный стандарт, но в каждой СУБД свои диалекты."},{"id":"sd_c_db_150","subjectId":"s_opbd","cat":"SQL: основы","q":"Какие группы команд есть в SQL?","a":"- **DDL** — создание и изменение структуры\n- **DML** — работа с данными\n- **DCL** — управление правами доступа\n- **TCL** — управление транзакциями"},{"id":"sd_c_db_151","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое DDL и какие у него команды?","a":"**Data Definition Language**: создание и изменение структуры. Команды: `CREATE`, `ALTER`, `DROP`."},{"id":"sd_c_db_152","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое DML и какие у него команды?","a":"**Data Manipulation Language**: работа с данными. Команды: `SELECT`, `INSERT`, `UPDATE`, `DELETE`."},{"id":"sd_c_db_153","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое DCL?","a":"Управление **правами доступа**: `GRANT`, `REVOKE`."},{"id":"sd_c_db_154","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое TCL?","a":"Управление **транзакциями**: `COMMIT`, `ROLLBACK`."},{"id":"sd_c_db_155","subjectId":"s_opbd","cat":"SQL: основы","q":"Что такое DQL?","a":"Команду `SELECT` иногда выделяют в отдельную группу — **DQL (запросы)**."},{"id":"sd_c_db_156","subjectId":"s_opbd","cat":"SQL: основы","q":"Как создать таблицу discipline?","a":"~~~\nCREATE TABLE discipline (\n  discipline_id INT PRIMARY KEY,\n  title VARCHAR(100) NOT NULL\n);\n~~~"},{"id":"sd_c_db_157","subjectId":"s_opbd","cat":"SQL: основы","q":"Как добавить столбец email в таблицу student?","a":"~~~\nALTER TABLE student ADD COLUMN email VARCHAR(100);\n~~~"},{"id":"sd_c_db_158","subjectId":"s_opbd","cat":"SQL: основы","q":"Как удалить таблицу целиком?","a":"~~~\nDROP TABLE discipline;\n~~~"},{"id":"sd_c_db_159","subjectId":"s_opbd","cat":"SQL: основы","q":"Как добавить строку в таблицу study_group?","a":"~~~\nINSERT INTO study_group (group_id, name) VALUES (1, 'ИС-21');\n~~~"},{"id":"sd_c_db_160","subjectId":"s_opbd","cat":"SQL: основы","q":"Как перевести студента 5 в группу 2?","a":"~~~\nUPDATE student SET group_id = 2 WHERE student_id = 5;\n~~~"},{"id":"sd_c_db_161","subjectId":"s_opbd","cat":"SQL: основы","q":"Как удалить студента с номером 6?","a":"~~~\nDELETE FROM student WHERE student_id = 6;\n~~~"},{"id":"sd_c_db_162","subjectId":"s_opbd","cat":"SQL: основы","q":"Как выбрать фамилии и годы рождения всех студентов?","a":"~~~\nSELECT last_name, birth_year FROM student;\n~~~"},{"id":"sd_c_db_163","subjectId":"s_opbd","cat":"SQL: основы","q":"Что будет, если написать UPDATE или DELETE без WHERE?","a":"Изменятся или удалятся **все строки таблицы**. Условие нужно писать всегда."},{"id":"sd_c_db_164","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Какова общая запись запроса SELECT?","a":"~~~\nSELECT столбцы или выражения\nFROM таблица\n[JOIN другая_таблица ON условие_соединения]\n[WHERE условие для строк]\n[GROUP BY столбцы для группировки]\n[HAVING условие для групп]\n[ORDER BY столбцы [ASC | DESC]];\n~~~"},{"id":"sd_c_db_165","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"В каком порядке SQL выполняет части запроса?","a":"**FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY.** Порядок выполнения не совпадает с порядком записи."},{"id":"sd_c_db_166","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Какие операторы сравнения есть в WHERE?","a":"`=`, `\u003c>` («не равно»), `\u003c`, `>`, `\u003c=`, `>=`. Пример: `birth_year >= 2007`."},{"id":"sd_c_db_167","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что делает `BETWEEN a AND b`?","a":"Значение **в диапазоне**, границы включены. Пример: `mark BETWEEN 4 AND 5`."},{"id":"sd_c_db_168","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что делает `IN (...)`?","a":"Значение **входит в список**. Пример: `group_id IN (1, 2)`."},{"id":"sd_c_db_169","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что делает `LIKE` и что значат % и _?","a":"Проверка по **шаблону**: `%` — любые символы, `_` — один символ. Пример: `last_name LIKE 'О%'`."},{"id":"sd_c_db_170","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Как проверить значение на NULL?","a":"`IS NULL` / `IS NOT NULL`. Запись `= NULL` **не работает**. Пример: `group_id IS NULL`."},{"id":"sd_c_db_171","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Какие логические связки есть в WHERE?","a":"`AND`, `OR`, `NOT`. Пример: `birth_year = 2007 AND group_id = 1`."},{"id":"sd_c_db_172","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Выбери студентов, родившихся в 2007 году или позже, по алфавиту. Что вернёт запрос?","a":"~~~\nSELECT last_name, birth_year\nFROM student\nWHERE birth_year >= 2007\nORDER BY last_name;\n~~~\n\nРезультат: **Лебедева 2007, Орлов 2007, Смирнова 2007**."},{"id":"sd_c_db_173","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Как отсортировать по убыванию?","a":"`ORDER BY last_name DESC`. По алфавиту, по возрастанию: `ORDER BY last_name`."},{"id":"sd_c_db_174","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что считает `COUNT(*)` и чем отличается от `COUNT(столбец)`?","a":"`COUNT(*)` — **число строк**. `COUNT(столбец)` **не считает NULL**."},{"id":"sd_c_db_175","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что считают SUM, AVG, MIN и MAX?","a":"- `SUM(x)` — сумма\n- `AVG(x)` — среднее\n- `MIN(x)`, `MAX(x)` — наименьшее и наибольшее значение"},{"id":"sd_c_db_176","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Как посчитать студентов по группам и оставить группы с двумя и больше студентами?","a":"~~~\nSELECT group_id, COUNT(*) AS students\nFROM student\nGROUP BY group_id\nHAVING COUNT(*) >= 2;\n~~~\n\nРезультат: группа 1 — 3 студента, группа 2 — 2 студента."},{"id":"sd_c_db_177","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Чем WHERE отличается от HAVING?","a":"**WHERE** фильтрует **строки до группировки**, **HAVING** — **группы после неё**."},{"id":"sd_c_db_178","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Как получить фамилии студентов вместе с названием группы?","a":"~~~\nSELECT s.last_name, g.name\nFROM student s\nINNER JOIN study_group g\n  ON s.group_id = g.group_id;\n~~~\n\nДанные из связанных таблиц берут одним запросом, сопоставляя **внешний ключ с первичным**."},{"id":"sd_c_db_179","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Почему студент Новиков не попал в результат INNER JOIN?","a":"У него нет группы (**NULL**). `INNER JOIN` оставляет только строки, у которых нашлась пара."},{"id":"sd_c_db_180","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Какие виды соединений (JOIN) бывают?","a":"**INNER, LEFT, RIGHT, FULL.**"},{"id":"sd_c_db_181","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что вернёт INNER JOIN?","a":"Только строки, у которых есть **пара в обеих таблицах**."},{"id":"sd_c_db_182","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что вернёт LEFT JOIN?","a":"**Все строки A** (левой таблицы) и подходящие строки B. Где пары нет, в столбцах B будет **NULL**."},{"id":"sd_c_db_183","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что вернёт RIGHT JOIN?","a":"**Все строки B** (правой таблицы) и подходящие строки A."},{"id":"sd_c_db_184","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Что вернёт FULL JOIN?","a":"**Все строки обеих таблиц**. Где пары нет, подставляется NULL."},{"id":"sd_c_db_185","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Как показать все группы, даже без студентов, и число студентов в каждой?","a":"~~~\nSELECT g.name, COUNT(s.student_id) AS students\nFROM study_group g\nLEFT JOIN student s\n  ON s.group_id = g.group_id\nGROUP BY g.name;\n~~~\n\nРезультат: ИС-21 — 3, ИС-22 — 2, ИС-23 — **0**."},{"id":"sd_c_db_186","subjectId":"s_opbd","cat":"SELECT и JOIN","q":"Чем INNER JOIN отличается от LEFT JOIN?","a":"**INNER** оставляет только пары. **LEFT** сохраняет все строки левой таблицы, недостающее заполняет NULL."},{"id":"sd_c_db_t0","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Что такое система? Чем различаются элемент, организация, структура, архитектура и целостность системы?","a":"| Понятие | Смысл |\n|---|---|\n| Система | Совокупность взаимодействующих элементов, образующих целостность |\n| Элемент | Часть системы с функциональным назначением |\n| Организация | Внутренняя упорядоченность, согласованность взаимодействия |\n| Структура | Состав, порядок и принципы взаимодействия элементов |\n| Архитектура | Совокупность свойств, существенных для пользователя |\n| Целостность | Свойства системы несводимы к сумме свойств элементов |"},{"id":"sd_c_db_t1","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Что такое информационная система? Как её классифицируют?","a":"**ИС** — взаимосвязанная совокупность средств, методов и персонала для хранения, обработки и выдачи информации в интересах достижения цели. Её задача — обеспечить достоверную информацию в определённое время, определённому лицу, для определённой цели.\n\nПо закону № 149-ФЗ ИС — совокупность информации в базах данных и обеспечивающих её обработку информационных технологий и технических средств.\n\n**Классификация:** по характеру хранимой информации (фактографические и документальные), по масштабу (локальные, сетевые, корпоративные), по характеру обработки, по способу организации (архитектуре)."},{"id":"sd_c_db_t2","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Чем архитектура «файл-сервер» отличается от «клиент-сервер»?","a":"**Файл-сервер:** возможна многопользовательская работа с БД, но запрос выполняется над локальной копией данных пользователя, которую берут с сетевого сервера.\n\n**Клиент-сервер:** решает проблемы файл-серверной архитектуры. Используется выделенный сервер БД, который принимает SQL-запросы и сам выполняет поиск, сортировку и т.д."},{"id":"sd_c_db_t3","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Из чего состоит информационная система и система баз данных?","a":"**Компоненты ИС:** словарь данных (структуры, связи, типы, права доступа), администратор банка данных, вычислительная система (программные и аппаратные средства), обслуживающий персонал.\n\n**Система баз данных:** прикладное ПО ⇄ СУБД ⇄ база данных (двусторонний обмен)."},{"id":"sd_c_db_t4","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Чем данные отличаются от информации? Что такое БД и СУБД?","a":"**Данные** — факты без смысла («Иванов», 18). **Информация** — данные, которым придан смысл («Студенту Иванову 18 лет»).\n\n**БД** — упорядоченная совокупность данных, хранимая на компьютере по определённой модели. **СУБД** — программа для создания БД, хранения, изменения и поиска данных и управления доступом. Приложение работает с данными только через СУБД."},{"id":"sd_c_db_t5","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Какие функции выполняет СУБД?","a":"1. **Описание структуры** (DDL).\n2. **Работа с данными** (DML).\n3. **Целостность.**\n4. **Многопользовательская работа**: блокировки.\n5. **Транзакции**: все операции или ни одной.\n6. **Защита и права доступа.**\n7. **Резервное копирование и восстановление.**\n8. **Оптимизация запросов**, использование индексов."},{"id":"sd_c_db_t6","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Чем БД лучше обычных файлов и Excel?","a":"- **Много пользователей:** одновременная работа, блокировки и транзакции (в файлах нет контроля, в Excel возможны конфликты).\n- **Связи между данными:** внешние ключи и JOIN (в Excel — вручную, ВПР).\n- **Контроль корректности:** ключи, CHECK, NOT NULL.\n- **Поиск:** язык SQL.\n- **Права:** для каждого пользователя и роли.\n- **Восстановление:** журнал транзакций и резервные копии.\n- **Объём:** очень большие объёмы данных."},{"id":"sd_c_db_t7","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Назовите свойства БД и требования к СУБД.","a":"**Свойства БД:** целостность, непротиворечивость, независимость данных (логическая и физическая), защита от сбоев, разграничение доступа.\n\n**Требования к СУБД:**\n\n1. эффективное выполнение функций ПО\n2. минимизация избыточности\n3. предоставление непротиворечивой информации\n4. безопасность\n5. простота в эксплуатации\n6. простота в физической реорганизации\n7. возможность централизованного управления\n8. упрощение приложений"},{"id":"sd_c_db_t8","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Что такое транзакция? Приведите пример.","a":"**Транзакция** — набор операций, который выполняется как единое целое: либо все, либо ни одной.\n\n**Пример:** перевод денег — списать сумму с одного счёта и зачислить на другой. Если вторая операция не удалась, первая отменяется (команды TCL: COMMIT и ROLLBACK)."},{"id":"sd_c_db_t9","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Какие бывают модели данных? Чем иерархическая отличается от сетевой и реляционной?","a":"**Модель данных** — формализованное описание состава и типов данных и связей между ними; состоит из типов структур, допустимых операций и ограничений целостности.\n\n| Поколение | Модели |\n|---|---|\n| Первое | иерархическая, сетевая |\n| Второе | реляционная |\n| Третье | объектно-ориентированная, объектно-реляционная |\n\n**Иерархическая:** дерево, не более одного родителя, связи 1:M. **Сетевая:** граф, несколько родителей, допускает M:N. **Реляционная:** всё хранится в таблицах, связи задаются значениями ключей (Кодд, 1970)."},{"id":"sd_c_db_t10","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Расскажите про реляционную модель: термины и свойства таблицы.","a":"| Формальный термин | В привычных словах |\n|---|---|\n| Отношение | таблица |\n| Кортеж | строка |\n| Атрибут | столбец |\n| Домен | допустимые значения столбца |\n| Степень | число столбцов |\n| Кардинальность | число строк |\n\n**Свойства таблицы:** строки уникальны; порядок строк и столбцов не важен; значения атомарны; столбец однотипный."},{"id":"sd_c_db_t11","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Назовите три уровня проектирования БД и расскажите про ER-диаграмму.","a":"1. **Концептуальное** — какие объекты и связи нужны (результат: ER-диаграмма).\n2. **Логическое** — таблицы, ключи, связи, нормализация (схема таблиц).\n3. **Физическое** — типы данных, индексы, хранение (SQL-скрипт).\n\n**ER-диаграмма** (Питер Чен, 1976): прямоугольник — сущность, ромб — связь, овал — атрибут. Возле линий пишут тип связи (1, M, N)."},{"id":"sd_c_db_t12","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Какие бывают типы связей и как они реализуются в таблицах?","a":"| Связь | Реализация |\n|---|---|\n| 1:1 | Внешний ключ с UNIQUE или объединение таблиц |\n| 1:M | Внешний ключ в таблице на стороне «многие» |\n| M:N | Отдельная связующая таблица с двумя внешними ключами |\n\nПример: связь «Студент — Дисциплина» (M:N) превратилась в таблицу `grade`."},{"id":"sd_c_db_t13","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Расскажите про ключи: первичный, составной, внешний, потенциальный, суррогатный.","a":"- **Первичный (PK)** — однозначно определяет запись. Уникален, без NULL, не меняется, минимален.\n- **Составной** — из нескольких столбцов, например (student_id, discipline_id).\n- **Внешний (FK)** — ссылается на первичный ключ другой таблицы.\n- **Потенциальный** — любой набор полей, который мог бы стать первичным ключом.\n- **Суррогатный** — искусственный номер без смысла (счётчик)."},{"id":"sd_c_db_t14","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Какие бывают виды целостности? Что значит ON DELETE?","a":"| Вид | Что гарантирует | Как задаётся |\n|---|---|---|\n| Сущностная | уникальный идентификатор записи | PRIMARY KEY |\n| Ссылочная | внешний ключ указывает на существующую запись | FOREIGN KEY ... REFERENCES |\n| Доменная | допустимые значения столбца | тип, NOT NULL, UNIQUE, DEFAULT, CHECK |\n\n**ON DELETE:** RESTRICT / NO ACTION — удаление запрещено; CASCADE — связанные записи удаляются; SET NULL — внешний ключ становится NULL; SET DEFAULT — значение по умолчанию."},{"id":"sd_c_db_t15","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Что такое нормализация? Объясните 1НФ, 2НФ, 3НФ.","a":"**Нормализация** — устранение избыточности и аномалий (вставки, обновления, удаления).\n\n| Форма | Условие |\n|---|---|\n| 1НФ | значения атомарны |\n| 2НФ | 1НФ + каждый неключевой атрибут зависит от всего ключа |\n| 3НФ | 2НФ + нет транзитивных зависимостей |\n\n**Запоминалка:** от ключа, от всего ключа и ни от чего, кроме ключа.\n\n**Денормализация** — сознательное нарушение нормальной формы ради скорости; сначала нормализуют, потом денормализуют только при доказанной проблеме."},{"id":"sd_c_db_t16","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Чем DDL отличается от DML? Приведите команды.","a":"**DDL** (структура): `CREATE`, `ALTER`, `DROP`. **DML** (данные): `SELECT`, `INSERT`, `UPDATE`, `DELETE`.\n\nДополнительно: **DCL** (права) — GRANT, REVOKE; **TCL** (транзакции) — COMMIT, ROLLBACK.\n\n~~~\nINSERT INTO study_group (group_id, name) VALUES (1, 'ИС-21');\nUPDATE student SET group_id = 2 WHERE student_id = 5;\nDELETE FROM student WHERE student_id = 6;\n~~~\n\n**Осторожно:** UPDATE и DELETE без WHERE затрагивают все строки."},{"id":"sd_c_db_t17","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Чем WHERE отличается от HAVING? В каком порядке выполняется SELECT?","a":"**WHERE** фильтрует строки до группировки, **HAVING** — группы после неё.\n\nПорядок выполнения: **FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY**. Он не совпадает с порядком записи.\n\n~~~\nSELECT group_id, COUNT(*) AS students\nFROM student\nGROUP BY group_id\nHAVING COUNT(*) >= 2;\n~~~"},{"id":"sd_c_db_t18","subjectId":"s_opbd","cat":"Вопросы к зачёту","q":"Какие бывают соединения JOIN? Чем INNER JOIN отличается от LEFT JOIN?","a":"| Соединение | Что вернёт |\n|---|---|\n| INNER | только строки с парой в обеих таблицах |\n| LEFT | все строки левой таблицы, где пары нет — NULL |\n| RIGHT | все строки правой таблицы |\n| FULL | все строки обеих таблиц, где пары нет — NULL |\n\n**Пример:** Новиков без группы не попадёт в INNER JOIN, а при LEFT JOIN от группы к студентам группа ИС-23 без студентов покажется со счётчиком 0."},{"id":"sd_c_evm_0","subjectId":"s_evm","cat":"Матрицы","q":"Что такое матрица? Как записывают её размер?","a":"**Прямоугольная таблица** чисел из m строк и n столбцов. Размер записывают **m×n** — сначала строки, потом столбцы. Элемент a_ij стоит в i-й строке и j-м столбце."},{"id":"sd_c_evm_1","subjectId":"s_evm","cat":"Матрицы","q":"Какая матрица называется квадратной?","a":"Та, у которой **m = n**. Число n называют **порядком** матрицы (2×2, 3×3)."},{"id":"sd_c_evm_2","subjectId":"s_evm","cat":"Матрицы","q":"Что такое единичная и нулевая матрица?","a":"**Единичная E** — на главной диагонали единицы, остальные нули. **Нулевая O** — все элементы равны 0."},{"id":"sd_c_evm_3","subjectId":"s_evm","cat":"Матрицы","q":"Какие матрицы называют диагональной и треугольной?","a":"**Диагональная** — ненулевые элементы только на главной диагонали. **Треугольная** — под (или над) главной диагональю одни нули."},{"id":"sd_c_evm_4","subjectId":"s_evm","cat":"Матрицы","q":"Что такое транспонированная матрица Aᵀ?","a":"Матрица, у которой **строки и столбцы поменялись местами**: (Aᵀ)_ij = a_ji."},{"id":"sd_c_evm_5","subjectId":"s_evm","cat":"Действия","q":"Когда определено сложение матриц? Формула.","a":"Только для матриц **одинакового размера**: C = A + B, где **c_ij = a_ij + b_ij**. Вычитание аналогично."},{"id":"sd_c_evm_6","subjectId":"s_evm","cat":"Действия","q":"Как умножить матрицу на число?","a":"**B = k·A**, где b_ij = k·a_ij — каждый элемент умножается на k."},{"id":"sd_c_evm_7","subjectId":"s_evm","cat":"Действия","q":"Какие матрицы называются противоположными?","a":"A и **(−A) = (−1)·A**."},{"id":"sd_c_evm_8","subjectId":"s_evm","cat":"Действия","q":"Назови свойства сложения и умножения на число.","a":"- A + B = B + A\n- (A + B) + C = A + (B + C)\n- A + O = A, A + (−A) = O\n- k(A + B) = kA + kB\n- (k + l)A = kA + lA"},{"id":"sd_c_evm_9","subjectId":"s_evm","cat":"Преобразования","q":"Какие матрицы называются эквивалентными? Как это записывают?","a":"Если одна получается из другой **элементарными преобразованиями**. Записывают знаком **~**, а не «=»."},{"id":"sd_c_evm_10","subjectId":"s_evm","cat":"Преобразования","q":"Назови элементарные преобразования матрицы.","a":"1. Перестановка двух строк\n2. Умножение строки на число k ≠ 0\n3. Прибавление к строке другой строки, умноженной на число\n4. Вычёркивание нулевой (или повторяющейся) строки\n5. Те же операции над столбцами"},{"id":"sd_c_evm_11","subjectId":"s_evm","cat":"Преобразования","q":"Почему над системой уравнений нельзя переставлять столбцы?","a":"Это **переименование неизвестных**. Над системой разрешены только преобразования строк."},{"id":"sd_c_evm_12","subjectId":"s_evm","cat":"Преобразования","q":"Какая матрица называется канонической?","a":"У неё в начале главной диагонали стоят **подряд несколько единиц**, остальные элементы равны 0. Любую матрицу можно привести к каноническому виду."},{"id":"sd_c_evm_13","subjectId":"s_evm","cat":"Преобразования","q":"Что такое ранг матрицы и как его найти?","a":"**Ранг** — число единиц в канонической матрице = число ненулевых строк в ступенчатом виде = наибольший порядок ненулевого минора. Элементарные преобразования ранг **не меняют**."},{"id":"sd_c_evm_14","subjectId":"s_evm","cat":"Произведение","q":"Когда существует произведение A·B? Какого размера результат?","a":"Когда **число столбцов A = числу строк B**. (m×n)·(n×p) = **(m×p)**."},{"id":"sd_c_evm_15","subjectId":"s_evm","cat":"Произведение","q":"Формула элемента произведения матриц.","a":"**c_ik = a_i1·b_1k + a_i2·b_2k + … + a_in·b_nk** — строка i первой матрицы умножается на столбец k второй."},{"id":"sd_c_evm_16","subjectId":"s_evm","cat":"Произведение","q":"Коммутативно ли умножение матриц?","a":"**Нет:** в общем случае A·B ≠ B·A, а иногда B·A вообще не существует."},{"id":"sd_c_evm_17","subjectId":"s_evm","cat":"Произведение","q":"Свойства умножения матриц.","a":"- (A·B)·C = A·(B·C)\n- A(B + C) = AB + AC\n- A·E = E·A = A\n- (A·B)ᵀ = Bᵀ·Aᵀ — **порядок меняется**"},{"id":"sd_c_evm_18","subjectId":"s_evm","cat":"Определители","q":"Что такое определитель? Для каких матриц он существует?","a":"Число det A (|A|, Δ), сопоставленное **квадратной** матрице порядка N. У неквадратных матриц определителя нет."},{"id":"sd_c_evm_19","subjectId":"s_evm","cat":"Определители","q":"Формула определителя 2×2.","a":"**det A = a11·a22 − a12·a21** — главная диагональ минус побочная.\n\nПример: |3 2; 1 4| = 3·4 − 2·1 = 10."},{"id":"sd_c_evm_20","subjectId":"s_evm","cat":"Определители","q":"Как вычислить определитель 3×3?","a":"**Правило треугольников** или **схема Саррюса** (дописать справа первые два столбца). Три слагаемых со знаком «+» и три со знаком «−»."},{"id":"sd_c_evm_21","subjectId":"s_evm","cat":"Определители","q":"Применима ли схема Саррюса к матрице 4×4?","a":"**Нет.** Она работает только для 3×3. Для порядка 4 и выше — разложение по строке или столбцу."},{"id":"sd_c_evm_22","subjectId":"s_evm","cat":"Определители","q":"Что будет с определителем при перестановке двух строк?","a":"Он **меняет знак**."},{"id":"sd_c_evm_23","subjectId":"s_evm","cat":"Определители","q":"Когда определитель равен нулю?","a":"Если есть **нулевая строка** или **две одинаковые (пропорциональные) строки**."},{"id":"sd_c_evm_24","subjectId":"s_evm","cat":"Определители","q":"Изменится ли det, если к строке прибавить другую, умноженную на число?","a":"**Нет.** Так определитель приводят к треугольному виду."},{"id":"sd_c_evm_25","subjectId":"s_evm","cat":"Определители","q":"Чему равен det(kA) для матрицы порядка n?","a":"**kⁿ·det A**, а не k·det A."},{"id":"sd_c_evm_26","subjectId":"s_evm","cat":"Определители","q":"Чему равен определитель треугольной (диагональной) матрицы?","a":"**Произведению элементов главной диагонали.**"},{"id":"sd_c_evm_27","subjectId":"s_evm","cat":"Определители","q":"Назови ещё свойства: транспонирование, произведение, единичная.","a":"- det Aᵀ = det A\n- det(A·B) = det A · det B\n- det E = 1"},{"id":"sd_c_evm_28","subjectId":"s_evm","cat":"Миноры","q":"Что такое минор M_ij?","a":"Определитель, который получается из исходного **вычёркиванием i-й строки и j-го столбца** (порядок на 1 меньше)."},{"id":"sd_c_evm_29","subjectId":"s_evm","cat":"Миноры","q":"Что такое алгебраическое дополнение A_ij?","a":"**A_ij = (−1)^(i+j)·M_ij.** Знак «+», если i + j чётно, «−», если нечётно. Знаки удобно брать по «шахматке»."},{"id":"sd_c_evm_30","subjectId":"s_evm","cat":"Миноры","q":"Как разложить определитель по строке или столбцу?","a":"det A равен сумме произведений элементов ряда на их алгебраические дополнения:\n\n**det A = a_i1·A_i1 + … + a_in·A_in** (по i-й строке) или по столбцу."},{"id":"sd_c_evm_31","subjectId":"s_evm","cat":"Миноры","q":"По какому ряду лучше раскладывать определитель?","a":"По тому, где **больше нулей** — остаётся меньше слагаемых. Можно сначала обнулить элементы ряда (свойство 5)."},{"id":"sd_c_evm_32","subjectId":"s_evm","cat":"Миноры","q":"Чему равна сумма a_i1·A_k1 + … + a_in·A_kn при i ≠ k?","a":"**Нулю** («чужие» дополнения). На этом построен метод обратной матрицы."},{"id":"sd_c_evm_33","subjectId":"s_evm","cat":"СЛАУ","q":"Что такое СЛАУ? Что такое A, X, B в записи A·X = B?","a":"Система линейных алгебраических уравнений. **A** — матрица коэффициентов, **X** — столбец неизвестных, **B** — столбец свободных членов. **A·X = B** — матричная форма."},{"id":"sd_c_evm_34","subjectId":"s_evm","cat":"СЛАУ","q":"Что такое расширенная матрица системы?","a":"**Ā = (A | B)** — матрица A, дополненная столбцом свободных членов."},{"id":"sd_c_evm_35","subjectId":"s_evm","cat":"СЛАУ","q":"Какие бывают системы по числу решений?","a":"- **Несовместная** — решений нет\n- **Совместная определённая** — решение одно\n- **Совместная неопределённая** — решений много"},{"id":"sd_c_evm_36","subjectId":"s_evm","cat":"СЛАУ","q":"Что такое однородная система?","a":"Все свободные члены равны 0. Она **всегда совместна**: есть нулевое решение x1 = x2 = … = 0."},{"id":"sd_c_evm_37","subjectId":"s_evm","cat":"СЛАУ","q":"Сформулируй теорему Кронекера — Капелли.","a":"- rang A \u003c rang Ā → **несовместна**\n- rang A = rang Ā = n → **одно решение**\n- rang A = rang Ā = r \u003c n → **бесконечно много** решений ((n − r) свободных неизвестных)"},{"id":"sd_c_evm_38","subjectId":"s_evm","cat":"СЛАУ","q":"В чём суть метода Гаусса?","a":"Расширенную матрицу элементарными преобразованиями строк приводят к **ступенчатому виду**, затем идёт **обратный ход** — находят неизвестные снизу вверх."},{"id":"sd_c_evm_39","subjectId":"s_evm","cat":"Крамер","q":"Формулы Крамера. Как получить Δx, Δy, Δz?","a":"**x = Δx/Δ, y = Δy/Δ, z = Δz/Δ.** В главном определителе Δ столбец нужной переменной заменяют столбцом свободных членов."},{"id":"sd_c_evm_40","subjectId":"s_evm","cat":"Крамер","q":"Когда применим метод Крамера?","a":"Когда **число уравнений = числу неизвестных** и **Δ ≠ 0**."},{"id":"sd_c_evm_41","subjectId":"s_evm","cat":"Крамер","q":"Что делать, если Δ = 0?","a":"Если хоть один из Δx, Δy, Δz ≠ 0 — система **несовместна**. Если все равны 0 — Крамер не помогает, решаем **методом Гаусса** (через ранги)."},{"id":"sd_c_evm_42","subjectId":"s_evm","cat":"Обратная матрица","q":"Что такое обратная матрица? Когда она существует?","a":"A⁻¹, для которой **A·A⁻¹ = A⁻¹·A = E**. Существует тогда и только тогда, когда **det A ≠ 0** (матрица невырожденная)."},{"id":"sd_c_evm_43","subjectId":"s_evm","cat":"Обратная матрица","q":"Формула обратной матрицы через алгебраические дополнения.","a":"**A⁻¹ = (1/det A)·(A_ij)ᵀ** — матрица из алгебраических дополнений, транспонированная: A_ij записывается на место (j, i)."},{"id":"sd_c_evm_44","subjectId":"s_evm","cat":"Обратная матрица","q":"Формула обратной матрицы 2×2.","a":"A = (a b; c d) → **A⁻¹ = 1/(ad − bc) · (d −b; −c a)**.\n\nПример: (2 1; 5 3) → det = 1 → A⁻¹ = (3 −1; −5 2)."},{"id":"sd_c_evm_45","subjectId":"s_evm","cat":"Обратная матрица","q":"Как решить уравнения A·X = B, X·A = B, A·X·C = B?","a":"- A·X = B → **X = A⁻¹·B**\n- X·A = B → **X = B·A⁻¹**\n- A·X·C = B → **X = A⁻¹·B·C⁻¹**\n\nУсловие: det A ≠ 0 (и det C ≠ 0)."},{"id":"sd_c_evm_46","subjectId":"s_evm","cat":"Обратная матрица","q":"Как решить систему через обратную матрицу?","a":"Для квадратной невырожденной A: **X = A⁻¹·B** — третий способ (кроме Крамера и Гаусса)."},{"id":"sd_c_evm_47","subjectId":"s_evm","cat":"Ошибки","q":"Какие самые частые ошибки в этой теме?","a":"- складывать матрицы разных размеров\n- считать, что A·B = B·A\n- писать «=» вместо «~» между эквивалентными матрицами\n- искать det у неквадратной матрицы\n- забывать знак (−1)^(i+j)\n- применять Саррюса к 4×4\n- Крамер при Δ = 0\n- det(kA) = k·det A"}],"notes":[{"id":"sd_n_net_n1","subjectId":"s_net","title":"Что такое сеть и какие они бывают","text":"*Источник: разделы 1–2 конспекта*\n\n> **Компьютерная сеть** — компьютеры и другие цифровые устройства, объединённые линиями связи и программами, чтобы обмениваться данными и пользоваться общими ресурсами (файлами, принтером, Интернетом).\n\n| Термин | Что означает |\n|---|---|\n| Компьютерная сеть | Компьютеры и цифровые устройства, объединённые линиями связи |\n| Вычислительная сеть | Система вычислительных элементов, которая решает определённый круг задач |\n| Сеть передачи данных | Система линий связи с устройствами, которые принимают и посылают данные |\n\n## Зачем нужна сеть\n\n- **Вместе быстрее**: несколько компьютеров решают задачу быстрее, чем один.\n- **Обмен данными**: передача, хранение и обработка информации.\n- **Общие ресурсы**: один принтер или сервер на всех.\n\n## Виды сетей по размеру\n\n| Сокращение | Расшифровка | Что это |\n|---|---|---|\n| PAN | Personal Area Network | Частная сеть, меньше 10 компьютеров |\n| LAN (ЛВС) | Local Area Network | Локальная: дом, офис, здание, институт |\n| MAN | Metropolitan Area Network | Региональная: объединяет локальные сети города |\n| WAN / GAN | Wide / Global Area Network | Глобальная: соединяет сети по всему миру. Пример: Интернет¹ |\n\n> 💡 Размеры запоминай по возрастанию: **Personal → Local → Metropolitan → Wide**. «От стола до планеты».\n\n## Виды сетей по наличию сервера\n\n| Признак | Одноранговая (peer-to-peer) | С выделенным сервером |\n|---|---|---|\n| Суть | Все компьютеры равноправны: каждый и клиент, и сервер | Есть сервер, он отвечает на запросы клиентов |\n| Плюсы | Просто и дёшево. Администратор не нужен | Единое управление, один пароль, безопасность, легко расти |\n| Минусы | Много паролей, нет общего резервного копирования. Подходит до 10 компьютеров | Сервер сломался, сеть встала. Нужен специалист. Дороже |\n\n> **Клиент** — компьютер, который запрашивает услугу или ресурс. **Сервер** — компьютер, который отвечает на такие запросы.\n\n## ❗ Проверь по тетради\n- ¹ Глобальные сети появились раньше локальных: терминалы подключали к мейнфрейму через телефонную сеть с помощью модемов.","order":1},{"id":"sd_n_net_n2","subjectId":"s_net","title":"Компоненты сети и оборудование","text":"*Источник: раздел 3 конспекта*\n\n## Шесть компонентов сети\n\n| Компонент | Что это | Примеры |\n|---|---|---|\n| Узлы (хосты) | Устройства, которые обмениваются данными | Компьютеры, серверы, сетевые принтеры, IP-телефоны |\n| Сетевая карта (NIC) | Подключает устройство к среде передачи, формирует кадры, кодирует биты в сигналы. Работает через драйвер | Плата в компьютере, разъём RJ-45 |\n| Среда передачи | То, по чему идут сигналы | Кабель (витая пара, коаксиал, оптоволокно), радиоволны |\n| Сетевое оборудование | Соединяет устройства и управляет потоками данных | Коммутатор, маршрутизатор, хаб |\n| Программы | Заставляют всё это работать | ОС, драйверы, прикладные программы |\n| Протоколы | Правила и формат обмена данными | TCP/IP, HTTP, FTP, Ethernet |\n\n> 💡 Компоненты запоминай по первым буквам: **У-С-С-О-П-П** (Узлы, Сетевая карта, Среда, Оборудование, Программы, Протоколы).\n\n## Пассивное и активное оборудование\n\n|   | Пассивное | Активное |\n|---|---|---|\n| Суть | Нет «интеллекта», просто соединяет | Обрабатывает данные и принимает решения |\n| Примеры | Кабель, разъёмы RJ-45, патч-панель, телекоммуникационный шкаф, повторитель, концентратор (хаб)¹ | Коммутатор (свитч), маршрутизатор (роутер) |\n\n## Хаб, мост, коммутатор, маршрутизатор, шлюз\n\n| Устройство | Уровень OSI | Что делает | Смотрит на |\n|---|---|---|---|\n| Хаб (концентратор) | 1 (физический) | Простейшее устройство для подключения компьютеров. Принимает, усиливает и распределяет сигнал с одного порта на все остальные. Устарел | ничего |\n| Мост | 2 (канальный) | Объединяет в единую сеть разнородные сегменты (часто с разной топологией). Может работать как повторитель: увеличивает длину сети и число подключений. Умеет фильтровать и разделять трафик | MAC-адрес |\n| Коммутатор (свитч) | 2 (канальный) | Центральный узел топологии «звезда». Отправляет данные на конкретный порт, поэтому доставка быстрее. Строит много виртуальных каналов между портами и ведёт обмен параллельно. Хранит таблицу «MAC-адрес → порт» | MAC-адрес |\n| Маршрутизатор (роутер) | 3 (сетевой) | Самое «интеллектуальное» устройство. Анализирует адреса, определяет наилучший маршрут и пересылает пакеты. Умеет искать проблемы в сети, фильтровать данные, вести статистику | IP-адрес |\n| Шлюз | разные | Соединяет разные сетевые архитектуры. Имеет физические порты для разнородных систем и «понимает» разные протоколы, выступая «переводчиком». Пример: беспроводная точка доступа Wi-Fi² | протоколы |\n\n> 💡 Чем выше уровень, тем умнее устройство: хаб (1) шлёт всем, коммутатор (2) помнит MAC-адреса, маршрутизатор (3) знает IP и выбирает путь. **Шлюз** — переводчик между протоколами.\n\n> **Хаб или коммутатор?** Хаб отправляет данные всем. Коммутатор — только получателю, потому что помнит, кто к какому порту подключён. Поэтому он быстрее и безопаснее. **Маршрутизатор** работает не внутри сети, а между сетями. **Шлюз** переводит между разными протоколами и архитектурами.\n\n## ❗ Проверь по тетради\n- ¹ В конспекте хаб указан в списке пассивного оборудования рядом с повторителем, хотя в таблице устройств он описан как простейшее устройство, которое принимает и усиливает сигнал.\n- ² В конспекте пример шлюза: беспроводная точка доступа Wi-Fi (Wi-Fi по технологии Fast Ethernet).","order":2},{"id":"sd_n_net_n3","subjectId":"s_net","title":"Как всё соединяется: путь данных и кабели","text":"*Источник: раздел 4 конспекта*\n\n## Путь данных\n\nПример: печать на принтере другого компьютера.\n\n> Программа → ядро ОС → драйвер сетевой карты → сетевая карта → кабель → сетевая карта 2-го компьютера → ОС 2-го компьютера → драйвер принтера → принтер.\n\nЧтобы это работало, нужно настроить **сеть, драйверы и права доступа**.\n\n> 💡 Рассказывай путь как маршрут: сначала всё на первом компьютере (программа → ОС → драйвер → карта), потом кабель, потом то же самое на втором.\n\n## Виды кабеля\n\n| Кабель | Особенности | Где применяется |\n|---|---|---|\n| Витая пара (UTP / STP) | Разъём RJ-45, до 100 м. UTP без экрана, STP экранированная (меньше помех) | Самый распространённый, локальные сети |\n| Коаксиальный | Медная жила в изоляции и оплётке. Старый тип | Старые сети Ethernet (шина) |\n| Оптоволокно | Передаёт свет. Очень быстрый, не боится помех, большие расстояния | Магистрали, связь между зданиями |","order":3},{"id":"sd_n_net_n4","subjectId":"s_net","title":"Топологии сетей","text":"*Источник: раздел 5 конспекта*\n\n> **Топология** — способ соединения устройств сети, то есть схема расположения линий связи. **Физическая** показывает, как проложены кабели, **логическая** — как идёт сигнал.\n\n| Топология | Как соединено | Плюсы | Минусы |\n|---|---|---|---|\n| Шина (Bus) | Один общий кабель, на концах терминаторы (заглушки) | Мало кабеля, просто | Обрыв кабеля или терминатора останавливает всю сеть |\n| Кольцо (Ring) | Узлы подряд по кругу. Передаёт тот, у кого маркер | Упорядоченный доступ | Отказ одной станции может остановить сеть |\n| Звезда (Star) | Все подключены к центральному устройству (хаб или коммутатор) | Поломка одного узла не мешает остальным, легко добавлять компьютеры. Основа современных сетей | Больше кабеля. Сломался центр, встал весь сегмент |\n| Ячеистая (Mesh) | Каждый соединён с каждым (полносвязная) | Очень надёжная | Много кабеля, сложно строить |\n\n> 💡 К каждой топологии задай вопрос: «что встанет, если сломается…». Шина — кабель или терминатор. Кольцо — одна станция. Звезда — центр. Mesh — почти ничего, зато дорого.\n\nОстальные топологии — **смешанные (гибридные)**. Например, **дерево** — это несколько звёзд, соединённых между собой.¹\n\n> ❓ Сколько базовых топологий считать: четыре или пять? В методичке Вахранева ещё есть решётка, у Тойгожиновой четыре.\n\n## ❗ Проверь по тетради\n- ¹ В методичке Вахранева ещё называют решётку (узлы в виде сетки), поэтому у него пять базовых топологий, а у Тойгожиновой четыре.","order":4},{"id":"sd_n_net_n5","subjectId":"s_net","title":"Приложения и модель OSI","text":"*Источник: раздел 6 конспекта*\n\n> **Приложение** (прикладное ПО) — программа, с которой работает пользователь: браузер, почта, мессенджер. Оно работает на **прикладном (7) уровне** модели OSI.\n\nМодель OSI (1984, стандарт ISO) делит передачу данных на **7 уровней**. Идём сверху вниз: от пользователя к кабелю.\n\n| № | Уровень | Что делает | Примеры |\n|---|---|---|---|\n| 7 | Прикладной | Работа программ и пользователя | HTTP, FTP, SMTP, DNS |\n| 6 | Представления | Формат данных, чтобы другой компьютер их понял | шифрование, сжатие |\n| 5 | Сеансовый | Открывает, ведёт и закрывает сеансы связи | сеанс (сессия) |\n| 4 | Транспортный | Делит данные на части и собирает обратно | TCP, UDP |\n| 3 | Сетевой | Выбор маршрута, логические (IP) адреса | IP, маршрутизатор |\n| 2 | Канальный | Передача по каналу, физические (MAC) адреса | Ethernet, коммутатор |\n| 1 | Физический | Сигналы, кабели, разъёмы | кабели, хаб |\n\n> 💡 Запоминалка по первым буквам сверху вниз: **«Прошу Приготовить Сегодня Тёплый Свежий Куриный Фарш»** = Прикладной, Представления, Сеансовый, Транспортный, Сетевой, Канальный, Физический. Придумай свою — она запомнится лучше.\n\n| Нижние 3 уровня (1–3) | Верхние 4 уровня (4–7) |\n|---|---|\n| Уровни среды передачи (media layers): физическая доставка сообщений | Уровни хост-машины (host layers): точная доставка данных |\n\n## Модель DARPA (TCP/IP) — 4 уровня\n\nСтарше OSI. Протокол — договорённость о правилах и формате обмена. Набор протоколов разных уровней — **стек протоколов**.¹\n\n| Уровень DARPA | Соответствует уровням OSI |\n|---|---|\n| Прикладной | 5–7 |\n| Транспортный | 4 |\n| Межсетевого взаимодействия | 3 |\n| Сетевого интерфейса | 1–2 |\n\n## ❗ Проверь по тетради\n- ¹ Если нужно быстро сопоставить модели: прикладной (DARPA) = 5–7 (OSI), транспортный = 4, межсетевой = 3, сетевой интерфейс = 1–2.","order":5},{"id":"sd_n_net_n6","subjectId":"s_net","title":"Протоколы по уровням OSI","text":"*Источник: раздел 7 конспекта*\n\n> **Протокол** — набор правил обмена данными. Каждый протокол работает на своём уровне модели OSI. Ниже они разложены сверху вниз: от приложений до кабеля.\n\n## Прикладной уровень (7)\n\n| Протокол | Что делает |\n|---|---|\n| HTTP | Передача гипертекста (сайтов) |\n| HTTPS | Зашифрованный HTTP |\n| SMTP | Передача электронной почты |\n| POP3 | Извлечение электронной почты с сервера |\n| IMAP | Доступ к сообщениям в сети Интернет (почта на сервере) |\n| SNTP | Синхронизация времени по компьютерной сети |\n| DNS | Переводит доменные имена в IP-адреса, понятные компьютеру |\n\nВ разделе 6 конспекта к прикладным также названы **FTP** (файлы), **DHCP** и **Telnet**.\n\n## Транспортный уровень (4)\n\n| Протокол | Что делает |\n|---|---|\n| TCP | Передача с контролем доставки, целостности и правильного порядка пакетов |\n| UDP | Без установления соединения, быстрый |\n| SCTP | Надёжная передача данных с возможностью управления потоками |\n\n## Сетевой уровень (3)\n\n| Протокол | Что делает |\n|---|---|\n| IP | Адресация и маршрутизация. IPv4 — 32-битные адреса, IPv6 — 128-битные |\n| ICMP | Диагностика сетевых проблем и сообщения об ошибках |\n| ARP | Сопоставляет IP-адреса с физическими MAC-адресами в локальной сети (LAN)¹ |\n| IGMP | Мультикаст: от одного отправителя нескольким получателям одновременно |\n| OSPF | Протокол маршрутизации: наиболее эффективный путь через IP-сеть |\n| BGP | Маршрутизация между автономными системами в Интернете |\n| RIP | Протокол динамической маршрутизации |\n| IPsec | Набор протоколов для безопасной передачи данных по IP-сетям |\n| NDP | В IPv6: взаимодействие узлов в пределах одной локальной сети |\n\n## Канальный уровень (2)\n\n| Протокол | Что делает |\n|---|---|\n| Ethernet (IEEE 802.3) | Доминирующий протокол в LAN. Использует 48-битные MAC-адреса |\n| Wi-Fi (IEEE 802.11) | Использует MAC-адреса для взаимодействия устройств |\n| PPP | Прямое соединение между двумя узлами (модемы, DSL). Аутентификация, шифрование, сжатие |\n| HDLC | Бит-ориентированный протокол ISO. Надёжная передача между точками |\n| Frame Relay | Технология передачи данных для межсетевого взаимодействия |\n| Token Ring (IEEE 802.5) | Локальные сети с кольцевой топологией, доступ по маркеру |\n| FDDI | Стандарт для сетей с оптоволоконным носителем² |\n\n> 💡 Учи группами, а не списком. Почта: SMTP отправляет, POP3 забирает с сервера, IMAP оставляет письма на сервере. Маршрутизация: OSPF, RIP, BGP. **TCP** — с контролем, **UDP** — быстрый, без соединения.\n\n## ❗ Проверь по тетради\n- ¹ ARP часто относят к сетевому уровню, но активно используют и на канальном: он сопоставляет IP-адреса с MAC-адресами в пределах одной сети.\n- ² В конспекте у FDDI указан номер IEEE 802.6. Эту строку лучше сверить с преподавателем: такой номер обычно связывают с другой технологией.","order":6},{"id":"sd_n_net_n7","subjectId":"s_net","title":"Сетевая адресация: MAC, IP, маска","text":"*Источник: раздел 8 конспекта*\n\n## MAC-адрес\n\n> Уникальный **аппаратный идентификатор** сетевого интерфейса (сетевой карты, Wi-Fi-модуля, Bluetooth-адаптера). Присваивается на заводе и служит для идентификации на **канальном** уровне. Обычно 12 шестнадцатеричных символов (6 пар) через двоеточия или дефисы. Пример: `00:1A:2B:3C:4D:5E`\n\n## IP-адрес\n\n**Логический** адрес устройства для маршрутизации пакетов между сетями. Назначается администратором или выдаётся автоматически (например, DHCP-сервером). Состоит из двух частей:\n\n| Часть адреса | Что означает |\n|---|---|\n| Старшая | Номер сети |\n| Младшая | Номер узла в этой сети |\n\nТакое деление позволяет передавать данные между сетями только по номеру сети. Номер узла используется уже после доставки данных в нужную сеть.\n\n|   | MAC-адрес | IP-адрес |\n|---|---|---|\n| Уровень OSI | Канальный (2) | Сетевой (3) |\n| Что это | Аппаратный идентификатор сетевого интерфейса | Логический адрес для маршрутизации между сетями |\n| Как выдаётся | Присваивается на заводе | Администратором или автоматически (DHCP) |\n| Размер | 48 бит (12 шестнадцатеричных символов) | IPv4: 32 бита, IPv6: 128 бит |\n| Кто связывает | ARP сопоставляет IP-адреса с MAC-адресами в пределах одной сети | ARP |\n\n## IPv4\n\nДлина **4 байта**. Четыре десятичных числа через точки, каждое — от 0 до 255. Пример: `192.45.9.200`\n\n|   | Число 1 | Число 2 | Число 3 | Число 4 |\n|---|---|---|---|---|\n| Десятичная | 172 | 16 | 254 | 1 |\n| Двоичная | 10101100 | 00010000 | 11111110 | 00000001 |\n\n> 💡 Для перевода пиши над числом **128 64 32 16 8 4 2 1**. Например, 172 = 128 + 32 + 8 + 4 = 10101100. Каждое число = 8 бит, весь адрес = 32 бита.\n\n## Классы IPv4-адресов\n\n| Класс | Диапазон адресов | Макс. число сетей и узлов | Маска по умолчанию |\n|---|---|---|---|\n| A | 0.0.0.0 – 126.255.255.255¹ | сетей 2⁷ − 2, узлов 2²⁴ − 2 | 255.0.0.0 (/8) |\n| B | 128.0.0.0 – 191.255.255.255 | сетей 2¹⁴ − 2, узлов 2¹⁶ − 2 | 255.255.0.0 (/16) |\n| C | 192.0.0.0 – 223.255.255.255 | сетей 2²¹ − 2, узлов 2⁸ − 2 | 255.255.255.0 (/24) |\n\n> 💡 Классы A, B, C — это маски **/8, /16, /24**: каждый следующий класс добавляет ещё 8 бит на сеть.\n\n> ❓ Диапазон класса A на слайдах указан по-разному. Уточни, какой вариант считать правильным.\n\n## Маска подсети\n\n> **Маска подсети** — числовой «шаблон», который определяет, какая часть IP-адреса относится к сети, а какая к хосту внутри этой сети. Помогает понять, где получатель: в той же сети (отправить напрямую) или в другой (передать шлюзу).\n\nДесятичный формат: `255.255.255.0`. CIDR (Classless Inter-Domain Routing): число после косой черты, например `/24`, показывает, сколько бит отведено под сетевую часть.\n\n## IPv6\n\nДлина **128 бит**. Восемь групп шестнадцатеричных чисел (0–9 и a–f) через двоеточия. Пример: `3ffe:ffff:0000:2f3b:02aa:00ff:fe28:9c5a`\n\n|   | IPv4 | IPv6 |\n|---|---|---|\n| Размер | 32 бита (4 байта) | 128 бит |\n| Запись | 4 десятичных числа (0–255) через точки | 8 групп шестнадцатеричных чисел через двоеточия |\n| Пример | 192.45.9.200 | 3ffe:ffff:0000:2f3b:02aa:00ff:fe28:9c5a |\n\n## ❗ Проверь по тетради\n- ¹ На слайдах диапазон класса A указан по-разному: 0.0.0.0 – 126.255.255.255 (таблица «Диапазоны IP-адресов») и 1.0.0.0 – 127.25
