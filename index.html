    id="seed-content">{"cards":[{"id":"sd_c_net_0","subjectId":"s_net","cat":"Основы","q":"Что такое компьютерная сеть?","a":"Компьютеры и другие устройства, соединённые **линиями связи** и программами, чтобы **обмениваться данными** и пользоваться **общими ресурсами** (файлы, принтер, Интернет)."},{"id":"sd_c_net_1","subjectId":"s_net","cat":"Основы","q":"Чем вычислительная сеть отличается от сети передачи данных?","a":"**Вычислительная сеть** — система вычислительных элементов, которая решает определённый круг задач.\n\n**Сеть передачи данных** — система линий связи с устройствами, которые принимают и посылают данные."},{"id":"sd_c_net_2","subjectId":"s_net","cat":"Основы","q":"Зачем нужна компьютерная сеть?","a":"- **Вместе быстрее**: несколько компьютеров решают задачу быстрее, чем один.\n- **Обмен данными**: передача, хранение и обработка информации.\n- **Общие ресурсы**: один принтер или сервер на всех."},{"id":"sd_c_net_3","subjectId":"s_net","cat":"Основы","q":"Что такое клиент и что такое сервер?","a":"**Клиент** — компьютер, который запрашивает услугу или ресурс.\n\n**Сервер** — компьютер, который отвечает на такие запросы."},{"id":"sd_c_net_4","subjectId":"s_net","cat":"Основы","q":"Что появилось раньше: глобальные или локальные сети?","a":"**Глобальные.** Терминалы подключали к мейнфрейму через телефонную сеть с помощью модемов."},{"id":"sd_c_net_5","subjectId":"s_net","cat":"Основы","q":"Что такое приложение (прикладное ПО)?","a":"Программа, с которой работает пользователь: браузер, почта, мессенджер. Работает на **прикладном (7) уровне** модели OSI."},{"id":"sd_c_net_6","subjectId":"s_net","cat":"Виды сетей","q":"Что такое PAN?","a":"**Personal Area Network** — частная сеть, в которой меньше 10 компьютеров."},{"id":"sd_c_net_7","subjectId":"s_net","cat":"Виды сетей","q":"Что такое LAN (ЛВС)?","a":"**Local Area Network** — локальная сеть: дом, офис, здание, институт."},{"id":"sd_c_net_8","subjectId":"s_net","cat":"Виды сетей","q":"Что такое MAN?","a":"**Metropolitan Area Network** — региональная сеть, объединяет локальные сети города."},{"id":"sd_c_net_9","subjectId":"s_net","cat":"Виды сетей","q":"Что такое WAN / GAN? Приведи пример.","a":"**Wide / Global Area Network** — глобальная сеть, соединяет сети по всему миру. Пример: **Интернет**."},{"id":"sd_c_net_10","subjectId":"s_net","cat":"Виды сетей","q":"Что такое одноранговая сеть (peer-to-peer)? Плюсы и минусы.","a":"Все компьютеры **равноправны**: каждый и клиент, и сервер.\n\n- **Плюсы:** просто и дёшево, администратор не нужен.\n- **Минусы:** много паролей, нет общего резервного копирования. Подходит до 10 компьютеров."},{"id":"sd_c_net_11","subjectId":"s_net","cat":"Виды сетей","q":"Что такое сеть с выделенным сервером? Плюсы и минусы.","a":"Есть **сервер**, он отвечает на запросы клиентов.\n\n- **Плюсы:** единое управление, один пароль, безопасность, легко расти.\n- **Минусы:** сервер сломался, и сеть встала. Нужен специалист. Дороже."},{"id":"sd_c_net_12","subjectId":"s_net","cat":"Виды сетей","q":"Для скольких компьютеров подходит одноранговая сеть?","a":"Примерно **до 10 компьютеров**."},{"id":"sd_c_net_13","subjectId":"s_net","cat":"Оборудование","q":"Из каких компонентов состоит сеть?","a":"- **Узлы (хосты)**\n- **Сетевая карта (NIC)**\n- **Среда передачи** (кабель или радио)\n- **Сетевое оборудование**\n- **Программы** (ОС, драйверы, приложения)\n- **Протоколы**"},{"id":"sd_c_net_14","subjectId":"s_net","cat":"Оборудование","q":"Что такое узлы (хосты)?","a":"Устройства, которые обмениваются данными: компьютеры, серверы, сетевые принтеры, IP-телефоны."},{"id":"sd_c_net_15","subjectId":"s_net","cat":"Оборудование","q":"Что делает сетевая карта (NIC)?","a":"Подключает устройство к среде передачи, **формирует кадры**, кодирует биты в сигналы. Работает через **драйвер**. Выглядит как плата в компьютере с разъёмом RJ-45."},{"id":"sd_c_net_16","subjectId":"s_net","cat":"Оборудование","q":"Что такое среда передачи?","a":"То, по чему идут сигналы: **кабель** (витая пара, коаксиал, оптоволокно) или **радиоволны**."},{"id":"sd_c_net_17","subjectId":"s_net","cat":"Оборудование","q":"Что такое протокол?","a":"**Правила и формат обмена данными**, договорённость между устройствами. Примеры: TCP/IP, HTTP, FTP, Ethernet."},{"id":"sd_c_net_18","subjectId":"s_net","cat":"Оборудование","q":"Что такое стек протоколов?","a":"Набор протоколов **разных уровней**, которые работают вместе."},{"id":"sd_c_net_19","subjectId":"s_net","cat":"Оборудование","q":"Чем пассивное оборудование отличается от активного?","a":"**Пассивное** — нет «интеллекта», просто соединяет.\n\n**Активное** — обрабатывает данные и принимает решения."},{"id":"sd_c_net_20","subjectId":"s_net","cat":"Оборудование","q":"Что относится к пассивному оборудованию?","a":"Кабель, разъёмы RJ-45, патч-панель, телекоммуникационный шкаф, повторитель, концентратор (хаб)."},{"id":"sd_c_net_21","subjectId":"s_net","cat":"Оборудование","q":"Что относится к активному оборудованию?","a":"**Коммутатор (свитч)** и **маршрутизатор (роутер)**."},{"id":"sd_c_net_22","subjectId":"s_net","cat":"Оборудование","q":"Хаб (концентратор): уровень OSI и что делает?","a":"**1 уровень (физический).** Простейшее устройство для подключения компьютеров в сеть. Принимает, усиливает и распределяет сигнал с одного порта на **все остальные**. Устарел.\n\nНи на что не смотрит."},{"id":"sd_c_net_23","subjectId":"s_net","cat":"Оборудование","q":"Мост: уровень OSI и что делает?","a":"**2 уровень (канальный).** Объединяет в единую сеть разнородные сегменты (часто с разной топологией). Может работать как повторитель: увеличивает длину сети и число подключений.\n\nОпределяет адрес источника и приёмника, умеет фильтровать и разделять трафик. Смотрит на **MAC-адрес**."},{"id":"sd_c_net_24","subjectId":"s_net","cat":"Оборудование","q":"Коммутатор (свитч): уровень OSI и что делает?","a":"**2 уровень (канальный).** Центральный узел топологии «звезда». Отправляет данные **на конкретный порт**, а не на все, поэтому доставка быстрее. Строит много виртуальных каналов между портами и ведёт обмен параллельно.\n\nХранит таблицу `MAC-адрес → порт`."},{"id":"sd_c_net_25","subjectId":"s_net","cat":"Оборудование","q":"Маршрутизатор (роутер): уровень OSI и что делает?","a":"**3 уровень (сетевой).** Самое «интеллектуальное» из этих устройств. Анализирует адреса, определяет **наилучший маршрут** и пересылает пакеты. Умеет искать проблемы в сети, фильтровать данные, вести статистику.\n\nСмотрит на **IP-адрес**."},{"id":"sd_c_net_26","subjectId":"s_net","cat":"Оборудование","q":"Шлюз: что делает и приведи пример.","a":"Соединяет **разные сетевые архитектуры**. Имеет физические порты для разнородных систем и «понимает» разные протоколы, то есть работает как **переводчик**.\nПример: беспроводная точка доступа Wi-Fi."},{"id":"sd_c_net_27","subjectId":"s_net","cat":"Оборудование","q":"Чем хаб отличается от коммутатора?","a":"**Хаб** отправляет данные **всем**. **Коммутатор** отправляет только получателю, потому что помнит, кто к какому порту подключён. Поэтому он быстрее и безопаснее."},{"id":"sd_c_net_28","subjectId":"s_net","cat":"Оборудование","q":"Чем коммутатор отличается от маршрутизатора?","a":"**Коммутатор:** 2 уровень, MAC-адреса, работает **внутри сети**.\n\n**Маршрутизатор:** 3 уровень, IP-адреса, работает **между сетями**."},{"id":"sd_c_net_29","subjectId":"s_net","cat":"Оборудование","q":"Чем шлюз отличается от маршрутизатора?","a":"**Шлюз** соединяет разные сетевые архитектуры и «понимает» разные протоколы (переводчик). **Маршрутизатор** выбирает путь между сетями по IP."},{"id":"sd_c_net_30","subjectId":"s_net","cat":"Оборудование","q":"На что смотрит каждое устройство: хаб, мост, коммутатор, маршрутизатор, шлюз?","a":"- **Хаб** — ни на что\n- **Мост, коммутатор** — MAC-адрес\n- **Маршрутизатор** — IP-адрес\n- **Шлюз** — протоколы"},{"id":"sd_c_net_31","subjectId":"s_net","cat":"Оборудование","q":"Каков путь данных при печати на принтере другого компьютера?","a":"Программа → ядро ОС → драйвер сетевой карты → сетевая карта → кабель → сетевая карта 2-го компьютера → ОС 2-го компьютера → драйвер принтера → принтер.\nДля этого нужно настроить **сеть, драйверы и права доступа**."},{"id":"sd_c_net_32","subjectId":"s_net","cat":"Кабели","q":"Витая пара: разъём, длина, где применяется?","a":"Разъём **RJ-45**, до **100 м**. Самый распространённый кабель, используется в локальных сетях."},{"id":"sd_c_net_33","subjectId":"s_net","cat":"Кабели","q":"Чем UTP отличается от STP?","a":"**UTP** — без экрана. **STP** — экранированная, меньше помех."},{"id":"sd_c_net_34","subjectId":"s_net","cat":"Кабели","q":"Коаксиальный кабель: устройство и применение.","a":"Медная жила в изоляции и оплётке. **Старый тип**, использовался в старых сетях Ethernet (шина)."},{"id":"sd_c_net_35","subjectId":"s_net","cat":"Кабели","q":"Оптоволокно: чем хорошо и где применяется?","a":"Передаёт **свет**. Очень быстрое, не боится помех, подходит для больших расстояний. Применяется на магистралях и для связи между зданиями."},{"id":"sd_c_net_36","subjectId":"s_net","cat":"Топологии","q":"Что такое топология сети? Чем отличаются физическая и логическая?","a":"**Топология** — способ соединения устройств сети, схема расположения линий связи.\n\n- **Физическая** — как проложены кабели.\n- **Логическая** — как идёт сигнал."},{"id":"sd_c_net_37","subjectId":"s_net","cat":"Топологии","q":"Как называются схемы сетей? Назови основные топологии.","a":"**Шина, кольцо, звезда, ячеистая (Mesh).** Остальные — смешанные, например дерево."},{"id":"sd_c_net_38","subjectId":"s_net","cat":"Топологии","q":"Топология «Шина» (Bus): как соединено, плюсы и минусы.","a":"Один общий кабель, на концах **терминаторы** (заглушки).\n\n- **Плюсы:** мало кабеля, просто.\n- **Минусы:** обрыв кабеля или терминатора останавливает всю сеть."},{"id":"sd_c_net_39","subjectId":"s_net","cat":"Топологии","q":"Топология «Кольцо» (Ring): как соединено, плюсы и минусы.","a":"Узлы подряд по кругу. Передаёт тот, у кого **маркер**.\n\n- **Плюсы:** упорядоченный доступ.\n- **Минусы:** отказ одной станции может остановить сеть."},{"id":"sd_c_net_40","subjectId":"s_net","cat":"Топологии","q":"Топология «Звезда» (Star): как соединено, плюсы и минусы.","a":"Все подключены к **центральному устройству** (хаб или коммутатор).\n\n- **Плюсы:** поломка одного узла не мешает остальным, легко добавлять компьютеры. Основа современных сетей.\n- **Минусы:** больше кабеля. Сломался центр, и встал весь сегмент."},{"id":"sd_c_net_41","subjectId":"s_net","cat":"Топологии","q":"Ячеистая топология (Mesh): как соединено, плюсы и минусы.","a":"Каждый соединён с каждым (**полносвязная**).\n\n- **Плюсы:** очень надёжная.\n- **Минусы:** много кабеля, сложно строить."},{"id":"sd_c_net_42","subjectId":"s_net","cat":"Топологии","q":"Что такое смешанные (гибридные) топологии? Пример.","a":"Комбинации базовых топологий. Пример: **дерево** — несколько звёзд, соединённых между собой."},{"id":"sd_c_net_43","subjectId":"s_net","cat":"Топологии","q":"Сколько базовых топологий: четыре или пять?","a":"Зависит от методички. В методичке **Вахранева** ещё называют **решётку** (узлы в виде сетки), поэтому у него пять. У **Тойгожиновой** четыре."},{"id":"sd_c_net_44","subjectId":"s_net","cat":"Модель OSI","q":"Что такое модель OSI?","a":"Стандарт ISO (**1984**), делит передачу данных на **7 уровней**. Идём сверху вниз: от пользователя к кабелю."},{"id":"sd_c_net_45","subjectId":"s_net","cat":"Модель OSI","q":"Назови 7 уровней OSI сверху вниз.","a":"- **7** Прикладной\n- **6** Представления\n- **5** Сеансовый\n- **4** Транспортный\n- **3** Сетевой\n- **2** Канальный\n- **1** Физический"},{"id":"sd_c_net_46","subjectId":"s_net","cat":"Модель OSI","q":"Что делает прикладной уровень (7)?","a":"Работа **программ и пользователя**. Протоколы: HTTP, FTP, SMTP, DNS."},{"id":"sd_c_net_47","subjectId":"s_net","cat":"Модель OSI","q":"Что делает уровень представления (6)?","a":"Следит за **форматом данных**, чтобы другой компьютер их понял. Примеры: шифрование, сжатие."},{"id":"sd_c_net_48","subjectId":"s_net","cat":"Модель OSI","q":"Что делает сеансовый уровень (5)?","a":"**Открывает, ведёт и закрывает** сеансы связи (сессии)."},{"id":"sd_c_net_49","subjectId":"s_net","cat":"Модель OSI","q":"Что делает транспортный уровень (4)?","a":"**Делит данные на части и собирает обратно.** Протоколы: TCP, UDP."},{"id":"sd_c_net_50","subjectId":"s_net","cat":"Модель OSI","q":"Что делает сетевой уровень (3)?","a":"**Выбор маршрута** и логические (IP) адреса. Примеры: IP, маршрутизатор."},{"id":"sd_c_net_51","subjectId":"s_net","cat":"Модель OSI","q":"Что делает канальный уровень (2)?","a":"Передача по каналу, **физические (MAC) адреса**. Примеры: Ethernet, коммутатор."},{"id":"sd_c_net_52","subjectId":"s_net","cat":"Модель OSI","q":"Что делает физический уровень (1)?","a":"**Сигналы, кабели, разъёмы.** Примеры: кабели, хаб."},{"id":"sd_c_net_53","subjectId":"s_net","cat":"Модель OSI","q":"На каком уровне OSI работают хаб, коммутатор и маршрутизатор?","a":"- **Хаб** — 1 (физический)\n- **Мост, коммутатор** — 2 (канальный)\n- **Маршрутизатор** — 3 (сетевой)"},{"id":"sd_c_net_54","subjectId":"s_net","cat":"Модель OSI","q":"Как делятся уровни OSI на нижние и верхние?","a":"- **Нижние 3 (1–3)** — уровни среды передачи (media layers): физическая доставка сообщений.\n- **Верхние 4 (4–7)** — уровни хост-машины (host layers): точная доставка данных."},{"id":"sd_c_net_55","subjectId":"s_net","cat":"Модель OSI","q":"Модель DARPA (TCP/IP): сколько уровней и как они соответствуют OSI?","a":"Старше OSI, **4 уровня**:\n\n- Прикладной = OSI 5–7\n- Транспортный = OSI 4\n- Межсетевого взаимодействия = OSI 3\n- Сетевого интерфейса = OSI 1–2"},{"id":"sd_c_net_56","subjectId":"s_net","cat":"Протоколы","q":"Какие протоколы работают на прикладном уровне (7)?","a":"**HTTP** (сайты), **FTP** (файлы), **SMTP** (почта), **DNS** (имена сайтов), DHCP, Telnet. Также HTTPS, POP3, IMAP, SNTP."},{"id":"sd_c_net_57","subjectId":"s_net","cat":"Протоколы","q":"Какие протоколы работают на транспортном уровне (4)?","a":"**TCP, UDP, SCTP.**"},{"id":"sd_c_net_58","subjectId":"s_net","cat":"Протоколы","q":"HTTP","a":"Протокол прикладного уровня. Передача **гипертекста** (сайтов)."},{"id":"sd_c_net_59","subjectId":"s_net","cat":"Протоколы","q":"HTTPS","a":"Протокол прикладного уровня. **Зашифрованный HTTP.**"},{"id":"sd_c_net_60","subjectId":"s_net","cat":"Протоколы","q":"SMTP","a":"Протокол прикладного уровня. Передача **электронной почты**."},{"id":"sd_c_net_61","subjectId":"s_net","cat":"Протоколы","q":"POP3","a":"Протокол прикладного уровня. **Извлечение электронной почты с сервера.**"},{"id":"sd_c_net_62","subjectId":"s_net","cat":"Протоколы","q":"IMAP","a":"Протокол прикладного уровня. Доступ к сообщениям в сети Интернет, **почта остаётся на сервере**."},{"id":"sd_c_net_63","subjectId":"s_net","cat":"Протоколы","q":"SNTP","a":"Протокол прикладного уровня. **Синхронизация времени** по компьютерной сети."},{"id":"sd_c_net_64","subjectId":"s_net","cat":"Протоколы","q":"DNS","a":"Протокол прикладного уровня. Переводит **доменные имена в IP-адреса**, понятные компьютеру."},{"id":"sd_c_net_65","subjectId":"s_net","cat":"Протоколы","q":"TCP","a":"Транспортный уровень. Передача информации с **контролем доставки, целостности и правильного порядка** пакетов."},{"id":"sd_c_net_66","subjectId":"s_net","cat":"Протоколы","q":"UDP","a":"Транспортный уровень. **Без установления соединения**, быстрый."},{"id":"sd_c_net_67","subjectId":"s_net","cat":"Протоколы","q":"Чем TCP отличается от UDP?","a":"**TCP** контролирует доставку, целостность и порядок пакетов. **UDP** работает без установления соединения, он быстрый."},{"id":"sd_c_net_68","subjectId":"s_net","cat":"Протоколы","q":"SCTP","a":"Транспортный уровень. **Надёжная передача данных** с возможностью управления потоками."},{"id":"sd_c_net_69","subjectId":"s_net","cat":"Протоколы","q":"IP","a":"Сетевой уровень. Отвечает за **адресацию и маршрутизацию**. IPv4 — 32-битные адреса, IPv6 — 128-битные."},{"id":"sd_c_net_70","subjectId":"s_net","cat":"Протоколы","q":"ICMP","a":"Сетевой уровень. **Диагностика сетевых проблем** и обмен сообщениями об ошибках."},{"id":"sd_c_net_71","subjectId":"s_net","cat":"Протоколы","q":"ARP","a":"Сетевой уровень (часто относят и к канальному). Сопоставляет **IP-адреса с физическими MAC-адресами** устройств в локальной сети (LAN)."},{"id":"sd_c_net_72","subjectId":"s_net","cat":"Протоколы","q":"IGMP","a":"Сетевой уровень. **Мультикаст**: передача данных от одного отправителя нескольким получателям одновременно."},{"id":"sd_c_net_73","subjectId":"s_net","cat":"Протоколы","q":"OSPF","a":"Сетевой уровень. Протокол маршрутизации: определяет **наиболее эффективный путь** передачи данных через IP-сеть."},{"id":"sd_c_net_74","subjectId":"s_net","cat":"Протоколы","q":"BGP","a":"Сетевой уровень. Маршрутизация **между автономными системами** в Интернете."},{"id":"sd_c_net_75","subjectId":"s_net","cat":"Протоколы","q":"RIP","a":"Сетевой уровень. Протокол **динамической маршрутизации**."},{"id":"sd_c_net_76","subjectId":"s_net","cat":"Протоколы","q":"IPsec","a":"Сетевой уровень. Набор протоколов для **безопасной передачи данных** по IP-сетям."},{"id":"sd_c_net_77","subjectId":"s_net","cat":"Протоколы","q":"NDP","a":"Сетевой уровень. Используется в **IPv6** для управления взаимодействием между узлами в пределах одной локальной сети."},{"id":"sd_c_net_78","subjectId":"s_net","cat":"Протоколы","q":"Ethernet (IEEE 802.3)","a":"Канальный уровень. **Доминирующий протокол в локальных сетях (LAN).** Использует 48-битные MAC-адреса."},{"id":"sd_c_net_79","subjectId":"s_net","cat":"Протоколы","q":"Wi-Fi (IEEE 802.11)","a":"Канальный уровень. Использует **MAC-адреса** для взаимодействия устройств."},{"id":"sd_c_net_80","subjectId":"s_net","cat":"Протоколы","q":"PPP (Point-to-Point Protocol)","a":"Канальный уровень. **Прямое соединение между двумя узлами.** Часто для подключения к Интернету через модемы и DSL-линии. Поддерживает аутентификацию, шифрование и сжатие данных."},{"id":"sd_c_net_81","subjectId":"s_net","cat":"Протоколы","q":"HDLC (High-Level Data Link Control)","a":"Канальный уровень. Стандартизированный **бит-ориентированный** протокол, разработан ISO. Обеспечивает надёжную передачу данных между точками."},{"id":"sd_c_net_82","subjectId":"s_net","cat":"Протоколы","q":"Frame Relay","a":"Канальный уровень. Технология передачи данных для **межсетевого взаимодействия**."},{"id":"sd_c_net_83","subjectId":"s_net","cat":"Протоколы","q":"Token Ring (IEEE 802.5)","a":"Канальный уровень. Технология локальных сетей с **кольцевой топологией**. Доступ к среде осуществляется передачей **маркера**."},{"id":"sd_c_net_84","subjectId":"s_net","cat":"Протоколы","q":"FDDI (Fiber Distributed Data Interface)","a":"Канальный уровень. Стандарт для сетей с **оптоволоконным** носителем."},{"id":"sd_c_net_85","subjectId":"s_net","cat":"Адресация","q":"Что такое MAC-адрес?","a":"Уникальный **аппаратный идентификатор** сетевого интерфейса (сетевой карты, Wi-Fi-модуля, Bluetooth-адаптера). Присваивается **на заводе**, работает на канальном уровне OSI."},{"id":"sd_c_net_86","subjectId":"s_net","cat":"Адресация","q":"Как выглядит MAC-адрес?","a":"**48 бит**: 12 шестнадцатеричных символов (6 пар), разделённых двоеточиями или дефисами.\nПример: `00:1A:2B:3C:4D:5E`"},{"id":"sd_c_net_87","subjectId":"s_net","cat":"Адресация","q":"Что такое IP-адрес?","a":"**Логический адрес** устройства для маршрутизации пакетов между сетями. Назначается администратором или выдаётся автоматически (например, DHCP-сервером)."},{"id":"sd_c_net_88","subjectId":"s_net","cat":"Адресация","q":"Из каких частей состоит IP-адрес?","a":"- **Старшая часть** — номер сети\n- **Младшая часть** — номер узла в этой сети"},{"id":"sd_c_net_89","subjectId":"s_net","cat":"Адресация","q":"Зачем IP-адрес делят на номер сети и номер узла?","a":"Чтобы передавать данные между сетями **только по номеру сети**. Номер узла используется уже после доставки данных в нужную сеть."},{"id":"sd_c_net_90","subjectId":"s_net","cat":"Адресация","q":"Как записывается IPv4-адрес? Сколько в нём байт?","a":"**4 байта**, записывается четырьмя десятичными числами через точки. Каждое число — однобайтовое, от **0 до 255**.\nПример: `192.45.9.200`"},{"id":"sd_c_net_91","subjectId":"s_net","cat":"Адресация","q":"Запиши 172.16.254.1 в двоичном виде.","a":"`10101100 00010000 11111110 00000001`\nКаждое число = 8 бит, весь адрес = **32 бита** (4 байта)."},{"id":"sd_c_net_92","subjectId":"s_net","cat":"Адресация","q":"Как записывается IPv6-адрес?","a":"**128 бит**: восемь групп шестнадцатеричных чисел (0–9 и a–f), разделённых двоеточиями.\nПример: `3ffe:ffff:0000:2f3b:02aa:00ff:fe28:9c5a`"},{"id":"sd_c_net_93","subjectId":"s_net","cat":"Адресация","q":"Чем IPv4 отличается от IPv6?","a":"- **IPv4:** 32 бита (4 байта), 4 десятичных числа (0–255) через точки.\n- **IPv6:** 128 бит, 8 групп шестнадцатеричных чисел через двоеточия."},{"id":"sd_c_net_94","subjectId":"s_net","cat":"Адресация","q":"Чем MAC-адрес отличается от IP-адреса?","a":"- **MAC:** канальный (2) уровень, аппаратный идентификатор, выдаётся на заводе, 48 бит.\n- **IP:** сетевой (3) уровень, логический адрес для маршрутизации между сетями, выдаётся администратором или автоматически (DHCP). IPv4: 32 бита, IPv6: 128 бит."},{"id":"sd_c_net_95","subjectId":"s_net","cat":"Адресация","q":"Какой протокол сопоставляет IP-адреса с MAC-адресами?","a":"**ARP**, в пределах одной сети."},{"id":"sd_c_net_96","subjectId":"s_net","cat":"Адресация","q":"Что такое маска подсети?","a":"Числовой «шаблон», который показывает, какая часть IP-адреса относится к **сети**, а какая к **хосту**. Помогает понять, где получатель: в той же сети (отправить напрямую) или в другой (передать шлюзу).\nПример: `255.255.255.0`"},{"id":"sd_c_net_97","subjectId":"s_net","cat":"Адресация","q":"Что значит /24 в CIDR-нотации?","a":"**24 бита** отведено под сетевую часть адреса. CIDR — Classless Inter-Domain Routing.\nЭто то же самое, что маска `255.255.255.0`."},{"id":"sd_c_net_98","subjectId":"s_net","cat":"Адресация","q":"Класс A: диапазон, число сетей и узлов, маска по умолчанию.","a":"- Диапазон: `0.0.0.0 – 126.255.255.255`\n- Сетей: 2⁷ − 2\n- Узлов: 2²⁴ − 2\n- Маска: `255.0.0.0 (/8)`"},{"id":"sd_c_net_99","subjectId":"s_net","cat":"Адресация","q":"Класс B: диапазон, число сетей и узлов, маска по умолчанию.","a":"- Диапазон: `128.0.0.0 – 191.255.255.255`\n- Сетей: 2¹⁴ − 2\n- Узлов: 2¹⁶ − 2\n- Маска: `255.255.0.0 (/16)`"},{"id":"sd_c_net_100","subjectId":"s_net","cat":"Адресация","q":"Класс C: диапазон, число сетей и узлов, маска по умолчанию.","a":"- Диапазон: `192.0.0.0 – 223.255.255.255`\n- Сетей: 2²¹ − 2\n- Узлов: 2⁸ − 2\n- Маска: `255.255.255.0 (/24)`"},{"id":"sd_c_net_101","subjectId":"s_net","cat":"Адресация","q":"Маски по умолчанию для классов A, B, C?","a":"- **A:** `255.0.0.0 (/8)`\n- **B:** `255.255.0.0 (/16)`\n- **C:** `255.255.255.0 (/24)`"},{"id":"sd_c_net_102","subjectId":"s_net","cat":"Адресация","q":"Какой диапазон у класса A: до 126 или до 127?","a":"На слайдах написано по-разному: `0.0.0.0 – 126.255.255.255` (таблица диапазонов) и `1.0.0.0 – 127.255.255.255` (слайд про маску подсети). **Уточни у преподавателя**, какой вариант считать правильным."},{"id":"sd_c_net_103","subjectId":"s_net","cat":"История","q":"Кто создал телеграф и когда?","a":"**Морзе**, 1837 год. Первая публичная передача — 24 мая 1844."},{"id":"sd_c_net_104","subjectId":"s_net","cat":"История","q":"Что произошло в 1858 году?","a":"Первый **трансатлантический кабель**. Проработал около 3 недель. С 1866 года связь между континентами постоянная."},{"id":"sd_c_net_105","subjectId":"s_net","cat":"История","q":"Кто и когда получил патент на телефон?","a":"**Белл**, 7 марта 1876 года."},{"id":"sd_c_net_106","subjectId":"s_net","cat":"История","q":"Где и когда появилась первая телефонная станция в России?","a":"**1882 год**, Санкт-Петербург, Невский проспект, 26."},{"id":"sd_c_net_107","subjectId":"s_net","cat":"История","q":"Кто создал первую автоматическую телефонную станцию (АТС)?","a":"**Строуджер**, 1892 год."},{"id":"sd_c_net_108","subjectId":"s_net","cat":"История","q":"Что связано с 1895 и 1901 годами в истории радио?","a":"**1895:** Попов демонстрирует радиоприёмник (7 мая — День радио).\n**1901:** Маркони передаёт радиосигнал через Атлантику."},{"id":"sd_c_net_109","subjectId":"s_net","cat":"История","q":"Какой был первый спутник связи?","a":"**«Эхо-1»**, 1960 год."},{"id":"sd_c_net_110","subjectId":"s_net","cat":"История","q":"Когда и где появились первые системы сотовой связи?","a":"**1978 год**, Бахрейн и США."},{"id":"sd_c_net_t0","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Что такое компьютерная сеть и зачем она нужна?","a":"**Определение.** Компьютерная сеть — это компьютеры и другие цифровые устройства, объединённые линиями связи и программами, чтобы обмениваться данными и пользоваться общими ресурсами: файлами, принтером, Интернетом.\n\n**Зачем нужна:**\n\n- несколько компьютеров решают задачу быстрее, чем один;\n- можно передавать, хранить и обрабатывать информацию;\n- один принтер или сервер доступен всем.\n\n**Уточнение.** Вычислительная сеть — это система вычислительных элементов, которая решает определённый круг задач. Сеть передачи данных — система линий связи с устройствами, которые принимают и посылают данные."},{"id":"sd_c_net_t1","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Как классифицируют сети по размеру? Приведите примеры.","a":"| Вид | Охват | Пример |\n|---|---|---|\n| PAN | меньше 10 компьютеров | частная сеть |\n| LAN (ЛВС) | дом, офис, здание, институт | сеть офиса |\n| MAN | объединяет локальные сети города | городская сеть |\n| WAN / GAN | соединяет сети по всему миру | Интернет |\n\nЕсли нужно добавить: глобальные сети появились раньше локальных — терминалы подключали к мейнфрейму через телефонную сеть с помощью модемов."},{"id":"sd_c_net_t2","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем одноранговая сеть отличается от сети с выделенным сервером?","a":"**Одноранговая (peer-to-peer):** все компьютеры равноправны, каждый одновременно и клиент, и сервер. Просто и дёшево, администратор не нужен. Минусы: много паролей, нет общего резервного копирования. Подходит примерно до 10 компьютеров.\n\n**С выделенным сервером:** есть сервер, который отвечает на запросы клиентов. Плюсы: единое управление, один пароль, безопасность, легко расти. Минусы: если сервер сломался, сеть встала; нужен специалист; дороже.\n\n**Итог:** маленькой сети хватит одноранговой, для роста и безопасности нужен сервер."},{"id":"sd_c_net_t3","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Из каких компонентов состоит компьютерная сеть?","a":"1. **Узлы (хосты)** — компьютеры, серверы, сетевые принтеры, IP-телефоны.\n2. **Сетевая карта (NIC)** — подключает устройство к среде передачи, формирует кадры, кодирует биты в сигналы.\n3. **Среда передачи** — кабель (витая пара, коаксиал, оптоволокно) или радиоволны.\n4. **Сетевое оборудование** — коммутатор, маршрутизатор, хаб.\n5. **Программы** — ОС, драйверы, прикладные программы.\n6. **Протоколы** — правила и формат обмена данными (TCP/IP, HTTP, FTP, Ethernet)."},{"id":"sd_c_net_t4","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем хаб, коммутатор, маршрутизатор и шлюз отличаются друг от друга?","a":"| Устройство | Уровень OSI | Смотрит на | Как работает |\n|---|---|---|---|\n| Хаб | 1 | ничего | Принимает, усиливает и шлёт сигнал на все порты |\n| Коммутатор | 2 | MAC-адрес | Шлёт только на нужный порт, хранит таблицу «MAC → порт» |\n| Маршрутизатор | 3 | IP-адрес | Выбирает лучший маршрут между сетями |\n| Шлюз | разные | протоколы | Переводит между разными архитектурами и протоколами |\n\n**Главное:** хаб отправляет данные всем, коммутатор — только получателю. Маршрутизатор работает между сетями, а не внутри сети. Шлюз — «переводчик»."},{"id":"sd_c_net_t5","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Что происходит, когда программа печатает на принтере другого компьютера?","a":"Данные проходят цепочку:\n\n1. программа передаёт задание ядру ОС;\n2. ОС передаёт данные драйверу сетевой карты;\n3. сетевая карта кодирует их в сигналы и отправляет по кабелю;\n4. сетевая карта второго компьютера принимает сигнал, данные идут в ОС второго компьютера;\n5. ОС передаёт задание драйверу принтера, и принтер печатает.\n\nЧтобы это работало, нужно настроить сеть, драйверы и права доступа."},{"id":"sd_c_net_t6","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Что такое топология сети? Расскажите про основные виды.","a":"**Топология** — способ соединения устройств сети, схема расположения линий связи. Физическая показывает, как проложены кабели, логическая — как идёт сигнал.\n\n| Топология | Суть | Слабое место |\n|---|---|---|\n| Шина | Один кабель, терминаторы на концах | Обрыв кабеля или терминатора останавливает сеть |\n| Кольцо | Узлы по кругу, передаёт тот, у кого маркер | Отказ станции может остановить сеть |\n| Звезда | Все подключены к центру (хаб или коммутатор) | Сломался центр — встал сегмент |\n| Mesh | Каждый с каждым | Много кабеля, сложно строить |\n\nЗвезда — основа современных сетей. Смешанные топологии, например дерево, — это несколько звёзд, соединённых между собой."},{"id":"sd_c_net_t7","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Назовите уровни модели OSI и объясните, что делает каждый.","a":"1. **Прикладной (7)** — работа программ и пользователя: HTTP, FTP, SMTP, DNS.\n2. **Представления (6)** — формат данных: шифрование, сжатие.\n3. **Сеансовый (5)** — открывает, ведёт и закрывает сеансы связи.\n4. **Транспортный (4)** — делит данные на части и собирает обратно: TCP, UDP.\n5. **Сетевой (3)** — выбор маршрута, IP-адреса: IP, маршрутизатор.\n6. **Канальный (2)** — передача по каналу, MAC-адреса: Ethernet, коммутатор.\n7. **Физический (1)** — сигналы, кабели, разъёмы: кабели, хаб.\n\nМодель принята как стандарт ISO в 1984 году. Нижние три уровня (1–3) отвечают за физическую доставку сообщений, верхние четыре (4–7) — за точную доставку данных."},{"id":"sd_c_net_t8","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем модель OSI отличается от модели DARPA (TCP/IP)?","a":"DARPA (TCP/IP) старше и содержит **4 уровня** вместо 7:\n\n| Уровень DARPA | Уровни OSI |\n|---|---|\n| Прикладной | 5–7 |\n| Транспортный | 4 |\n| Межсетевого взаимодействия | 3 |\n| Сетевого интерфейса | 1–2 |\n\nНабор протоколов разных уровней называют **стеком протоколов**."},{"id":"sd_c_net_t9","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем TCP отличается от UDP?","a":"**TCP** передаёт данные с контролем доставки, целостности и правильного порядка пакетов. Это надёжный, но более «тяжёлый» протокол.\n\n**UDP** работает без установления соединения, поэтому он быстрый, но не гарантирует доставку.\n\nОба протокола работают на транспортном (4) уровне. Там же есть SCTP — надёжная передача с управлением потоками."},{"id":"sd_c_net_t10","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем MAC-адрес отличается от IP-адреса? Что такое ARP?","a":"|   | MAC | IP |\n|---|---|---|\n| Уровень | канальный (2) | сетевой (3) |\n| Смысл | аппаратный идентификатор интерфейса | логический адрес для маршрутизации между сетями |\n| Кто выдаёт | завод | администратор или DHCP |\n| Размер | 48 бит | IPv4: 32 бита, IPv6: 128 бит |\n\n**ARP** сопоставляет IP-адреса с MAC-адресами в пределах локальной сети."},{"id":"sd_c_net_t11","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Как устроен IPv4-адрес? Расскажите про классы и маску подсети.","a":"IPv4 — 4 байта: четыре числа от 0 до 255 через точки (например, 192.45.9.200). Адрес делится на **номер сети** (старшая часть) и **номер узла** (младшая).\n\n| Класс | Диапазон | Маска |\n|---|---|---|\n| A | 0.0.0.0 – 126.255.255.255 | 255.0.0.0 (/8) |\n| B | 128.0.0.0 – 191.255.255.255 | 255.255.0.0 (/16) |\n| C | 192.0.0.0 – 223.255.255.255 | 255.255.255.0 (/24) |\n\n**Маска подсети** показывает, какая часть адреса — сеть, а какая — хост. По маске устройство понимает, где получатель: в той же сети (отправить напрямую) или в другой (передать шлюзу). В CIDR запись /24 значит, что 24 бита отведено под сеть.\n\nПро класс A уточните у преподавателя: в конспекте встречаются два варианта верхней границы (126 и 127)."},{"id":"sd_c_net_t12","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Чем IPv4 отличается от IPv6?","a":"|   | IPv4 | IPv6 |\n|---|---|---|\n| Размер | 32 бита (4 байта) | 128 бит |\n| Запись | 4 десятичных числа через точки | 8 групп шестнадцатеричных чисел через двоеточия |\n| Пример | 192.45.9.200 | 3ffe:ffff:0000:2f3b:02aa:00ff:fe28:9c5a |"},{"id":"sd_c_net_t13","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Сравните виды кабелей: витая пара, коаксиал, оптоволокно.","a":"| Кабель | Особенности | Применение |\n|---|---|---|\n| Витая пара (UTP / STP) | RJ-45, до 100 м. UTP без экрана, STP экранирована | Самый распространённый, локальные сети |\n| Коаксиальный | Медная жила в изоляции и оплётке, старый тип | Старые сети Ethernet (шина) |\n| Оптоволокно | Передаёт свет, очень быстрое, не боится помех | Магистрали, связь между зданиями |"},{"id":"sd_c_net_t14","subjectId":"s_net","cat":"Вопросы к зачёту","q":"Какие прикладные протоколы вы знаете и для чего они нужны?","a":"- **HTTP / HTTPS** — передача гипертекста (сайтов), HTTPS — зашифрованный.\n- **FTP** — передача файлов.\n- **SMTP** — отправка почты; **POP3** — извлечение почты с сервера; **IMAP** — почта остаётся на сервере.\n- **DNS** — перевод доменных имён в IP-адреса.\n- **SNTP** — синхронизация времени.\n- **DHCP** — автоматическая выдача IP-адресов; **Telnet** — удалённый доступ."},{"id":"sd_c_prog_0","subjectId":"s_oap","cat":"Введение","q":"Что такое технология программирования?","a":"Совокупность **методов, приёмов, средств и правил** применения схемы на всех этапах разработки программного обеспечения: от постановки задачи до сопровождения готовой программы."},{"id":"sd_c_prog_1","subjectId":"s_oap","cat":"Введение","q":"Какие ключевые проблемы решает технология программирования?","a":"- **Сложность**\n- **Коллективная разработка**\n- **Надёжность**\n- **Сопровождение**\n- **Сроки и стоимость**\n- **Изменяемость требований**"},{"id":"sd_c_prog_2","subjectId":"s_oap","cat":"Введение","q":"Что произошло в 1960–1970 годах и чем на это ответили?","a":"**Кризис программирования.** Ответом стало развитие **структурного** программирования, а затем **модульного** и **объектно-ориентированного**."},{"id":"sd_c_prog_3","subjectId":"s_oap","cat":"Введение","q":"Чему равна программа (формула)?","a":"**Программа = алгоритм + данные.**"},{"id":"sd_c_prog_4","subjectId":"s_oap","cat":"Введение","q":"Что такое программа (через понятие алгоритма)?","a":"**Алгоритм**, написанный на языке программирования."},{"id":"sd_c_prog_5","subjectId":"s_oap","cat":"Введение","q":"Что такое язык программирования?","a":"**Формальный язык**, предназначенный для записи алгоритмов в виде, понятном компьютеру."},{"id":"sd_c_prog_6","subjectId":"s_oap","cat":"Введение","q":"Что такое исходный код?","a":"Программа, записанная на языке программирования **в текстовом виде**, понятная человеку."},{"id":"sd_c_prog_7","subjectId":"s_oap","cat":"Введение","q":"Что такое транслятор?","a":"**Переводчик** с исходного кода на машинный язык."},{"id":"sd_c_prog_8","subjectId":"s_oap","cat":"Введение","q":"Какой язык программирования был самым первым?","a":"**Машинный.**"},{"id":"sd_c_prog_9","subjectId":"s_oap","cat":"Введение","q":"Назови этапы эволюции языков программирования.","a":"1. **Машинный** — самый первый язык\n2. **Ассемблер** — более понятные команды вместо машинного кода\n3. **Структурный** — порядок выполнения команд\n4. **Объектно-ориентированный** — объединение данных и действий\n5. **Современный**"},{"id":"sd_c_prog_10","subjectId":"s_oap","cat":"Введение","q":"Кто такая Ада Лавлейс?","a":"**Первая программистка.** Написала первый алгоритм для машины."},{"id":"sd_c_prog_11","subjectId":"s_oap","cat":"Введение","q":"Какие три типа трансляторов бывают?","a":"**Компилятор, интерпретатор, ассемблер.**"},{"id":"sd_c_prog_12","subjectId":"s_oap","cat":"Введение","q":"Как работает компилятор?","a":"Сразу переводит **всю программу**. Языки такого типа называют **компилируемыми**."},{"id":"sd_c_prog_13","subjectId":"s_oap","cat":"Введение","q":"Как работает интерпретатор?","a":"Переводит **построчно**: выполняет код по одной строке."},{"id":"sd_c_prog_14","subjectId":"s_oap","cat":"Введение","q":"Что делает транслятор-ассемблер?","a":"Переводит **команды ассемблера в машинный код** (для языка ассемблера)."},{"id":"sd_c_prog_15","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое жизненный цикл ПО?","a":"Период времени, который начинается с момента **принятия решения о создании** программного продукта и заканчивается в момент его **полного изъятия из эксплуатации**."},{"id":"sd_c_prog_16","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Назови этапы жизненного цикла ПО по порядку.","a":"1. **Анализ требований**\n2. **Техническое задание**\n3. **Проектирование**\n4. **Реализация**\n5. **Тестирование и отладка**\n6. **Внедрение и эксплуатация**\n7. **Сопровождение**"},{"id":"sd_c_prog_17","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что происходит на этапе «Анализ требований»?","a":"**Постановка задачи.**"},{"id":"sd_c_prog_18","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое техническое задание (ТЗ)?","a":"**Результат этапа анализа** (этап 2 жизненного цикла)."},{"id":"sd_c_prog_19","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что делают на этапе проектирования?","a":"Разрабатывают **общую структуру программы**: какие модули, как они взаимодействуют, какой интерфейс."},{"id":"sd_c_prog_20","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое этап реализации?","a":"**Кодирование, программирование.**"},{"id":"sd_c_prog_21","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что происходит на этапе тестирования и отладки?","a":"**Поиск и исправление ошибок.**"},{"id":"sd_c_prog_22","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое внедрение и эксплуатация?","a":"Программа **начинает использоваться**."},{"id":"sd_c_prog_23","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое сопровождение?","a":"**Поддержка программы** после внедрения."},{"id":"sd_c_prog_24","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Какие бывают модели жизненного цикла?","a":"- **Каскадная**\n- **Итерационные**\n- **Спиральная**\n- **Гибкие методологии (Agile)**"},{"id":"sd_c_prog_25","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое каскадная модель?","a":"Выполняется **строго последовательно**; результат получают в конце проекта."},{"id":"sd_c_prog_26","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое итерационные модели?","a":"Разработка **повторяющимися циклами**: каждая итерация даёт рабочую версию."},{"id":"sd_c_prog_27","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое спиральная модель?","a":"**Итерации + анализ рисков** на каждом витке."},{"id":"sd_c_prog_28","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое гибкие методологии (Agile)?","a":"**Короткие циклы** и постоянная обратная связь с заказчиком."},{"id":"sd_c_prog_29","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое отладка и что для неё используют?","a":"**Поиск ошибок** в программе. Для этого используется **отладчик**."},{"id":"sd_c_prog_30","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Какие виды ошибок бывают?","a":"- **Синтаксические**\n- **Логические**\n- **Рантайм-ошибки** (ошибки времени выполнения)"},{"id":"sd_c_prog_31","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое синтаксические ошибки?","a":"Нарушены **правила языка**. Программа не запускается."},{"id":"sd_c_prog_32","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое логические ошибки?","a":"Программа работает, но **результат неверный**."},{"id":"sd_c_prog_33","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Что такое рантайм-ошибки?","a":"Ошибки **времени выполнения**: возникают уже во время работы программы."},{"id":"sd_c_prog_34","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Какие виды тестирования бывают?","a":"**Модульное, интеграционное, функциональное.**"},{"id":"sd_c_prog_35","subjectId":"s_oap","cat":"Жизненный цикл ПО","q":"Чем отличаются модульное, интеграционное и функциональное тестирование?","a":"- **Модульное** — проверка отдельных модулей.\n- **Интеграционное** — как модули работают вместе.\n- **Функциональное** — соответствует ли программа требованиям."},{"id":"sd_c_prog_36","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое алгоритм?","a":"Точное и понятное описание **последовательности действий**, выполнение которых приводит от исходных данных к требуемому результату **за конечное число шагов**."},{"id":"sd_c_prog_37","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое исполнитель алгоритма?","a":"Объект, способный **понимать и выполнять команды** алгоритма."},{"id":"sd_c_prog_38","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое система команд?","a":"Набор команд, который данный **исполнитель способен выполнить**."},{"id":"sd_c_prog_39","subjectId":"s_oap","cat":"Алгоритмы","q":"Назови свойства алгоритмов.","a":"1. **Дискретность**\n2. **Понятность**\n3. **Определённость** (детерминированность)\n4. **Конечность**\n5. **Результативность**\n6. **Массовость**"},{"id":"sd_c_prog_40","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «дискретность»?","a":"Алгоритм делится на **маленькие шаги**."},{"id":"sd_c_prog_41","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «понятность»?","a":"Команды **понятны исполнителю**."},{"id":"sd_c_prog_42","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «определённость» (детерминированность)?","a":"Каждый шаг определён **однозначно**."},{"id":"sd_c_prog_43","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «конечность»?","a":"Алгоритм **завершается за конечное число шагов**."},{"id":"sd_c_prog_44","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «результативность»?","a":"Алгоритм **приводит к требуемому результату**."},{"id":"sd_c_prog_45","subjectId":"s_oap","cat":"Алгоритмы","q":"Что значит свойство «массовость»?","a":"Алгоритм подходит для решения **целого класса однотипных задач**."},{"id":"sd_c_prog_46","subjectId":"s_oap","cat":"Алгоритмы","q":"Как записать алгоритм «найти большее из двух чисел» словами и на Python?","a":"**Словами:** если (if) a > b, то больше a, иначе больше b.\n\n~~~\nif a > b:\n    print(a)\nelse:\n    print(b)\n~~~"},{"id":"sd_c_prog_47","subjectId":"s_oap","cat":"Алгоритмы","q":"Какие бывают типы алгоритмов?","a":"**Линейные, разветвляющиеся, циклические.**"},{"id":"sd_c_prog_48","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое линейный алгоритм?","a":"Команды выполняются **последовательно**."},{"id":"sd_c_prog_49","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое разветвляющийся алгоритм?","a":"**Выбор** дальнейших действий зависит от **условия**."},{"id":"sd_c_prog_50","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое циклический алгоритм?","a":"Какая-то часть алгоритма **повторяется многократно**."},{"id":"sd_c_prog_51","subjectId":"s_oap","cat":"Алгоритмы","q":"Какие два вида циклических алгоритмов бывают?","a":"- **С известным числом повторений** — число повторений известно заранее (цикл со счётчиком).\n- **С неизвестным числом повторений** — количество повторений заранее не известно."},{"id":"sd_c_prog_52","subjectId":"s_oap","cat":"Алгоритмы","q":"Какие есть способы записи алгоритмов?","a":"1. **Словесно**\n2. **Графически**\n3. **Псевдокод**\n4. **Программно**"},{"id":"sd_c_prog_53","subjectId":"s_oap","cat":"Алгоритмы","q":"Что такое трассировка алгоритма?","a":"**Пошаговое выполнение** алгоритма (программы)."},{"id":"sd_c_prog_54","subjectId":"s_oap","cat":"Блок-схемы","q":"Из каких блоков состоит блок-схема сложения двух чисел?","a":"**начало** → ввод a, b → s = a + b → вывод s → **конец**\n\n~~~\na = int(input(\"первое число\"))\nb = int(input(\"второе число\"))\nc = a + b\nprint(c)\n~~~\n\nНа схеме результат называется **s** (s = a + b). Это **линейный** алгоритм."},{"id":"sd_c_prog_55","subjectId":"s_oap","cat":"Блок-схемы","q":"Какие символы используют в блок-схемах?","a":"- **Овал** — начало или конец\n- **Параллелограмм** — ввод / вывод\n- **Прямоугольник** — действия (вычисления)\n- **Ромб** — условие (записывается как вопрос)"},{"id":"sd_c_prog_56","subjectId":"s_oap","cat":"Блок-схемы","q":"Что обозначает овал в блок-схеме?","a":"**Начало или конец** алгоритма."},{"id":"sd_c_prog_57","subjectId":"s_oap","cat":"Блок-схемы","q":"Что обозначает параллелограмм в блок-схеме?","a":"**Ввод / вывод** данных."},{"id":"sd_c_prog_58","subjectId":"s_oap","cat":"Блок-схемы","q":"Что обозначает прямоугольник в блок-схеме?","a":"**Действия (вычисления).**"},{"id":"sd_c_prog_59","subjectId":"s_oap","cat":"Блок-схемы","q":"Что обозначает ромб в блок-схеме?","a":"**Условие.** Записывается как вопрос."},{"id":"sd_c_prog_60","subjectId":"s_oap","cat":"Блок-схемы","q":"Как рисуют линии в блок-схемах?","a":"Линии **вверх и влево** — со стрелкой. Линии **вниз и вправо** — без стрелки (можно не рисовать)."},{"id":"sd_c_prog_61","subjectId":"s_oap","cat":"Блок-схемы","q":"С чего начинается и чем заканчивается блок-схема?","a":"Начинается блоком **«начало»**, завершается блоком **«конец»**."},{"id":"sd_c_prog_62","subjectId":"s_oap","cat":"Блок-схемы","q":"Как располагают потоки в блок-схеме?","a":"Основной поток — **сверху вниз**, боковые ветви удобно направлять **слева направо**."},{"id":"sd_c_prog_63","subjectId":"s_oap","cat":"Блок-схемы","q":"Что записывают в ромбе и как подписывают его выходы?","a":"В ромбе записывают **условие**, сформулированное как **вопрос**. Выходы подписывают **«да»** и **«нет»**."},{"id":"sd_c_prog_64","subjectId":"s_oap","cat":"Блок-схемы","q":"Что делают с ветвями после алгоритма выбора, если дальше общий путь?","a":"**Сводят ветви обратно.**"},{"id":"sd_c_prog_65","subjectId":"s_oap","cat":"Блок-схемы","q":"Что обязательно нужно задать в цикле?","a":"- **Начальное значение**\n- **Условие продолжения**\n- **Изменение счётчика**"},{"id":"sd_c_prog_66","subjectId":"s_oap","cat":"Блок-схемы","q":"Чего избегают при рисовании блок-схемы?","a":"**Пересечения линий.**"},{"id":"sd_c_prog_67","subjectId":"s_oap","cat":"Блок-схемы","q":"Как проверяют блок-схему?","a":"**Трассировкой** — на минимальном и граничном наборах данных."},{"id":"sd_c_prog_68","subjectId":"s_oap","cat":"Блок-схемы","q":"Блок-схема цикла со счётчиком: что выведет программа?","a":"Схема: начало → `i = 0` → условие `i \u003c 5`? → да: `i = i + 1`, вывод i → снова к условию; нет → конец.\n\n~~~\ni = 0\nwhile i \u003c 5:\n    i = i + 1\n    print(i)\n~~~\n\nВывод: **1 2 3 4 5**"},{"id":"sd_c_prog_69","subjectId":"s_oap","cat":"Блок-схемы","q":"Назови три части цикла на примере i = 0, i \u003c 5, i = i + 1.","a":"- `i = 0` — **начальное значение**\n- `i \u003c 5` — **условие продолжения**\n- `i = i + 1` — **изменение счётчика**"},{"id":"sd_c_prog_70","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое парадигма программирования?","a":"Совокупность **принципов, идей и способов**, определяющих, как программист представляет задачу и организует её решение."},{"id":"sd_c_prog_71","subjectId":"s_oap","cat":"Парадигмы","q":"Какие стили программирования бывают?","a":"1. **Процедурный**\n2. **Логический**\n3. **Функциональный**\n4. **Объектно-ориентированный**"},{"id":"sd_c_prog_72","subjectId":"s_oap","cat":"Парадигмы","q":"На что обращает внимание каждый подход: структурное, модульное, ООП?","a":"- **Структурное** — порядок выполнения команд.\n- **Модульное** — разделение программы на самостоятельные части.\n- **ООП** — система, объединяющая данные и действия."},{"id":"sd_c_prog_73","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое структурное программирование?","a":"Подход к созданию программ, при котором алгоритм строится из **ограниченного набора конструкций**."},{"id":"sd_c_prog_74","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое управляющая конструкция?","a":"Способ организации **порядка выполнения команд** программы."},{"id":"sd_c_prog_75","subjectId":"s_oap","cat":"Парадигмы","q":"Назови принципы структурного программирования.","a":"1. **Последовательное выполнение**\n2. **Ограниченный набор конструкций**\n3. **Декомпозиция**\n4. **Пошаговая детализация**\n5. **Понятность алгоритмов**"},{"id":"sd_c_prog_76","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое конструкция «следование»?","a":"Порядок **сверху вниз**, линейный."},{"id":"sd_c_prog_77","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое конструкция «ветвление»?","a":"Выполнение зависит от того, **будет ли выполнено условие**."},{"id":"sd_c_prog_78","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое условие в ветвлении?","a":"**Выражение** — числовое или логическое."},{"id":"sd_c_prog_79","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое полное ветвление?","a":"Есть действия и для **«истина»**, и для **«ложь»** (если … иначе …)."},{"id":"sd_c_prog_80","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое неполное ветвление?","a":"Действие только когда условие **истинно** (если …)."},{"id":"sd_c_prog_81","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое конструкция «цикл»?","a":"**Повторение** части алгоритма."},{"id":"sd_c_prog_82","subjectId":"s_oap","cat":"Парадигмы","q":"Как работает вложенное ветвление на примере числа x?","a":"Проверяется число x. Если `x > 0` → вывод **«положительное»**. Иначе проверяется второе условие → вывод **«0»** или **«отрицательное»**."},{"id":"sd_c_prog_83","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое модульное программирование?","a":"Подход, при котором программа делится на **относительно самостоятельные части (модули)**."},{"id":"sd_c_prog_84","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое модуль?","a":"Самостоятельная часть программы, которая решает **определённую подзадачу** и имеет понятный способ взаимодействия с другими частями."},{"id":"sd_c_prog_85","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое подпрограмма?","a":"**Именованная часть программы**, которую можно вызвать из других частей для выполнения определённой задачи (функции, процедуры)."},{"id":"sd_c_prog_86","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое функция?","a":"Подпрограмма, которая получает входные данные, выполняет вычисления и **возвращает результат**."},{"id":"sd_c_prog_87","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое процедура?","a":"Подпрограмма, предназначенная для выполнения **определённой последовательности действий**."},{"id":"sd_c_prog_88","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое интерфейс модуля?","a":"Описание того, **какие данные** модуль получает, **какие действия** предоставляет и **какой результат** отдаёт."},{"id":"sd_c_prog_89","subjectId":"s_oap","cat":"Парадигмы","q":"Каким должен быть хороший модуль?","a":"Он решает **одну задачу**."},{"id":"sd_c_prog_90","subjectId":"s_oap","cat":"Парадигмы","q":"Назови преимущества модульного программирования.","a":"1. **Понятность**\n2. **Повторное использование**\n3. **Удобство изменения**\n4. **Распределение работы**\n5. **Сокращение повторения**"},{"id":"sd_c_prog_91","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое ООП?","a":"**Объектно-ориентированное программирование** — подход (система), объединяющий **данные и действия**."},{"id":"sd_c_prog_92","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое класс?","a":"Описание **общего устройства и поведения** объектов определённого типа."},{"id":"sd_c_prog_93","subjectId":"s_oap","cat":"Парадигмы","q":"Что такое объект?","a":"Конкретный **экземпляр класса**, обладающий собственным состоянием и поведением."},{"id":"sd_c_prog_94","subjectId":"s_oap","cat":"Парадигмы","q":"Назови четыре основных принципа ООП.","a":"1. **Абстракция**\n2. **Инкапсуляция** (объединение данных)\n3. **Наследование**\n4. **Полиморфизм**"},{"id":"sd_c_prog_95","subjectId":"s_oap","cat":"Python","q":"Что такое программа (через понятие инструкций)?","a":"**Последовательность инструкций**, которые выполняет компьютер."},{"id":"sd_c_prog_96","subjectId":"s_oap","cat":"Python","q":"Из каких частей состоит схема программы?","a":"1. **Ввод данных**\n2. **Обработка данных**\n3. **Вывод результата**"},{"id":"sd_c_prog_97","subjectId":"s_oap","cat":"Python","q":"Что делает `print`?","a":"Команда **вывода данных**.\n\n~~~\nprint(\"Hello\")\n~~~"},{"id":"sd_c_prog_98","subjectId":"s_oap","cat":"Python","q":"Что такое инструкция?","a":"Каждая отдельная **команда** программы."},{"id":"sd_c_prog_99","subjectId":"s_oap","cat":"Python","q":"Что за язык Python?","a":"Язык **высокого уровня**."},{"id":"sd_c_prog_100","subjectId":"s_oap","cat":"Python","q":"Назови особенности Python.","a":"1. **Простой и читаемый синтаксис**\n2. **Динамическая типизация**\n3. **Большое количество библиотек**"},{"id":"sd_c_prog_101","subjectId":"s_oap","cat":"Python","q":"Что такое переменная?","a":"**Место в памяти** компьютера, которое имеет **имя**."},{"id":"sd_c_prog_102","subjectId":"s_oap","cat":"Python","q":"Что значит запись `a = 1`?","a":"Знак `=` — **оператор присваивания** («положи»): в переменную `a` кладём значение `1`."},{"id":"sd_c_prog_103","subjectId":"s_oap","cat":"Python","q":"Что делает функция `input()`?","a":"Функция **ввода данных**. Считывает **строку**."},{"id":"sd_c_prog_104","subjectId":"s_oap","cat":"Python","q":"Что делает функция `int()`?","a":"Превращает строку в **целое число** (поэтому `int(input())`)."},{"id":"sd_c_prog_105","subjectId":"s_oap","cat":"Python","q":"Что делает функция `type()`?","a":"Определяет **тип переменной**."},{"id":"sd_c_prog_106","subjectId":"s_oap","cat":"Python","q":"Какие типы данных есть в Python (основные)?","a":"- `int` — целые числа: 1, 2, 3\n- `str` — строки: 'A', \"A\"\n- `float` — вещественные числа: 2.5, 2.6"},{"id":"sd_c_prog_107","subjectId":"s_oap","cat":"Python","q":"Что хранит тип `int`?","a":"**Целые числа:** 1, 2, 3."},{"id":"sd_c_prog_108","subjectId":"s_oap","cat":"Python","q":"Что хранит тип `str`?","a":"**Строки:** 'A', \"A\"."},{"id":"sd_c_prog_109","subjectId":"s_oap","cat":"Python","q":"Что хранит тип `float`?","a":"**Вещественные числа:** 2.5, 2.6."},{"id":"sd_c_prog_110","subjectId":"s_oap","cat":"Python","q":"Напиши программу, которая складывает два введённых числа.","a":"~~~\na = int(input())\nb = int(input())\ns = a + b\nprint(s)\n~~~"},{"id":"sd_c_prog_111","subjectId":"s_oap","cat":"Python","q":"Какие арифметические операции есть у чисел в Python?","a":"- `+` сложение: 2 + 3 = 5\n- `-` вычитание: 5 - 3 = 2\n- `*` умножение: 2 ∗ 3 = 6\n- `/` деление: 7 / 2 = 3.5\n- `**` степень: 2 ∗∗ 6\n- `%` остаток от деления: 17 % 5 = 2\n- `//` целочисленное деление: 17 // 5 = 3"},{"id":"sd_c_prog_112","subjectId":"s_oap","cat":"Python","q":"Что делает операция `/`?","a":"**Деление.** Например, `7 / 2 = 3.5`."},{"id":"sd_c_prog_113","subjectId":"s_oap","cat":"Python","q":"Что делает операция `**`?","a":"**Возведение в степень.** Например, 2⁶ = `2 ** 6`."},{"id":"sd_c_prog_114","subjectId":"s_oap","cat":"Python","q":"Что делает операция `%`?","a":"**Остаток от деления.** Например, `17 % 5 = 2`."},{"id":"sd_c_prog_115","subjectId":"s_oap","cat":"Python","q":"Что делает операция `//`?","a":"**Целочисленное деление.** Например, `17 // 5 = 3`."},{"id":"sd_c_prog_116","subjectId":"s_oap","cat":"Python","q":"Что такое конкатенация строк?","a":"**Сложение строк:** `'A' + 'cat' = 'Acat'`"},{"id":"sd_c_prog_117","subjectId":"s_oap","cat":"Python","q":"Что делает умножение строки на число?","a":"**Повторение строки:** `'A' * 3 = 'AAA'`"},{"id":"sd_c_prog_118","subjectId":"s_oap","cat":"Python","q":"Задача «Конфеты»: 17 конфет, 5 человек. Сколько получит каждый и сколько останется?","a":"~~~\nprint(17 // 5)  # 3 конфеты каждому\nprint(17 % 5)   # 2 конфеты останутся\n~~~"},{"id":"sd_c_prog_119","subjectId":"s_oap","cat":"Python","q":"Задача «Возраст»: вывести возраст через год.","a":"Пользователь вводит возраст (например, 17), выводим 18.\n\n~~~\na = int(input(\"введите возраст: \"))\nprint(\"Через год:\", a + 1)\n~~~"},{"id":"sd_c_prog_120","subjectId":"s_oap","cat":"Python","q":"Задача «Секунды»: найти полные минуты и оставшиеся секунды.","a":"~~~\na = int(input())\nminut = a // 60\nost = a % 60\nprint(minut, ost)\n~~~\n\nДля целых минут нужно **//**, а не `/`."},{"id":"sd_c_prog_121","subjectId":"s_oap","cat":"Python","q":"Задача: найти сумму цифр трёхзначного числа.","a":"~~~\na = int(input(\"Введите число: \"))\na3 = a % 10\na1 = a // 100\na2 = (a - a1 * 100) // 10\nprint(a1 + a2 + a3)\n~~~\n\n`a1` — сотни, `a2` — десятки, `a3` — единицы."},{"id":"sd_c_prog_122","subjectId":"s_oap","cat":"Python","q":"Какой курс на Stepik назначен как домашнее задание по Python?","a":"Курс **«Поколение Python»** для начинающих."},{"id":"sd_c_prog_123","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое HTML?","a":"**Язык разметки гипертекста** — делает страницу из текста."},{"id":"sd_c_prog_124","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое XML?","a":"**Универсальное описание и обмен структурированными данными.**"},{"id":"sd_c_prog_125","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое Markdown?","a":"**Простая разметка** текста и документации."},{"id":"sd_c_prog_126","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое фронтенд?","a":"Всё, что **видит пользователь**."},{"id":"sd_c_prog_127","subjectId":"s_mdk0101","cat":"HTML","q":"Напиши базовую структуру HTML-страницы.","a":"~~~\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Document\u003c/title>\n\u003c/head>\n\u003cbody>\n  ... всё, что будет показано на странице ...\n\u003c/body>\n\u003c/html>\n~~~"},{"id":"sd_c_prog_128","subjectId":"s_mdk0101","cat":"HTML","q":"Что означает `\u003c!DOCTYPE html>`?","a":"Указывает, что это **документ HTML**."},{"id":"sd_c_prog_129","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое `\u003chtml lang=\"en\">`?","a":"**Корневой элемент.** Атрибут `lang` задаёт язык страницы."},{"id":"sd_c_prog_130","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое `\u003chead>`?","a":"**Служебная часть** страницы."},{"id":"sd_c_prog_131","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает `\u003cmeta charset=\"UTF-8\">`?","a":"Задаёт **кодировку** страницы."},{"id":"sd_c_prog_132","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003ctitle>`?","a":"Задаёт **название документа**."},{"id":"sd_c_prog_133","subjectId":"s_mdk0101","cat":"HTML","q":"Что находится в теге `\u003cbody>`?","a":"**Всё, что будет показано** на нашей странице."},{"id":"sd_c_prog_134","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое атрибут?","a":"**Возможности тега.** Примеры: `lang`, `charset`, `href`, `src`."},{"id":"sd_c_prog_135","subjectId":"s_mdk0101","cat":"HTML","q":"Какие бывают теги по типу?","a":"**Блочные** и **строчные**."},{"id":"sd_c_prog_136","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003ch1>`?","a":"Задаёт **заголовок**."},{"id":"sd_c_prog_137","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cp>`?","a":"Задаёт **абзац**."},{"id":"sd_c_prog_138","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cbr>`?","a":"**Перевод на новую строку.**"},{"id":"sd_c_prog_139","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cb>`?","a":"**Жирный текст.**"},{"id":"sd_c_prog_140","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003cstrong>`?","a":"Для **важного выражения**."},{"id":"sd_c_prog_141","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003csmall>`?","a":"**Меньший текст.**"},{"id":"sd_c_prog_142","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cs>`?","a":"**Зачёркнутый текст.**"},{"id":"sd_c_prog_143","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003ci>`?","a":"**Курсив.**"},{"id":"sd_c_prog_144","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужны теги `\u003csub>` и `\u003csup>`?","a":"**Нижний и верхний регистр** (индексы)."},{"id":"sd_c_prog_145","subjectId":"s_mdk0101","cat":"HTML","q":"Как выровнять текст по правому краю?","a":"~~~\n\u003cp align=\"right\">…\u003c/p>\n~~~"},{"id":"sd_c_prog_146","subjectId":"s_mdk0101","cat":"HTML","q":"Как вставить картинку?","a":"~~~\n\u003cimg src=\"…\" width=\"200px\" height=\"300px\">\n~~~\n\nАтрибуты: **адрес, ширина, высота**."},{"id":"sd_c_prog_147","subjectId":"s_mdk0101","cat":"HTML","q":"Как сделать ссылку?","a":"~~~\n\u003ca href=\"адрес\">Ссылка\u003c/a>\n~~~"},{"id":"sd_c_prog_148","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cul>`?","a":"Создаёт **маркированный список**."},{"id":"sd_c_prog_149","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003col>`?","a":"Создаёт **нумерованный список**."},{"id":"sd_c_prog_150","subjectId":"s_mdk0101","cat":"HTML","q":"Что делает тег `\u003cli>`?","a":"Задаёт **элемент списка**."},{"id":"sd_c_prog_151","subjectId":"s_mdk0101","cat":"HTML","q":"Как записать маркированный список из пунктов?","a":"~~~\n\u003cul>\n  \u003cli>молоко\u003c/li>\n  \u003cli>…\u003c/li>\n\u003c/ul>\n~~~"},{"id":"sd_c_prog_152","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003cheader>`?","a":"**Название и вводная часть.** Пишем в начале `\u003cbody>`."},{"id":"sd_c_prog_153","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003cnav>`?","a":"**Навигация** по странице."},{"id":"sd_c_prog_154","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003cmain>`?","a":"**Основное содержимое** страницы."},{"id":"sd_c_prog_155","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003carticle>`?","a":"**Самостоятельный блок** внутри `\u003cmain>`."},{"id":"sd_c_prog_156","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003cfooter>`?","a":"**Справочная информация.**"},{"id":"sd_c_prog_157","subjectId":"s_mdk0101","cat":"HTML","q":"Для чего нужен тег `\u003csection>`?","a":"**Раздел страницы.** В тетради — родитель с заголовком `h2` и списком."},{"id":"sd_c_prog_158","subjectId":"s_mdk0101","cat":"HTML","q":"Что такое `\u003cdiv>`?","a":"**Нейтральный блок** без смысла."},{"id":"sd_c_prog_159","subjectId":"s_mdk0101","cat":"HTML","q":"Как написать комментарий в HTML?","a":"~~~\n\u003c!-- комментарий -->\n~~~\n\nВ браузере **не отображается**."},{"id":"sd_c_prog_160","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое DOM?","a":"**Объектная модель документа.** Браузер представляет загруженный HTML как **дерево узлов**."},{"id":"sd_c_prog_161","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Почему структура в инструментах разработчика иногда отличается от написанного HTML-кода?","a":"HTML-код и DOM связаны, но браузер при разборе может **исправлять ошибочную разметку**."},{"id":"sd_c_prog_162","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое родитель, ребёнок и сосед в DOM?","a":"- **Родитель** — элемент, содержащий другие элементы.\n- **Ребёнок** — элемент внутри родителя.\n- **Сосед** — элементы одного родителя."},{"id":"sd_c_prog_163","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Кто здесь родитель, дети и соседи?","a":"~~~\n\u003cdiv>\n  \u003ch1>Анкета\u003c/h1>\n  \u003cp>Заполните поле\u003c/p>\n\u003c/div>\n~~~\n\n`div` — **родитель**. `h1` и `p` — **дети** и **соседи** друг друга."},{"id":"sd_c_prog_164","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `type=\"text\"`?","a":"Поле для **однострочного текста**."},{"id":"sd_c_prog_165","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `type=\"number\"`?","a":"Поле для ввода **числа**."},{"id":"sd_c_prog_166","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `type=\"password\"`?","a":"Поле для ввода **пароля**."},{"id":"sd_c_prog_167","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `type=\"date\"`?","a":"Поле для ввода **даты**."},{"id":"sd_c_prog_168","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `type=\"color\"`?","a":"Поле для выбора **цвета**."},{"id":"sd_c_prog_169","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `\u003ctextarea>`?","a":"Поле для **многострочного текста**."},{"id":"sd_c_prog_170","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что такое `\u003cselect>` и `\u003coption>`?","a":"`\u003cselect>` — **выпадающий список**. Варианты — `\u003coption value=\"…\">`."},{"id":"sd_c_prog_171","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает `\u003cbutton type=\"submit\">`?","a":"Кнопка **отправки формы**."},{"id":"sd_c_prog_172","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Зачем нужен атрибут `for` у `label`?","a":"**for = id** — связывает подпись `label` и поле."},{"id":"sd_c_prog_173","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Зачем нужен атрибут `name`?","a":"**Имя для отправки данных.**"},{"id":"sd_c_prog_174","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает атрибут `required`?","a":"Делает поле **обязательным**."},{"id":"sd_c_prog_175","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает атрибут `min`?","a":"Задаёт **минимальное значение** (для чисел)."},{"id":"sd_c_prog_176","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает атрибут `placeholder`?","a":"**Подсказка** внутри пустого поля."},{"id":"sd_c_prog_177","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает атрибут `rows`?","a":"Задаёт **число строк** в `textarea`."},{"id":"sd_c_prog_178","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Что делает атрибут `value` у `option`?","a":"Задаёт **значение варианта**."},{"id":"sd_c_prog_179","subjectId":"s_mdk0101","cat":"DOM и формы","q":"Напиши простую форму с именем, возрастом и «О себе».","a":"~~~\n\u003cform>\n  \u003clabel for=\"name\">Имя\u003c/label>\n  \u003cinput id=\"name\" name=\"name\" type=\"text\" required>\n\n  \u003clabel for=\"age\">Возраст\u003c/label>\n  \u003cinput id=\"age\" name=\"age\" type=\"number\" min=\"0\">\n\n  \u003clabel for=\"about\">О себе\u003c/label>\n  \u003ctextarea id=\"about\" name=\"about\">\u003c/textarea>\n\n  \u003cbutton type=\"submit\">Отправить\u003c/button>\n\u003c/form>\n~~~"},{"id":"sd_c_prog_180","subjectId":"s_mdk0101","cat":"CSS","q":"Как подключить CSS-файл к странице?","a":"~~~\n\u003clink rel=\"stylesheet\" href=\"style.css\">\n~~~"},{"id":"sd_c_prog_181","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое селектор?","a":"Отвечает на вопрос: **к каким элементам применить правила**."},{"id":"sd_c_prog_182","subjectId":"s_mdk0101","cat":"CSS","q":"Какие виды селекторов есть?","a":"- По тегу: `p { }`\n- По классу: `.note { }`\n- По id: `#title { }`"},{"id":"sd_c_prog_183","subjectId":"s_mdk0101","cat":"CSS","q":"Что выбирает селектор `p { }`?","a":"**Все теги** `p`."},{"id":"sd_c_prog_184","subjectId":"s_mdk0101","cat":"CSS","q":"Что выбирает селектор `.note { }`?","a":"**Все элементы с классом** `note`."},{"id":"sd_c_prog_185","subjectId":"s_mdk0101","cat":"CSS","q":"Что выбирает селектор `#title { }`?","a":"Элемент с `id=\"title\"`. **id не может повторяться**: на странице он должен быть один."},{"id":"sd_c_prog_186","subjectId":"s_mdk0101","cat":"CSS","q":"Что делает свойство `color`?","a":"Задаёт **цвет текста** (blue, red)."},{"id":"sd_c_prog_187","subjectId":"s_mdk0101","cat":"CSS","q":"Что делает свойство `background`?","a":"Задаёт **цвет фона** (green)."},{"id":"sd_c_prog_188","subjectId":"s_mdk0101","cat":"CSS","q":"Что делает свойство `font-size`?","a":"Задаёт **размер текста** (20px)."},{"id":"sd_c_prog_189","subjectId":"s_mdk0101","cat":"CSS","q":"Что делает свойство `font-weight`?","a":"**Выделяет текст** (bold — жирный)."},{"id":"sd_c_prog_190","subjectId":"s_mdk0101","cat":"CSS","q":"Что делает свойство `border`?","a":"Задаёт **границу** (1px)."},{"id":"sd_c_prog_191","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое блочная модель?","a":"Каждый элемент — это **вложенные «коробки»**: `margin` → `border` → `padding` → `content`."},{"id":"sd_c_prog_192","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое `margin`?","a":"**Внешний отступ.**"},{"id":"sd_c_prog_193","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое `border` в блочной модели?","a":"**Граница.**"},{"id":"sd_c_prog_194","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое `padding`?","a":"**Внутренний отступ.**"},{"id":"sd_c_prog_195","subjectId":"s_mdk0101","cat":"CSS","q":"Что такое `content` в блочной модели?","a":"**Содержимое** (текст, картинки)."},{"id":"sd_c_prog_196","subjectId":"s_mdk0101","cat":"CSS","q":"Чему равна полная ширина карточки: width 300px, padding 20px, border 1px, margin 30px?","a":"~~~\n.card {\n  width: 300px;\n  padding: 20px;\n  border: 1px solid black;\n  margin: 30px;\n}\n~~~\n\n300 + 2·20 + 2·1 + 2·30 = **402 px** (по умолчанию)."},{"id":"sd_c_prog_197","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Какие есть способы проверки страницы?","a":"- **DevTools** (инструменты разработчика)\n- **Валидатор**\n\nВ тетради записаны только эти два, способ №2 не записан."},{"id":"sd_c_prog_198","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Как проверить страницу через DevTools?","a":"Открываем инструменты разработчика (**F12**) и нажимаем кнопку выбора элемента на странице. Смотрим вкладку **Elements**."},{"id":"sd_c_prog_199","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Что показывает вкладка Elements в панели разработчика?","a":"**DOM** и применённые стили выбранного элемента."},{"id":"sd_c_prog_200","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Что показывает вкладка Network?","a":"Картинки, CSS: **проверка загрузки файлов**."},{"id":"sd_c_prog_201","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Что показывает вкладка Console?","a":"**Сообщения об ошибках.**"},{"id":"sd_c_prog_202","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Что делает валидатор?","a":"Сравнивает разметку с **правилами стандарта**."},{"id":"sd_c_prog_203","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Из каких элементов состоит страница «Анкета»?","a":"1. Заголовок — `\u003ch1>`\n2. Пояснение — `\u003cp>`\n3. Имя — `\u003cinput type=\"text\" required>`\n4. Возраст — `\u003cinput type=\"number\">`\n5. Интересы — `\u003cselect>` + `\u003coption>`\n6. Рассказ о себе — `\u003ctextarea>`\n7. Кнопка и место для результата — `\u003cbutton type=\"submit\">` + `\u003cdiv>`"},{"id":"sd_c_prog_204","subjectId":"s_mdk0101","cat":"Проверка и анкета","q":"Как сделать поле «Интересы» на странице-анкете?","a":"~~~\n\u003clabel for=\"interests\">…\u003c/label>\n\u003cdiv>\n  \u003cselect id=\"interests\">\n    \u003coption value=\"спорт\">Спорт\u003c/option>\n    \u003coption value=\"рисование\">Рисование\u003c/option>\n  \u003c/select>\n\u003c/div>\n~~~"},{"id":"sd_c_prog_t0","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое технология программирования и какие проблемы она решает?","a":"**Технология программирования** — совокупность методов, приёмов, средств и правил применения схемы на всех этапах разработки ПО: от постановки задачи до сопровождения готовой программы.\n\n**Проблемы, которые она решает:**\n\n- сложность;\n- коллективная разработка;\n- надёжность;\n- сопровождение;\n- сроки и стоимость;\n- изменяемость требований.\n\nВ 1960–1970 годах случился **кризис программирования**. Ответом стали структурное, затем модульное и объектно-ориентированное программирование."},{"id":"sd_c_prog_t1","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое программа, язык программирования, исходный код и транслятор?","a":"| Термин | Определение |\n|---|---|\n| Программа | Алгоритм, написанный на языке программирования. Формула: программа = алгоритм + данные |\n| Язык программирования | Формальный язык для записи алгоритмов в виде, понятном компьютеру |\n| Исходный код | Программа в текстовом виде, понятная человеку |\n| Транслятор | Переводчик с исходного кода на машинный язык |"},{"id":"sd_c_prog_t2","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Какие бывают трансляторы? Чем компилятор отличается от интерпретатора?","a":"Три типа: **компилятор, интерпретатор, ассемблер**.\n\n- **Компилятор** сразу переводит всю программу. Языки такого типа называют компилируемыми.\n- **Интерпретатор** переводит построчно: выполняет код по одной строке.\n- **Ассемблер** переводит команды языка ассемблера в машинный код."},{"id":"sd_c_prog_t3","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Расскажите про жизненный цикл ПО: этапы и модели.","a":"**Жизненный цикл** — период от решения о создании программного продукта до его полного изъятия из эксплуатации.\n\n**Этапы:**\n\n1. анализ требований (постановка задачи);\n2. техническое задание (результат анализа);\n3. проектирование (модули, взаимодействие, интерфейс);\n4. реализация (кодирование);\n5. тестирование и отладка;\n6. внедрение и эксплуатация;\n7. сопровождение.\n\n**Модели:** каскадная (строго последовательно), итерационные (циклы, каждая итерация даёт рабочую версию), спиральная (итерации + анализ рисков), гибкие методологии Agile (короткие циклы и обратная связь с заказчиком)."},{"id":"sd_c_prog_t4","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Какие бывают ошибки и виды тестирования? Что такое отладка?","a":"**Отладка** — поиск ошибок в программе с помощью отладчика.\n\n| Ошибка | Признак |\n|---|---|\n| Синтаксическая | нарушены правила языка, программа не запускается |\n| Логическая | программа работает, но результат неверный |\n| Рантайм | возникает во время работы программы |\n\n| Тестирование | Что проверяет |\n|---|---|\n| Модульное | отдельные модули |\n| Интеграционное | как модули работают вместе |\n| Функциональное | соответствие требованиям |"},{"id":"sd_c_prog_t5","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое алгоритм? Назовите его свойства.","a":"**Алгоритм** — точное и понятное описание последовательности действий, которые приводят от исходных данных к результату за конечное число шагов.\n\n**Исполнитель** понимает и выполняет команды; **система команд** — набор команд исполнителя.\n\n| Свойство | Суть |\n|---|---|\n| Дискретность | маленькие шаги |\n| Понятность | команды понятны исполнителю |\n| Определённость | каждый шаг однозначен |\n| Конечность | завершается за конечное число шагов |\n| Результативность | приводит к результату |\n| Массовость | решает класс однотипных задач |"},{"id":"sd_c_prog_t6","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Какие бывают типы алгоритмов и способы их записи?","a":"**Типы:** линейные (последовательно), разветвляющиеся (выбор по условию), циклические (повторение). Циклы бывают с известным числом повторений (со счётчиком) и с неизвестным.\n\n**Способы записи:** словесно, графически, псевдокод, программно.\n\n**Трассировка** — пошаговое выполнение алгоритма."},{"id":"sd_c_prog_t7","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Расскажите про блок-схемы: символы и основные правила.","a":"| Символ | Значение |\n|---|---|\n| Овал | начало или конец |\n| Параллелограмм | ввод / вывод |\n| Прямоугольник | действия (вычисления) |\n| Ромб | условие, записывается как вопрос |\n\n**Правила:** начинать с «начало» и заканчивать «конец»; поток сверху вниз; подписывать выходы ромба «да» и «нет»; сводить ветви; в цикле задавать начальное значение, условие продолжения и изменение счётчика; избегать пересечения линий; проверять схему трассировкой на минимальном и граничном наборах данных.\n\n**Линии:** вверх и влево со стрелкой, вниз и вправо без стрелки."},{"id":"sd_c_prog_t8","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое парадигма программирования? Расскажите про структурное программирование.","a":"**Парадигма** — совокупность принципов, идей и способов, определяющих, как программист представляет задачу и организует её решение. Стили: процедурный, логический, функциональный, объектно-ориентированный.\n\n**Структурное программирование** — алгоритм строится из ограниченного набора конструкций. Принципы: последовательное выполнение, ограниченный набор конструкций, декомпозиция, пошаговая детализация, понятность алгоритмов.\n\n**Конструкции:** следование, ветвление (полное и неполное), цикл. **Условие** — числовое или логическое выражение."},{"id":"sd_c_prog_t9","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое модульное программирование? Назовите преимущества.","a":"Подход, при котором программа делится на относительно самостоятельные части — **модули**. Модуль решает определённую подзадачу и имеет понятный способ взаимодействия с другими частями.\n\n| Термин | Значение |\n|---|---|\n| Подпрограмма | именованная часть программы, которую можно вызвать |\n| Функция | получает данные, вычисляет и возвращает результат |\n| Процедура | выполняет последовательность действий |\n| Интерфейс модуля | какие данные модуль получает, какие действия даёт и какой результат отдаёт |\n\n**Хороший модуль решает одну задачу.** Преимущества: понятность, повторное использование, удобство изменения, распределение работы, сокращение повторения."},{"id":"sd_c_prog_t10","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое ООП? Какие у него принципы?","a":"**ООП** — подход (система), объединяющий данные и действия.\n\n- **Класс** — описание общего устройства и поведения объектов определённого типа.\n- **Объект** — конкретный экземпляр класса со своим состоянием и поведением.\n\n**Четыре принципа:** абстракция, инкапсуляция (объединение данных), наследование, полиморфизм."},{"id":"sd_c_prog_t11","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Что такое переменная в Python? Какие типы данных и функции вы знаете?","a":"**Переменная** — место в памяти, которое имеет имя. Запись `a = 1`: знак `=` — оператор присваивания.\n\n| Тип | Что хранит |\n|---|---|\n| int | целые числа |\n| str | строки |\n| float | вещественные числа |\n\nФункции: `input()` — ввод (считывает строку), `int()` — превращает строку в целое, `type()` — тип переменной, `print()` — вывод.\n\n~~~\na = int(input())\nb = int(input())\ns = a + b\nprint(s)\n~~~"},{"id":"sd_c_prog_t12","subjectId":"s_oap","cat":"Вопросы к зачёту","q":"Какие арифметические операции есть в Python? Решите задачи про конфеты и секунды.","a":"`+` сложение, `-` вычитание, `*` умножение, `/` деление, `**` степень, `%` остаток, `//` целочисленное деление.\n\n**Конфеты (17 на 5):**\n\n~~~\nprint(17 // 5)  # 3\nprint(17 % 5)   # 2\n~~~\n\n**Секунды → минуты и секунды:**\n\n~~~\na = int(input())\nprint(a // 60, a % 60)\n~~~\n\nДля строк: конкатенация `'A' + 'cat'` и повторение `'A' * 3`."},{"id":"sd_c_prog_t13","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Опишите базовую структуру HTML-страницы.","a":"~~~\n\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003ctitle>Document\u003c/title>\n\u003c/head>\n\u003cbody>\n  ...\n\u003c/body>\n\u003c/html>\n~~~\n\n- **DOCTYPE** — документ HTML;\n- **html** — корневой элемент, lang — язык;\n- **head** — служебная часть;\n- **meta charset** — кодировка;\n- **title** — название документа;\n- **body** — всё, что показывается на странице.\n\n**Атрибут** — возможности тега (lang, charset, href, src)."},{"id":"sd_c_prog_t14","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Какие семантические элементы есть в HTML и чем они лучше div?","a":"- **header** — название и вводная часть, пишется в начале body;\n- **nav** — навигация;\n- **main** — основное содержимое;\n- **article** — самостоятельный блок внутри main;\n- **section** — раздел страницы;\n- **footer** — справочная информация.\n\n**div** — нейтральный блок без смысла. Семантические теги показывают, какую роль играет блок. Комментарий пишется `\u003c!-- комментарий -->`."},{"id":"sd_c_prog_t15","subjectId":"s_mdk0101","cat":"Вопросы к зачёту","q":"Что такое DOM? Объясните «родитель», «ребёнок», «сосед».","a":"**DOM** — объектная модель документа: браузер представляет загруженный HTML как дерево узлов. Браузер может исправлять ошибочную разметку, поэтому DOM иногда отличается от написанного кода.\n\n- **Родитель** — элемент, содержа
