         1. УТИЛИТЫ
         ========================================================================== */
      const U = {
        uid: (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4),
        esc: s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])),
        pad: n => String(n).padStart(2, '0'),
        /* Даты храним строкой YYYY-MM-DD (локальная дата, без часовых поясов) */
        iso(d) {return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate());},
        fromISO(s) {const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]);},

        dayDiff(a, b) {return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);},

        fmtLong: d => new Intl.DateTimeFormat('ru-RU', {weekday: 'long', day: 'numeric', month: 'long'}).format(d),
        plural(n, a, b, c) {n = Math.abs(n) % 100; const k = n % 10; if (n > 10 && n < 20) return c; if (k > 1 && k < 5) return b; if (k === 1) return a; return c;},
        initials: n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?',
        norm: s => String(s || '').toLowerCase().replace(/ё/g, 'е'),
        shuffle(a) {a = a.slice(); for (let i = a.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t;} return a;}
      };

      /* Числитель / знаменатель: неделя, в которой лежит «якорный» понедельник, — числитель, дальше чередуем */

      /* ==========================================================================

      const Md = (() => {

        const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l || '');
        const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        const isBlock = l => /^(#{1,3}\s|```|~~~|>\s?|\s*[-*]\s+|\s*\d+[.)]\s+|-{3,}\s*$|\|)/.test(l);

        function render(src) {
          const L = String(src || '').replace(/\r/g, '').split('\n'); const out = []; let i = 0, m;
          while (i < L.length) {
            const l = L[i];
            if (/^(```|~~~)/.test(l)) {                                  // блок кода
              const fence = l.slice(0, 3); const buf = []; i++;
              while (i < L.length && !L[i].startsWith(fence)) {buf.push(L[i]); i++;} i++;
              out.push('<pre><code>' + U.esc(buf.join('\n')) + '</code></pre>'); continue;
            }
            if (!l.trim()) {i++; continue;}
            if ((m = l.match(/^(#{1,3})\s+(.*)$/))) {const n = m[1].length + 1; out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); i++; continue;}
            if (/^(-{3,}|\*{3,})\s*$/.test(l)) {out.push('<hr>'); i++; continue;}
            if (/^>\s?/.test(l)) {
              const b = []; while (i < L.length && /^>\s?/.test(L[i])) {b.push(L[i].replace(/^>\s?/, '')); i++;}
              out.push('<blockquote>' + b.map(inline).join('<br>') + '</blockquote>'); continue;
            }
            if (/^\s*[-*]\s+/.test(l)) {
              const b = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) {b.push('<li>' + inline(L[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++;}
              out.push('<ul>' + b.join('') + '</ul>'); continue;
            }
            if (/^\s*\d+[.)]\s+/.test(l)) {
              const b = []; while (i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) {b.push('<li>' + inline(L[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++;}
              out.push('<ol>' + b.join('') + '</ol>'); continue;
            }
            if (/^\|/.test(l) && isTableSep(L[i + 1])) {                      // таблица
              const head = cells(l); i += 2; const rows = [];
              while (i < L.length && /^\|/.test(L[i])) {rows.push(cells(L[i])); i++;}
              out.push('<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
                rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'); continue;
            }
            const p = []; while (i < L.length && L[i].trim() && (p.length === 0 || !isBlock(L[i]))) {p.push(inline(L[i])); i++;}
            out.push('<p>' + p.join('<br>') + '</p>');
          }
          return out.join('');
        }
        return {render, inline};
      })();

          return h;

              const {error} = await supa.from('docs').upsert({path, data: obj, updated: new Date().toISOString()});
              if (error) throw error;
            },
            async delete() {
              const {error} = await supa.from('docs').delete().eq('path', path);
              if (error) throw error;
            },
            collection(name) {return colAPI(path + '/' + name);},
            async acquire({holder}) {
              const {error} = await supa.from('docs').insert({path, data: {uid: holder, at: new Date().toISOString()}, updated: new Date().toISOString()});
              if (error && error.code === '23505') {
                const {data} = await supa.from('docs').select('data').eq('path', path).maybeSingle();
                if (data && data.data && data.data.uid === holder) return {acquired: true};
                return {acquired: false};
              }
              if (error) return {acquired: false, error};
              return {acquired: true};
            },
            onSnapshot(cb, errCb) {
              const run = async () => {
                try {
                  const {data, error} = await supa.from('docs').select('data').eq('path', path).maybeSingle();
                  if (error) throw error;
                  cb({exists: !!data, data: () => data ? data.data : null});
                } catch (e) {if (errCb) errCb(e);}
              };
              run();
              const id = setInterval(run, 20000);
              return {unsubscribe: () => clearInterval(id)};
            }
          };
        }
        function colAPI(prefix) {
          const p = prefix + '/';
          return {
            doc(id) {return docAPI(p + id);},
            onSnapshot(cb, errCb) {
              const run = async () => {
                try {
                  const {data, error} = await supa.from('docs').select('path,data').like('path', p + '%');
                  if (error) throw error;
                  const direct = (data || []).filter(r => r.path.slice(p.length).indexOf('/') === -1);
                  cb({docs: direct.map(r => ({id: r.path.slice(p.length), data: () => r.data}))});
                } catch (e) {if (errCb) errCb(e);}
              };
              run();
              const id = setInterval(run, 20000);
              return {unsubscribe: () => clearInterval(id)};

      /* Сжатие фото до ~170 КБ: в базе документ не может быть больше 256 КБ */
      async function compressImage(file, maxBytes) {
        maxBytes = maxBytes || 170000;
        const url = URL.createObjectURL(file);
        try {
          const img = await new Promise((res, rej) => {const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('bad image')); i.src = url;});
          let dim = 1200, q = .82;
          for (let k = 0; k < 8; k++) {
            const sc = Math.min(1, dim / Math.max(img.width, img.height)), c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            const data = c.toDataURL('image/jpeg', q);
            if (data.length * .75 <= maxBytes) return data;
            q = Math.max(.4, q - .1); if (k % 2 === 1) dim = Math.round(dim * .8);
          }
          throw new Error('too big');
        } finally {URL.revokeObjectURL(url);}
      }
      const readDataUrl = f => new Promise((res, rej) => {const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(f);});

      /* ==========================================================================
         4d. ПОСЕЩАЕМОСТЬ: п — присутствую, о — опоздал(а), н — нет, у — по справке
         ========================================================================== */
      const Att = {
        subOk(l, sub) {const m = /подгр\.?\s*(\d)/i.exec(l.subgroup || ''); return !m || !sub || m[1] === String(sub);},
        /* пары дня (по расписанию и чётности недели), сгруппированные по номеру пары */
        /* Пары дня с учётом отмен и замен: state = ok | cancel | replace */
        dayView(date, sub) {
          const d = U.fromISO(date), ls = lessonsFor(U.dayIdx(d), weekType(d)).filter(l => Att.subOk(l, sub)), by = new Map();
          ls.forEach(l => {if (!by.has(l.pair)) by.set(l.pair, []); by.get(l.pair).push(l);});
          const out = [...by].map(e => ({pair: e[0], lessons: e[1], state: 'ok', change: null, orig: null}));
          Changes.items().filter(c => c.date === date).forEach(c => {
            const pr = out.find(x => x.pair === c.pair);
            if (c.type === 'cancel') {if (pr) {pr.state = 'cancel'; pr.change = c;} return;}
            const rl = {id: 'chg_' + c.id, day: U.dayIdx(d), pair: c.pair, week: 'both', subjectId: c.newSubjectId || (pr && pr.lessons[0].subjectId) || '', room: c.newRoom || '', subgroup: '', who: c.newTeacher || '', start: '', end: ''};
            if (pr) {pr.state = 'replace'; pr.change = c; pr.orig = pr.lessons; pr.lessons = [rl];}
            else out.push({pair: c.pair, lessons: [rl], state: 'replace', change: c, orig: []});
          });
          return out.sort((a, b) => a.pair - b.pair);
        },
        pairs(date, sub) {return Att.dayView(date, sub).filter(p => p.state !== 'cancel');},
        covered: (certs, date) => (certs || []).some(c => c.from <= date && date <= c.to),
        eff(marks, certs, date, pair) {
          const m = marks[date + '|' + pair], cov = Att.covered(certs, date);
          if (m === 'н' && cov) return 'у';
          if (!m && cov) return 'у';
          return m || '';
        },
        pct: (a, b) => b > 0 ? Math.round(a * 100 / b) : null,
        /* часы пропусков без уважительной причины с 15.10.2026 (дни по справке не считаются) */
        absHours: (marks, certs, sub) => Att.stats(marks, certs, sub, ATT_START, '9999-12-31').a * PAIR_HOURS,
        zone(h) {const left = Math.max(0, ABS_LIMIT - h); return {h, left, cls: h >= ABS_LIMIT ? 'red' : left <= ABS_WARN_LEFT ? 'warn' : 'ok'};},
        stats(marks, certs, sub, from, to) {
          const today = U.iso(U.today()), r = {total: 0, p: 0, l: 0, a: 0, x: 0, u: 0, bySubj: {}, byDay: {}};
          const start = from < ATT_START ? ATT_START : from, end = to > today ? today : to;
          if (start > end) {r.pct = null; return r;}
          for (let d = U.fromISO(start), e = U.fromISO(end); d <= e; d = U.addDays(d, 1)) {
            const di = U.iso(d);
            Att.pairs(di, sub).forEach(pr => {
              const st = Att.eff(marks, certs, di, pr.pair), sid = pr.lessons[0].subjectId;
              const b = r.bySubj[sid] || (r.bySubj[sid] = {p: 0, l: 0, a: 0, x: 0, u: 0, total: 0});
              r.total++; b.total++;
              if (st === 'п') {r.p++; b.p++;} else if (st === 'о') {r.l++; b.l++;} else if (st === 'н') {r.a++; b.a++;} else if (st === 'у') {r.x++; b.x++;}
              else if (di < today) {r.u++; b.u++;}
              (r.byDay[di] = r.byDay[di] || []).push(st);
            });
          }
          r.pct = Att.pct(r.p + r.l, r.p + r.l + r.a);
          Object.keys(r.bySubj).forEach(k => {const b = r.bySubj[k]; b.pct = Att.pct(b.p + b.l, b.p + b.l + b.a);});
          return r;
        },
        set(uid, date, pair, st) {
          const key = date + '|' + pair;
          if (!uid && Cloud.status === 'online' && date !== U.iso(U.today())) {toast(Cloud.isAdmin ? 'Задним числом отметить себя нельзя. Исправить можно в «Группа» → «Список группы» → ваша строка' : 'Задним числом отметить нельзя. Нажмите «Попросить админа» в чате с Политешиком'); return;}
          if (!uid && Cloud.status === 'online' && Store.s.attendance.marks[key]) {toast(Cloud.isAdmin ? 'Как и у всех, свою отметку здесь менять нельзя. Исправить можно в «Группа» → «Список группы» → ваша строка' : 'Отметка уже поставлена — исправить её может только админ группы'); return;}
          if (!uid || uid === Cloud.uid || Cloud.status !== 'online') {
            const m = Store.s.attendance.marks; if (m[key] === st) delete m[key]; else m[key] = st;
            if (Cloud.status === 'online') Store.s.meta.pendingAtt = true;
            Store.save(); if (Cloud.status === 'online') Cloud.pushAtt();
          } else Cloud.setMarkFor(uid, key, st);
          App.render();
        }
      };

      /* Все работы: общие (их ведёт админ группы) + личные */
      function allWorks() {
        const s = Store.s, out = [], seen = new Set();
        if (Cloud.status === 'online') Cloud.gworks.forEach(w => {
          out.push({kind: 'gwork', id: w.id, title: w.title, type: w.type || 'Работа', subjectId: w.subjectId, date: w.date, time: w.time || '', done: !!s.groupDone[w.id], g: true, notes: w.notes || ''});
          seen.add(w.title + '|' + w.date);
        });
        s.works.forEach(w => {if (!seen.has(w.title + '|' + w.date)) out.push({kind: 'work', id: w.id, title: w.title, type: w.type || 'Работа', subjectId: w.subjectId, date: w.date, time: w.time || '', done: !!w.done, g: false, notes: w.notes || ''});});
        return out;
      }

      /* ==========================================================================
         4e. ЧАТ С ПОЛИТЕШИКОМ: за 24 часа до работы (с 9:00 накануне до 9:00 дня работы)
         спрашивает «готов?»; «да» — желает удачи, «нет» — присылает конспекты и карточки.
         Письма появляются, когда страница открыта (браузер не умеет будить закрытую страницу).
         ========================================================================== */
      const Chat = {
        blank: () => ({msgs: [], answers: {}, asked: {}, follow: {}, flags: {}, reqs: [], updated: '', readAt: ''}),
        st: () => Store.s.chat,
        save() {const c = Chat.st(); c.updated = new Date().toISOString(); Store.save(); if (Cloud.status === 'online') Cloud.pushChat();},
        push(from, text, extra) {
          const c = Chat.st(); c.msgs.push(Object.assign({id: U.uid('m'), t: new Date().toISOString(), from, text}, extra || {}));
          if (c.msgs.length > 80) c.msgs = c.msgs.slice(-80);
          if (from === 'bot' && document.hidden) Notifier.show('chat', 'Политешик', String(text).slice(0, 100), {tag: 'chat'});
        },
        unread() {const c = Chat.st(); return c.msgs.filter(m => (m.from === 'bot' || m.from === 'admin') && m.t > (c.readAt || '')).length;},
        markRead() {const c = Chat.st(); c.readAt = new Date().toISOString(); Store.save();},
        window(w) {                                                   // окно напоминания: [9:00 накануне, 9:00 дня работы)
          const end = U.fromISO(w.date); end.setHours(9, 0, 0, 0);
          const start = new Date(end); start.setDate(start.getDate() - 1);
          return {start, end};
        },
        tick() {
          if (Cloud.status === 'online' && !(Cloud.chatLoaded && Cloud.attLoaded && Cloud.certsLoaded)) return false;
          const c = Chat.st(), now = new Date(); let changed = false;
          if (!c.msgs.length) {
            Chat.push('bot', 'Привет! Я Политешик — житель этого приложения 🌱\nЗа сутки до работы я напишу тебе и спрошу, готов(а) ли ты. Если нет — пришлю конспекты и карточки. Ещё могу рассказать про пары и работы: спроси «что сегодня?» или «какие работы?».', {mood: 'wink'});
            changed = true;
          }
          allWorks().forEach(w => {
            if (w.done) return;
            const win = Chat.window(w); if (now < win.start || now >= win.end) return;
            const wk = w.id + '@' + w.date, sb = subj(w.subjectId);
            if (!c.asked[wk]) {
              const hrs = Math.max(1, Math.round((dueDate(w.date, w.time || '09:00') - now) / 36e5));
              const when = (hrs >= 23 && hrs <= 25) ? 'Через 24 часа' : 'Через ' + hrs + ' ' + U.plural(hrs, 'час', 'часа', 'часов');
              Chat.push('bot', '⏰ ' + when + ' — «' + w.title + '»' + (sb ? '\nПредмет: ' + sb.name : '') + '\n(' + U.fmtShort(U.fromISO(w.date)) + (w.time ? ', ' + w.time : '') + ')\n\nТы готов(а)?', {mood: 'worried', ask: wk});
              c.asked[wk] = now.toISOString(); changed = true;
            } else if (c.answers[wk] && c.answers[wk].a === 'n' && c.follow[wk] && now >= new Date(c.follow[wk])) {
              Chat.push('bot', 'Как подготовка по «' + w.title + '»? Осталось ' + Math.max(1, Math.round((win.end - now) / 36e5)) + ' ч. Теперь готов(а)?', {mood: 'happy', ask: wk});
              c.follow[wk] = ''; changed = true;
            }
          });
          if (Chat.missCheck()) changed = true;
          if (Chat.absCheck()) changed = true;
          if (Chat.monthly()) changed = true;
          if (changed) Chat.save();
          return changed;
        },
        /* Не отметился за прошлый день: Политешик спрашивает, не напомнить ли админу (раз в день, за последнюю неделю) */
        missCheck() {
          const c = Chat.st(), s = Store.s; c.flags = c.flags || {}; let changed = false;
          for (let i = 1; i <= 7; i++) {
            const d = U.iso(U.addDays(U.today(), -i)); if (d < ATT_START) break;
            const prs = Att.pairs(d, s.settings.subgroup); if (!prs.length) continue;
            const miss = prs.filter(p => !s.attendance.marks[d + '|' + p.pair] && !Att.covered(Cloud.my.certs, d));
            if (miss.length && !c.flags['miss:' + d]) {
              c.flags['miss:' + d] = 1;
              Chat.push('bot', 'Привет! Ты не отметился за ' + U.fmtShort(U.fromISO(d)) + '. Напомнить админу?', {mood: 'thinking', req: d}); changed = true;
            }
          }
          return changed;
        },
        reqAdmin(mid, date) {
          const c = Chat.st(); c.reqs = c.reqs || [];
          c.msgs.forEach(m => {if (m.id === mid) m.done = true;});
          if (!c.reqs.some(r => r.date === date)) c.reqs.push({date, at: new Date().toISOString(), done: false});
          Chat.push('me', 'Да, попросить админа');
          Chat.push('bot', 'Готово! Передал админу просьбу поставить отметку за ' + U.fmtShort(U.fromISO(date)) + '. Он увидит её и отметит сам 👌', {mood: 'happy'});
          Chat.save(); App.render();
        },
        faq(i) {
          const it = faqItems()[i]; if (!it) return;
          Chat.push('me', it.q); Chat.push('bot', it.a.replace(/\[дата\]/g, U.fmtShort(U.today())), {mood: 'happy'});
          Store.s.meta.msgSent = (Store.s.meta.msgSent || 0) + 1; Chat.save(); App.render(); Ach.check();
        },
        /* Лимит пропусков без уважительной причины: 24 ч. Осталось ≤4 ч — предупреждение, 24 ч — «красная зона». */
        absCheck() {
          const c = Chat.st(), s = Store.s; c.flags = c.flags || {};
          const h = Att.absHours(s.attendance.marks, Cloud.my.certs, s.settings.subgroup), last = c.flags.abs || 0;
          if (h === last) return false;
          c.flags.abs = h;
          if (h < last) return true;                                       // пропусков стало меньше (справка, исправление админа) — просто запоминаем
          const z = Att.zone(h);
          if (z.cls === 'red') {
            Chat.push('bot', last >= ABS_LIMIT
              ? '🔴 Ещё один пропуск без уважительной причины: теперь ' + h + ' ч из ' + ABS_LIMIT + '. Ты в красной зоне — больше пропускать нельзя! Если пропуски были по болезни, прикрепи справку в личном кабинете.'
              : '🔴 Ты в красной зоне! У тебя набралось ' + h + ' ч пропусков без уважительной причины из ' + ABS_LIMIT + ' разрешённых. Больше пропускать нельзя!\nЕсли пропуски были по болезни, прикрепи справку или больничный в личном кабинете.', {mood: 'worried'});
          } else if (z.cls === 'warn') {
            Chat.push('bot', '🟠 Осторожно: у тебя осталось ' + z.left + ' ' + U.plural(z.left, 'час', 'часа', 'часов') + ' пропусков без уважительной причины (набрано ' + h + ' из ' + ABS_LIMIT + ').\nХоди на пары и готовься — лимит почти исчерпан.', {mood: 'worried'});
          }
          return true;
        },
        /* Раз в месяц (при первом открытии после 1-го числа): итоги прошлого месяца. У админа — ещё и итоги по группе. */
        monthly() {
          const c = Chat.st(), s = Store.s; c.flags = c.flags || {};
          const t = U.today(), pm = U.iso(new Date(t.getFullYear(), t.getMonth() - 1, 1)).slice(0, 7);
          if (pm < ATT_START.slice(0, 7) || (c.flags.report || '') >= pm) return false;
          if (Cloud.isAdmin && !Cloud.admReady) return false;
          const sub = s.settings.subgroup, st = Att.stats(s.attendance.marks, Cloud.my.certs, sub, pm + '-01', monthEnd(pm));
          const total = Att.absHours(s.attendance.marks, Cloud.my.certs, sub), z = Att.zone(total);
          let text = '📊 Итоги месяца: ' + monthName(pm) + '\n';
          text += st.total ? 'Посещаемость: ' + (st.pct == null ? '—' : st.pct + '%') + ' (п ' + st.p + ' · о ' + st.l + ' · н ' + st.a + ' · по справке ' + st.x + (st.u ? ' · не отмечено ' + st.u : '') + ')\nПропуски без уважительной причины: ' + (st.a * PAIR_HOURS) + ' ч за месяц, всего ' + total + ' из ' + ABS_LIMIT + ' ч.' : 'В этом месяце пар по расписанию не было.';
          text += z.cls === 'red' ? '\n🔴 Ты в красной зоне — больше пропускать нельзя!' : z.cls === 'warn' ? '\n🟠 Осталось ' + z.left + ' ч пропусков — ходи на пары и готовься.' : '\n🟢 С лимитом всё в порядке: осталось ' + z.left + ' ч.';
          Chat.push('bot', text, {mood: z.cls === 'ok' ? 'cheer' : 'worried'});
          if (Cloud.isAdmin) Chat.push('bot', Chat.groupSummary(pm), {mood: 'happy'});
          c.flags.report = pm;
          return true;
        },
        groupSummary(pm) {
          const P = Cloud.adm.profiles, rows = [], seen = {};
          Object.keys(P).forEach(id => {
            const p = P[id], r = ROSTER_BY_ID[p.rid]; if (!r || r.flag || r.admin) return;
            seen[r.id] = true;
            const marks = (Cloud.adm.att[id] || {}).marks || {}, certs = (Cloud.adm.certs[id] || {}).items || [], h = Att.absHours(marks, certs, p.subgroup);
            rows.push({name: r.name, st: Att.stats(marks, certs, p.subgroup, pm + '-01', monthEnd(pm)), h, z: Att.zone(h)});
          });
          const wp = rows.filter(x => x.st.pct != null), avg = wp.length ? Math.round(wp.reduce((a, x) => a + x.st.pct, 0) / wp.length) : null;
          const names = a => a.length ? a.map(x => x.name + ' (' + x.h + ' ч)').join(', ') : '—';
          const active = ROSTER.filter(r => !r.flag && !r.admin);
          return '📊 Итоги месяца по группе: ' + monthName(pm) + '\nВошли в приложение: ' + rows.length + ' из ' + active.length + '\nСредняя посещаемость: ' + (avg == null ? '—' : avg + '%') + '\n🔴 Красная зона (24 ч и больше): ' + names(rows.filter(x => x.z.cls === 'red')) + '\n🟠 Осталось 4 ч и меньше: ' + names(rows.filter(x => x.z.cls === 'warn')) + '\nНе заходили: ' + (active.filter(r => !seen[r.id]).map(r => r.name).join(', ') || '—');
        },
        answer(wk, yes) {
          const c = Chat.st(), w = allWorks().find(x => x.id + '@' + x.date === wk), now = new Date();
          c.msgs.forEach(m => {if (m.ask === wk) m.done = true;});
          Chat.push('me', yes ? 'Готов(а) ✅' : 'Не готов(а) 😬');
          c.answers[wk] = {a: yes ? 'y' : 'n', at: now.toISOString()};
          if (yes) {
            Chat.push('bot', 'Отлично! Желаю удачи на работе — у тебя всё получится! 🍀', {mood: 'cheer'});
          } else {
            const sid = w && w.subjectId, sb = subj(sid);
            if (sb) {
              const ns = Store.s.notes.filter(n => n.subjectId === sid).sort(noteSort), cards = Store.s.cards.filter(x => x.subjectId === sid).length, links = [];
              ns.slice(0, 3).forEach(n => links.push({l: '📒 ' + n.title, sid, tab: 'notes', nid: n.id}));
              if (ns.length > 3) links.push({l: '📒 Все конспекты (' + ns.length + ')', sid, tab: 'notes'});
              if (cards) links.push({l: '🃏 Учить карточки (' + cards + ')', sid, tab: 'cards', study: true});
              if (sb.hasFormulas && sb.formulas.length) links.push({l: '∑ Формулы', sid, tab: 'formulas'});
              Chat.push('bot', 'Ничего страшного — время ещё есть! На подготовку 24 часа: с 9:00 до 9:00 следующего дня. Вот материалы по предмету «' + sb.name + '»:', {mood: 'happy', links: links.length ? links : undefined});
            } else Chat.push('bot', 'Ничего страшного — время ещё есть! Повтори темы по этой работе, у тебя 24 часа: с 9:00 до 9:00 следующего дня.', {mood: 'happy'});
            Chat.push('bot', 'Готовься, а я загляну позже и спрошу, как дела 💪');
            const end = w ? Chat.window(w).end : new Date(now.getTime() + 864e5);
            c.follow[wk] = new Date(Math.min(now.getTime() + 3 * 36e5, end.getTime() - 36e5)).toISOString();
          }
          Chat.save(); App.render();
        },
        reply(text) {
          Chat.push('me', text); Store.s.meta.msgSent = (Store.s.meta.msgSent || 0) + 1;
          const t = U.norm(text), ws = allWorks().filter(w => !w.done).sort(byDue).slice(0, 4), today = U.today(), idx = U.dayIdx(today);
          let ans, mood = 'happy';
          if (/привет|здравств|хай|добр/.test(t)) ans = 'Привет! Рад тебя видеть 🌱 Спроси «что сегодня?» или «какие работы?».';
          else if (/работ|контрольн|зач[её]т|дедлайн|когда/.test(t)) ans = ws.length ? 'Ближайшее:\n' + ws.map(w => '• ' + U.fmtShort(U.fromISO(w.date)) + ' — ' + w.title).join('\n') : 'Ближайших работ нет — можно выдохнуть 😌';
          else if (/пар|расписан|сегодня|завтра/.test(t)) {
            const d = /завтра/.test(t) ? U.addDays(today, 1) : today, ps = Att.pairs(U.iso(d), Store.s.settings.subgroup);
            ans = ps.length ? (/завтра/.test(t) ? 'Завтра' : 'Сегодня') + ':\n' + ps.map(p => '• ' + p.pair + '-я пара — ' + p.lessons.map(l => {const sb = subj(l.subjectId); return (sb ? sb.short || sb.name : '?') + (l.room ? ' (ауд. ' + l.room + ')' : '');}).join(' / ')).join('\n') : (/завтра/.test(t) ? 'Завтра' : 'Сегодня') + ' пар нет ☕';
          }
          else if (/спасиб/.test(t)) {ans = 'Всегда пожалуйста! 💚'; mood = 'cheer';}
          else if (/помощ|умеешь|что ты/.test(t)) ans = 'Я пишу за сутки до работы, спрашиваю, готов(а) ли ты, и присылаю конспекты и карточки. Ещё отвечаю на «работы», «что сегодня?» и «что завтра?».';
          else ans = 'Пока я умею отвечать на «работы», «что сегодня?», «что завтра?» и «помощь» 🙂';
          Chat.push('bot', ans, {mood}); Chat.save(); App.render();
        }
      };

      /* ==========================================================================
         4f. ПРАВА: студент только читает, правит админ. Offline-режим (без облака) — личная песочница, там можно всё.
         ========================================================================== */
      const canEdit = () => Cloud.status !== 'online' || Cloud.isAdmin;
      const RO_ACTIONS = new Set(['add-work', 'hw-add', 'edit-item', 'del-item', 'subj-add', 'subj-edit', 'subj-del', 'note-add', 'card-add', 'card-edit', 'card-del', 'formula-add', 'formula-edit', 'formula-del',
        'link-del', 't-add', 't-edit', 't-del', 'reset', 'clear', 'restore-content', 'times', 'cell-add', 'cell-edit', 'pair-add', 'pair-del', 'chg-cancel', 'chg-replace', 'chg-del']);
      const RO_FORMS = new Set(['hwg', 'work', 'hw', 'hw-new', 'card', 'formula', 'subject', 'teacher', 'link-new', 'times', 'lesson', 'change']);
      function roBlocked(el) {
        if (canEdit()) return false;
        const a = el.dataset.action;
        if (a === 'note-edit' || a === 'note-del') {const n = Store.s.notes.find(x => x.id === el.dataset.id); return !!(n && n.subjectId);}   // свои личные заметки можно
        return RO_ACTIONS.has(a);
      }

      /* ==========================================================================
         4g. ОТМЕНА И ЗАМЕНА ПАР (на конкретный день; шаблон расписания не меняется)
         ========================================================================== */
      const Changes = {
        items: () => Cloud.status === 'online' ? Cloud.changes : (Store.s.changes || []),
        save(arr) {if (Cloud.status === 'online') {Cloud.changes = arr; Cloud.saveChanges();} else {Store.s.changes = arr; Store.save();} },
        at: (date, pair) => Changes.items().find(c => c.date === date && c.pair === pair) || null,
        upsert(ch) {
          const rest = Changes.items().filter(c => !(c.date === ch.date && c.pair === ch.pair));
          Changes.save(rest.concat([Object.assign({id: U.uid('x'), createdBy: Cloud.uid || 'local', createdAt: new Date().toISOString()}, ch)]));
        },
        remove(id) {Changes.save(Changes.items().filter(c => c.id !== id));},
        describe(c) {
          const sb = subj(c.subjectId), nb = subj(c.newSubjectId), dt = U.fmtShort(U.fromISO(c.date));
          if (c.type === 'cancel') return {title: 'Пара отменена', body: (sb ? sb.short || sb.name : 'Пара') + ' ' + c.pair + '-я пара ' + dt + ' отменена' + (c.reason ? ' (' + c.reason + ')' : '')};
          return {title: 'Замена пары', body: 'Замена: ' + c.pair + '-я пара ' + dt + ' — ' + (nb ? nb.name : (sb ? sb.name : 'другой предмет')) + (c.newRoom ? ', ауд. ' + c.newRoom : '') + (c.reason ? ' (' + c.reason + ')' : '')};
        },
        nextDate(l) {                                            // ближайшая дата, когда эта пара реально идёт
          for (let i = 0; i < 28; i++) {const d = U.addDays(U.today(), i); if (U.dayIdx(d) === l.day && (l.week === 'both' || weekType(d) === l.week)) return U.iso(d);}
          return U.iso(U.today());
        },
        check(l, date) {
          if (!l) return 'Пара не найдена'; if (!date) return 'Выберите дату';
          const d = U.fromISO(date);
          if (U.dayIdx(d) !== l.day) return 'Эта пара идёт в «' + DAYS_FULL[l.day] + '», а выбранная дата — «' + DAYS_FULL[U.dayIdx(d)] + '»';
          if (l.week !== 'both' && weekType(d) !== l.week) return 'В эту дату идёт другая неделя (нужен ' + WEEK_NAME[l.week] + ')';
          return '';
        }
      };

      /* ==========================================================================
         4h. УВЕДОМЛЕНИЯ и НАПОМИНАНИЯ. Пока страница открыта (или установлена как приложение) —
         показываем системное уведомление, если вкладка свёрнута, иначе всплывашку внутри приложения.
         Настоящий push при закрытом приложении требует серверной части (см. инструкцию по Supabase).
         ========================================================================== */
      const NOTIF_DEFAULT = {pairs: true, works: true, changes: true, chat: true, ach: true, digest: true, quiet: true, lead: 15, mute: {}};
      const NOTIF_TYPES = [['pairs', '🔔 Пары — за несколько минут до начала'], ['works', '📝 Работы и ДЗ — за 24 ч и за 2 ч'], ['changes', '❌ Отмены и замены пар — сразу'], ['chat', '💬 Сообщения от Политешика'], ['ach', '🏆 Достижения'], ['digest', '📅 Дайджест недели (воскресенье, 19:00)']];
      const Notifier = {
        cfg() {return Object.assign({}, NOTIF_DEFAULT, Store.s.settings.notif || {});},
        supported: () => typeof Notification !== 'undefined',
        perm: () => typeof Notification !== 'undefined' ? Notification.permission : 'unsupported',
        async ask() {
          Store.s.settings.notifAsked = true; Store.save();
          if (!Notifier.supported()) return 'unsupported';
          try {return await Notification.requestPermission();} catch (e) {return 'denied';}
        },
        quiet: d => {const h = (d || new Date()).getHours(); return h >= 23 || h < 7;},
        /* type — тип уведомления (его можно отключить), opts.urgent — игнорирует тихие часы (отмена пары в тот же день) */
        show(type, title, body, opts) {
          opts = opts || {}; const c = Notifier.cfg();
          if (c[type] === false) return false;
          if (c.quiet && Notifier.quiet() && !opts.urgent) return false;
          let shown = false;
          if (Notifier.perm() === 'granted' && document.hidden) {
            try {
              if (navigator.serviceWorker && navigator.serviceWorker.controller && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, tag: opts.tag || type, icon: 'icon-192.png'}));
              else new Notification(title, {body, tag: opts.tag || type});
              shown = true;
            } catch (e) { }
          }
          if (!shown) UI.toast('🔔 ' + title + (body ? ': ' + body : ''));
          Notifier.last = {type, title, body}; (Notifier.log = Notifier.log || []).push(Notifier.last);
          return true;
        }
      };
      const Reminders = {
        lastTouch: 0,
        sent() {const m = Store.s.meta; m.sent = m.sent || {}; return m.sent;},
        tick() {
          if (App.gateMode()) return;
          const s = Store.s, c = Notifier.cfg(), now = new Date(), sent = Reminders.sent(); let dirty = false;
          const today = U.iso(now);
          /* 1. пары: за N минут и повтор за 5 минут, если приложение так и не открывали */
          if (c.pairs) {
            Att.pairs(today, s.settings.subgroup).forEach(pr => {
              const p = s.settings.pairs[pr.pair - 1]; if (!p || !p.start) return;
              const lesson = pr.lessons[0]; if (c.mute[lesson.subjectId]) return;

        return '<div class="widget" aria-label="Виджет">' +
          '<div class="wg"><small>Ближайшая пара</small>' + (nl ? '<b>' + U.esc(sb ? sb.short || sb.name : 'Пара') + (nl.l.room ? ' · ауд. ' + U.esc(nl.l.room) : '') + '</b><span>через ' + untilText(nl.at - now) + (nl.pr.state === 'replace' ? ' · ЗАМЕНА' : '') + '</span>' : '<b>—</b><span>задайте время пар</span>') + '</div>' +
          '<div class="wg"><small>Ближайшая работа</small>' + (dl ? '<b>' + U.esc(dl.title) + '</b><span>' + (dueDate(dl.date, dl.time) < now ? 'просрочено' : 'через ' + untilText(dueDate(dl.date, dl.time) - now)) + '</span>' : '<b>—</b><span>сроков нет</span>') + '</div>' +
          '<div class="wg"><small>Посещаемость за месяц</small><b>' + (st.pct == null ? '—' : st.pct + '%') + '</b><span>п ' + st.p + ' · о ' + st.l + ' · н ' + st.a + '</span></div></div>';
      }
      function notifBanner() {
        const s = Store.s;
        if (!Notifier.supported() || Notifier.perm() !== 'default' || s.settings.notifAsked) return '';
        return '<div class="card notif-banner"><div><b>🔔 Включить уведомления?</b><p>Напомню о парах за несколько минут, о работах за сутки и сообщу, если пару отменят или заменят.</p></div><div class="head-actions"><button class="btn primary sm" data-action="notif-ask">Включить</button><button class="btn sm" data-action="notif-later">Позже</button></div></div>';
      }
      function viewDashboard() {
        const s = Store.s, now = new Date(), cur = weekType(now);
        const all = workItems();
        const pend = all.filter(i => !i.done).sort(byDue);
        const done = all.filter(i => i.done).sort((a, b) => byDue(b, a)).slice(0, 30);
        const types = [...new Set(pend.map(i => i.type))];
        if (ui.dashFilter !== 'all' && !types.includes(ui.dashFilter)) ui.dashFilter = 'all';
        const list = ui.dashFilter === 'all' ? pend : pend.filter(i => i.type === ui.dashFilter);
        const urgent = pend.filter(i => urgency(i.date, i.time) === 'red').length;
        const soon = pend.filter(i => {const n = U.dayDiff(U.today(), U.fromISO(i.date)); return n >= 0 && n <= 7;}).length;
        const hwOpen = s.homework.filter(h => !h.done).length;
        const dv = Att.dayView(U.iso(now), s.settings.subgroup);

        return '<div class="page-head"><div><h1>Главная</h1><p>' + U.esc(U.fmtLong(now)) + ' · идёт ' + WEEK_NAME[cur] + '</p></div>' +
          '<div class="head-actions"><button class="btn primary" data-action="add-work">＋ Добавить работу</button></div></div>' +
          heroHtml() + notifBanner() + widgetHtml() +
          '<div class="grid-stats">' +
          '<div class="stat red"><b>' + urgent + '</b><small>срочно (&lt; 24 ч)</small></div>' +
          '<div class="stat"><b>' + soon + '</b><small>на ближайшие 7 дней</small></div>' +
          '<div class="stat link" data-action="nav" data-tab="hw" title="Открыть домашку"><b>' + hwOpen + '</b><small>ДЗ не сделано →</small></div></div>' +
          '<div class="dash-cols"><section class="card"><h2>Ближайшие работы <small class="sub-h">контрольные, зачёты и работы на паре</small></h2>' +
          (types.length > 1 ? '<div class="chips"><button class="fchip' + (ui.dashFilter === 'all' ? ' on' : '') + '" data-action="dash-filter" data-f="all">Все</button>' +
            types.map(t => '<button class="fchip' + (ui.dashFilter === t ? ' on' : '') + '" data-action="dash-filter" data-f="' + U.esc(t) + '">' + U.esc(t) + '</button>').join('') + '</div>' : '') +
          (list.length ? '<div class="items">' + list.map(itemRow).join('') + '</div>' : empty('🎉', 'Ближайших контрольных и зачётов нет.')) +
          (done.length ? '<details class="done-box"><summary>Выполнено (' + done.length + ')</summary><div class="items">' + done.map(itemRow).join('') + '</div></details>' : '') +
          '</section><section class="card"><h2>Сегодня по расписанию <button class="btn sm" data-action="nav" data-tab="attendance">✅ Отметиться</button></h2>' +
          (dv.length ? '<div class="items">' + dv.map(dayRow).join('') + '</div>' : empty('☕', 'Сегодня пар нет')) +
          '</section></div>';
      }

      /* ---------- 6.2 Расписание ---------- */
      function lessonChip(l, wide, state, date) {
        const sb = subj(l.subjectId), c = sb ? sb.color : '#94a3b8';
        const sub = [l.room ? 'ауд. ' + l.room : '', l.subgroup, wide ? l.who : surname(l.who)].filter(Boolean).join(' · ');
        const t = (l.start && l.end) ? '<small>⏰ ' + l.start + '–' + l.end + '</small>' : '';
        return '<button class="lesson' + (state === 'cancel' ? ' cancelled' : state === 'replaced' ? ' was' : '') + '" style="--c:' + c + '" data-action="cell-edit" data-id="' + l.id + '"' + (date ? ' data-date="' + date + '"' : '') + ' title="' + U.esc((sb ? sb.name : '') + (l.who ? ' — ' + l.who : '')) + '">' +
          '<b>' + U.esc(sb ? (wide ? sb.name : sb.short || sb.name) : 'Без предмета') + '</b>' + (sub ? '<small>' + U.esc(sub) + '</small>' : '') + t +
          (state === 'cancel' ? '<span class="wk cancel-b">ОТМЕНЕНА</span>' : (l.week !== 'both' ? '<span class="wk">' + (l.week === 'num' ? 'числ.' : 'знам.') + '</span>' : '')) + '</button>';
      }
      /* Содержимое ячейки сетки для конкретной даты: пара из шаблона + отмена/замена */
      function cellChips(d, n, date, wide) {
        const ls = Store.s.schedule.filter(l => l.day === d && l.pair === n && (l.week === 'both' || l.week === ui.schedWeek)), ch = Changes.at(date, n);
        let h = ls.map(l => lessonChip(l, wide, ch ? (ch.type === 'cancel' ? 'cancel' : 'replaced') : '', date)).join('');
        if (ch && ch.type === 'replace') {
          const sb = subj(ch.newSubjectId);
          h += '<div class="lesson repl" style="--c:' + (sb ? sb.color : '#f59e0b') + '"><b>' + U.esc(sb ? (wide ? sb.name : sb.short || sb.name) : 'Замена') + '</b><small>' + U.esc([ch.newRoom ? 'ауд. ' + ch.newRoom : '', ch.newTeacher].filter(Boolean).join(' · ')) + '</small>' +
            (ch.reason ? '<small>' + U.esc(ch.reason) + '</small>' : '') + '<span class="wk repl-b">ЗАМЕНА</span></div>';
        }
        return h;
      }
      function changesCard() {
        const today = U.iso(U.today()), list = Changes.items().filter(c => c.date >= today).sort((a, b) => (a.date + a.pair).localeCompare(b.date + b.pair));
        if (!list.length) return '';
        return '<section class="card chg-card"><h2>Изменения в расписании</h2><div class="items">' + list.map(c => {
          const d = Changes.describe(c);
          return '<div class="item ' + (c.type === 'cancel' ? 'u-red' : 'u-yellow') + '"><div class="item-main"><div class="item-title">' + (c.type === 'cancel' ? '❌ ' : '🔁 ') + U.esc(d.body) + '</div></div>' +
            (canEdit() ? '<div class="item-actions"><button class="icon-btn" data-action="chg-del" data-id="' + c.id + '" aria-label="Убрать изменение">🗑️</button></div>' : '') + '</div>';
        }).join('') + '</div></section>';
      }
      function viewSchedule() {
        const s = Store.s, cur = weekType(new Date()), pairs = s.settings.pairs, todayIdx = U.dayIdx(new Date());
        if (!ui.schedWeek) ui.schedWeek = cur;
        if (ui.schedDay == null) ui.schedDay = todayIdx;
        const w = ui.schedWeek, isCur = w === cur;
        const monday = (() => {const b = U.mondayOf(U.today()); return weekType(b) === w ? b : U.addDays(b, 7);})();           // ближайшая неделя выбранного типа
        const wdates = DAYS.map((_, i) => U.iso(U.addDays(monday, i))), dm = iso => iso.slice(8) + '.' + iso.slice(5, 7);

        let grid = '<div class="sched-grid"><div></div>' + DAYS.map((d, i) => '<div class="g-day' + (isCur && i === todayIdx ? ' today' : '') + '">' + d + '<small>' + dm(wdates[i]) + '</small></div>').join('');
        pairs.forEach((p, pi) => {
          const n = pi + 1;
          grid += '<button class="g-pair" data-action="times" title="Изменить время пар"><b>' + n + '</b><small>' + (pairTime(n) ? pairTime(n).replace('–', '<br>') : 'время?') + '</small></button>';
          for (let d = 0; d < 7; d++) {grid += '<div class="g-cell' + (isCur && d === todayIdx ? ' today' : '') + '" data-action="cell-add" data-day="' + d + '" data-pair="' + n + '">' + cellChips(d, n, wdates[d], false) + '</div>';}
        });
        grid += '</div>';

        const dayTabs = '<div class="day-tabs">' + DAYS.map((d, i) => '<button class="day-tab' + (i === ui.schedDay ? ' on' : '') + (isCur && i === todayIdx ? ' is-today' : '') + '" data-action="sched-day" data-day="' + i + '">' + d + '</button>').join('') + '</div>';
        const list = '<div class="sched-list">' + dayTabs + '<h3 style="margin-bottom:12px">' + DAYS_FULL[ui.schedDay] + ' · ' + dm(wdates[ui.schedDay]) + '</h3>' + pairs.map((p, pi) => {
          const n = pi + 1, ls = Store.s.schedule.filter(l => l.day === ui.schedDay && l.pair === n && (l.week === 'both' || l.week === w)), chh = cellChips(ui.schedDay, n, wdates[ui.schedDay], true);
          return '<div class="l-row"><div class="l-num"><b>' + n + '</b><small>' + (pairTime(n) || '') + '</small></div><div class="l-body">' +
            chh +
            (ls.length || chh ? '<button class="btn ghost sm" data-action="cell-add" data-day="' + ui.schedDay + '" data-pair="' + n + '">＋ ещё</button>' :
              '<button class="l-empty" data-action="cell-add" data-day="' + ui.schedDay + '" data-pair="' + n + '">＋ добавить пару</button>') + '</div></div>';
        }).join('') + '</div>';

        const noTimes = !pairs.some(p => p.start && p.end);
        return '<div class="page-head"><div><h1>Расписание</h1><p>Сейчас идёт ' + WEEK_NAME[cur] + '. Нажмите на ячейку, чтобы добавить или изменить пару.</p></div>' +
          '<div class="head-actions"><div class="seg" role="group" aria-label="Тип недели">' +
          '<button class="' + (w === 'num' ? 'on' : '') + '" data-action="sched-week" data-week="num">Числитель</button>' +
          '<button class="' + (w === 'den' ? 'on' : '') + '" data-action="sched-week" data-week="den">Знаменатель</button></div>' +
          '<button class="btn" data-action="times">⏱ Время пар</button></div></div>' +
          changesCard() + grid + list +
          (noTimes ? '<p class="hint">⏱ Время звонков пока не задано — нажмите «Время пар» или на номер пары.</p>' : '') +
          '<p class="hint">Для пар «через неделю» выберите в форме числитель или знаменатель.</p>';
      }

      /* ---------- 6.3 Предметы ---------- */
      /* «Предмет без конспектов»: карточки ведут к конспектам другого предмета (Васильев → ОАП Даниловой) */
      const noNotes = sb => sb.noNotes !== undefined ? !!sb.noNotes : (sb.id === 's_mdk0101' || sb.id === 's_mdk0102');
      const linkTarget = sb => noNotes(sb) ? (sb.linkNotesTo || 's_oap') : '';
      function linkLabel(sb) {
        const t = subj(linkTarget(sb)); if (!t) return 'Открыть конспект';
        const tt = teachersOf(t.id)[0]; return 'Открыть конспект: ' + (t.short || t.name) + (tt ? ' · ' + surname(tt.name) : '');
      }
      function subjectCards() {
        const s = Store.s, q = U.norm(ui.subjQuery);
        const list = s.subjects.filter(x => !q || U.norm(x.name + ' ' + x.short).includes(q));
        if (!list.length) return empty('📚', 'Ничего не найдено');
        return '<div class="cards">' + list.map(x => {
          const hw = s.homework.filter(h => h.subjectId === x.id && !h.done).length, nn = s.notes.filter(n => n.subjectId === x.id).length, cc = s.cards.filter(c => c.subjectId === x.id).length;
          const tt = teachersOf(x.id).map(t => surname(t.name)).join(', ');
          return '<button class="scard" style="--c:' + x.color + '" data-action="subj-open" data-id="' + x.id + '"><h3>' + U.esc(x.short || x.name) + '</h3>' +
            '<div class="sub">' + U.esc(x.name) + (tt ? '<br>👤 ' + U.esc(tt) : '') + '</div><div class="meta"><span class="tag">📝 ДЗ: ' + hw + '</span>' + (noNotes(x) ? '' : '<span class="tag">📒 Конспекты: ' + nn + '</span>') + (cc ? '<span class="tag">🃏 ' + cc + '</span>' : '') + (x.hasFormulas ? '<span class="tag">∑ формулы</span>' : '') + '</div></button>';
        }).join('') + '</div>';
      }
      function hwList(sb) {
        const hs = Store.s.homework.filter(h => h.subjectId === sb.id).sort((a, b) => (a.done - b.done) || ((a.deadline || '9999') > (b.deadline || '9999') ? 1 : -1));
        if (!hs.length) return empty('✅', 'Домашки пока нет');
        return '<div class="items">' + hs.map(h => {
          const u = h.done || !h.deadline ? 'none' : urgency(h.deadline, '');
          return '<div class="item u-' + u + (h.done ? ' is-done' : '') + '"><button class="check' + (h.done ? ' on' : '') + '" data-action="toggle-item" data-kind="hw" data-id="' + h.id + '" aria-label="Статус">✓</button>' +
            '<div class="item-main"><div class="item-title">' + U.esc(h.text) + '</div></div>' +
            '<div class="item-when">' + (h.deadline ? '<b>' + (h.done ? 'Сделано' : relLabel(h.deadline)) + '</b><small>' + U.fmtShort(U.fromISO(h.deadline)) + '</small>' : '<small>' + (h.done ? 'Сделано' : 'без срока') + '</small>') + '</div>' +
            '<div class="item-actions"><button class="icon-btn" data-action="edit-item" data-kind="hw" data-id="' + h.id + '" aria-label="Изменить">✏️</button><button class="icon-btn" data-action="del-item" data-kind="hw" data-id="' + h.id + '" aria-label="Удалить">🗑️</button></div></div>';
        }).join('') + '</div>';
      }
      /* Свои заметки — сверху (новые первыми), стартовые конспекты — по порядку тем */
      const noteSort = (a, b) => {const ao = a.order != null, bo = b.order != null; if (ao && bo) return a.order - b.order; if (ao !== bo) return ao ? 1 : -1; return String(b.updated).localeCompare(String(a.updated));};
      function noteList(sb) {
        const q = U.norm(ui.noteQuery);
        const ns = Store.s.notes.filter(n => n.subjectId === sb.id && (!q || U.norm(n.title + ' ' + n.text).includes(q))).sort(noteSort);
        if (!ns.length) return empty('📒', q ? 'Ничего не найдено' : 'Конспектов пока нет');
        return '<div class="cards">' + ns.map(n => '<button class="note-card" data-action="note-open" data-id="' + n.id + '"><b>' + U.esc(n.title || 'Без заголовка') + '</b><p>' +
          U.esc(n.text.replace(/[#*`>|_=~-]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150)) + '</p><small>' + new Date(n.updated).toLocaleDateString('ru-RU') + '</small></button>').join('') + '</div>';
      }
      function linkList(sb) {
        if (!sb.links.length) return empty('🔗', 'Материалов пока нет');
        return '<div class="items">' + sb.links.map((l, i) => '<div class="link-row">🔗<a href="' + U.esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + U.esc(l.title || l.url) + '<small>' + U.esc(l.url) + '</small></a>' +
          '<button class="icon-btn" data-action="link-del" data-i="' + i + '" aria-label="Удалить ссылку">🗑️</button></div>').join('') + '</div>';
      }
      /* ----- Карточки: список и режим заучивания ----- */
      const deckCards = sb => Store.s.cards.filter(c => c.subjectId === sb.id);
      const catOf = c => c.cat || 'Без категории';
      function cardCats(cs) {const m = new Map(); cs.forEach(c => m.set(catOf(c), (m.get(catOf(c)) || 0) + 1)); return m;}
      function filteredCards(sb) {
        const q = U.norm(ui.cardQuery);
        return deckCards(sb).filter(c => (ui.cardCat === 'all' || catOf(c) === ui.cardCat) && (!ui.cardUnknown || !c.known) && (!q || U.norm(c.q + ' ' + c.a).includes(q)));
      }
      function cardList(sb) {
        const cs = filteredCards(sb);
        if (!cs.length) return empty('🃏', ui.cardUnknown ? 'Невыученных карточек нет — отлично!' : 'Карточек не найдено');
        return '<div class="crows">' + cs.map(c => '<button class="crow' + (c.known ? ' ok' : '') + '" data-action="card-open" data-id="' + c.id + '"><span class="dot"></span><span class="crow-q">' + Md.inline(c.q) + '</span>' +
          (c.cat ? '<span class="tag">' + U.esc(c.cat) + '</span>' : '') + '</button>').join('') + '</div>';
      }
      function cardsBody(sb) {
        if (ui.study && ui.study.sid === sb.id) return studyView(sb);
        const all = deckCards(sb), known = all.filter(c => c.known).length, pct = all.length ? Math.round(known * 100 / all.length) : 0, cats = cardCats(all);
        return '<div class="deck-head"><div class="deck-stat"><b>' + known + ' / ' + all.length + '</b><small>выучено · ' + pct + '%</small><div class="progress"><i style="width:' + pct + '%"></i></div></div>' +
          '<div class="head-actions"><button class="btn primary" data-action="study-start">▶ Учить</button><button class="btn" data-action="study-exam" title="20 случайных карточек без подсказок: сдать без ошибок">🧠 Экзамен</button><button class="btn" data-action="card-add">＋ Карточка</button></div></div>' +
          (cats.size > 1 ? '<div class="chips"><button class="fchip' + (ui.cardCat === 'all' ? ' on' : '') + '" data-action="card-cat" data-cat="all">Все · ' + all.length + '</button>' +
            [...cats].map(e => '<button class="fchip' + (ui.cardCat === e[0] ? ' on' : '') + '" data-action="card-cat" data-cat="' + U.esc(e[0]) + '">' + U.esc(e[0]) + ' · ' + e[1] + '</button>').join('') + '</div>' : '') +
          '<div class="searchbar"><input class="input" id="cardQ" placeholder="🔍 Поиск по карточкам…" value="' + U.esc(ui.cardQuery) + '" data-input="card-search">' +
          '<div class="seg"><button class="' + (!ui.cardUnknown ? 'on' : '') + '" data-action="card-unknown" data-v="0">Все</button><button class="' + (ui.cardUnknown ? 'on' : '') + '" data-action="card-unknown" data-v="1">Невыученные</button></div>' +
          '<label class="chk"><input type="checkbox" data-change="card-shuffle"' + (ui.cardShuffle ? ' checked' : '') + '> перемешать</label></div>' +
          '<div id="card-list">' + cardList(sb) + '</div>';
      }
      function studyView(sb) {
        const st = ui.study, total = st.ids.length;
        if (st.i >= total) {
          return '<div class="study done"><div class="big">🎉</div><h2>' + (st.exam ? (st.no === 0 ? 'Экзамен сдан без ошибок! 🧠' : 'Экзамен: ошибок — ' + st.no) : 'Круг пройден') + '</h2><p style="color:var(--muted)">Знаю: <b>' + st.yes + '</b> · Повторить: <b>' + st.no + '</b></p>' +
            '<div class="head-actions" style="justify-content:center">' + (st.missed.length ? '<button class="btn primary" data-action="study-missed">↻ Повторить ошибки (' + st.missed.length + ')</button>' : '') +
            '<button class="btn" data-action="study-start">Ещё раз</button><button class="btn ghost" data-action="study-exit">Закончить</button></div></div>';
        }
        const c = Store.s.cards.find(x => x.id === st.ids[st.i]);
        if (!c) {st.i++; return studyView(sb);}                       // карточку удалили во время сессии
        const pct = Math.round(st.i * 100 / total);
        return '<div class="study"><div class="study-top"><button class="btn ghost sm" data-action="study-exit">← Выйти</button>' + (st.exam ? '<span class="tag">🧠 Экзамен</span>' : '') + (c.cat ? '<span class="tag">' + U.esc(c.cat) + '</span>' : '') + '<span class="study-n">' + (st.i + 1) + ' / ' + total + '</span></div>' +
          '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
          '<div class="flip" data-action="study-flip" tabindex="0" role="button" aria-label="Перевернуть карточку">' +
          (st.flip ? '<div class="face back rise"><small>Ответ</small><div class="md">' + Md.render(c.a) + '</div>' + (subj(c.subjectId) && (c.link || linkTarget(subj(c.subjectId))) ? '<div class="study-link"><button class="btn sm" data-action="card-linked" data-id="' + c.id + '">📎 ' + U.esc(c.link ? 'Открыть файл' : linkLabel(subj(c.subjectId))) + '</button></div>' : '') + '</div>'
            : '<div class="face front rise"><small>Вопрос</small><div class="qtxt">' + Md.inline(c.q) + '</div><span class="tap">нажмите, чтобы увидеть ответ</span></div>') +
          '</div><div class="study-actions">' + (st.flip ? '<button class="btn danger" data-action="study-no">↻ Повторить</button><button class="btn primary" data-action="study-yes">✓ Знаю</button>'
            : '<button class="btn primary" data-action="study-flip">Показать ответ</button>') + '</div>' +
          '<p class="hint" style="text-align:center">Пробел — перевернуть · → знаю · ← повторить</p></div>';
      }
      function studyAnswer(known) {
        const st = ui.study; if (!st || st.i >= st.ids.length) return;
        const id = st.ids[st.i], c = Store.s.cards.find(x => x.id === id);
        if (c && !st.exam) c.known = known;
        if (known) st.yes++; else {st.no++; st.missed.push(id);}
        st.i++; st.flip = false; Store.commit();
        if (st.i >= st.ids.length) {
          if (st.exam && st.no === 0 && st.ids.length >= 10) {Store.s.meta.examPerfect = true; Store.save(); Mascot.celebrate('Экзамен без ошибок! 🧠');}
          else if (!st.exam && st.yes >= 10) Mascot.celebrate('Выучено карточек: ' + st.yes + ' 🃏');
        }
        Profile.push(); Ach.check();
      }

      /* ----- Формулы ----- */
      function formulaList(sb) {

        const groups = new Map(); fs.forEach(f => {const g = f.group || 'Другое'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(f);});
        return [...groups].map(e => '<h3 class="fgroup">' + U.esc(e[0]) + ' <span class="tag">' + e[1].length + '</span></h3><div class="fgrid">' +

        } else if (ui.subjTab === 'notes') {

          '<div class="tabs">' + tabs.map(t => '<button class="tab' + (ui.subjTab === t[0] ? ' on' : '') + '" data-action="subj-tab" data-tab="' + t[0] + '">' + t[1] + ' <span class="tag">' + t[2] + '</span></button>').join('') + '</div>' + body;

      /* ---------- 6.4 Преподаватели ---------- */
      function teacherCards() {
        const s = Store.s, q = U.norm(ui.teacherQuery), sf = ui.teacherSubject;
        const list = s.teachers.filter(t => (sf === 'all' || t.subjectIds.includes(sf)) && (!q || U.norm([t.name, t.email, t.phone, t.room, t.notes, t.subjectIds.map(i => (subj(i) || {}).name).join(' ')].join(' ')).includes(q)))
          .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
        if (!list.length) return empty('👩‍🏫', 'Преподавателей не найдено');
        return '<div class="cards">' + list.map(t => {
          const first = subj(t.subjectIds[0]), c = first ? first.color : '#6366f1';
          return '<article class="tcard"><div class="t-top"><div class="avatar" style="--c:' + c + '">' + U.esc(U.initials(t.name)) + '</div><div><h3>' + U.esc(t.name) + '</h3></div></div>' +

        return '<div class="card set-sec"><h2>Уведомления</h2><div class="set-row"><div><b>' + permTxt + '</b><p>Системные уведомления работают, пока приложение открыто или установлено; в закрытом браузере они придут после подключения серверной части.</p></div>' +

          '<div class="set-row"><div><b>За сколько минут напоминать о паре</b></div><div class="seg">' + [5, 10, 15, 30].map(m => '<button class="' + (c.lead === m ? 'on' : '') + '" data-action="notif-lead" data-m="' + m + '">' + m + '</button>').join('') + '</div></div>' +
          '<div class="set-row" style="align-items:flex-start"><div><b>Предметы без напоминаний</b><p>Отметьте предметы, о парах которых напоминать не нужно</p></div><div class="checks">' +
          s.subjects.map(x => '<label><input type="checkbox" data-change="notif-mute" data-id="' + x.id + '"' + (c.mute[x.id] ? ' checked' : '') + '><span>' + U.esc(x.short || x.name) + '</span></label>').join('') + '</div></div></div>';
      }
      function viewSettings() {
        const s = Store.s, cur = weekType(new Date());
        return '<div class="page-head"><div><h1>Настройки</h1><p>Тема, чётность недели и резервная копия данных</p></div></div>' +
          (Store.persistent ? '' : '<div class="warn">⚠️ Браузер не разрешает сохранять данные на этом устройстве — изменения пропадут после закрытия. Делайте экспорт в JSON.</div>') +
          '<div class="card set-sec"><h2>Внешний вид</h2><div class="set-row" style="align-items:flex-start"><div><b>Тема оформления</b><p>7 тем; выбор сохраняется в профиле</p></div><div class="theme-grid">' +
          THEMES.map(t => '<button class="' + (s.settings.theme === t.id ? 'on' : '') + '" data-action="set-theme" data-theme="' + t.id + '"><span class="sw" style="background:' + t.sw + '"></span>' + t.ico + ' ' + t.name + '</button>').join('') + '</div></div></div>' +
          notifSettings() +
          '<div class="card set-sec"><h2>Расписание</h2>' +
          '<div class="set-row"><div><b>Сейчас идёт: ' + WEEK_NAME[cur] + '</b><p>Если чередование перепутано — поменяйте местами числитель и знаменатель</p></div><button class="btn" data-action="swap-week">🔁 Поменять местами</button></div>' +
          '<div class="set-row"><div><b>Время пар</b><p>Звонки: ' + (s.settings.pairs.some(p => p.start) ? 'заданы' : 'не заданы') + ' · пар в сетке: ' + s.settings.pairs.length + '</p></div><button class="btn" data-action="times">⏱ Настроить</button></div></div>' +
          '<div class="card set-sec"><h2>Аккаунт и облако</h2><div class="set-row"><div><b>' + (Cloud.status === 'online' ? '☁️ Подключено' + (Cloud.isAdmin ? ' · админ группы' : '') : Cloud.status === 'pending' ? 'Подключение…' : 'Без облака') + '</b><p>' + (Cloud.status === 'online' ? 'Вы вошли в Политешик. Отметки, справки и чат синхронизируются с админом группы.' : 'Откройте приложение по приглашению админа и войдите в Claude — тогда заработают общая посещаемость, справки и общие работы.') + '</p></div>' + (Cloud.status === 'online' ? '<div class="head-actions"><button class="btn" data-action="profile-edit">✏️ Профиль</button><button class="btn danger" data-action="logout">Выйти из аккаунта</button></div>' : '') + '</div>' + (Cloud.err ? '<div class="warn">Облако ответило ошибкой: ' + U.esc(Cloud.err) + '</div>' : '') + '</div>' +
          '<div class="card set-sec"><h2>Как приложение</h2>' +
          '<div class="set-row"><div><b>Установка</b><p>Компьютер: Safari — «Файл → Добавить в Dock», Chrome или Edge — меню → «Установить…». iPhone и iPad: «Поделиться» → «На экран Домой». Если такого пункта нет — добавьте страницу в закладки.</p></div>' + (installEvt ? '<button class="btn primary" data-action="install">📲 Установить</button>' : '') + '</div>' +
          '<div class="set-row"><div><b>Обновления</b><p>Новые версии выходят по той же ссылке — достаточно обновить страницу. Ваши данные лежат в браузере и при обновлении сохраняются.</p></div></div></div>' +
          '<div class="card set-sec"><h2>Данные</h2>' +
          '<div class="set-row"><div><b>Экспорт в JSON</b><p>Сохраните файл или скопируйте текст — это резервная копия всего планировщика</p></div><div class="head-actions"><button class="btn primary" data-action="export">⬇️ Скачать</button><button class="btn" data-action="export-show">📋 Показать текст</button></div></div>' +
          '<div class="set-row"><div><b>Импорт из JSON</b><p>Заменит текущие данные содержимым файла</p></div><div class="head-actions"><label class="btn" style="cursor:pointer">📂 Выбрать файл<input type="file" accept=".json,application/json" data-change="import-file" hidden></label><button class="btn" data-action="import-paste">📥 Вставить текст</button></div></div>' +
          '<div class="set-row"><div><b>Стартовые конспекты и карточки</b><p>Вернёт удалённые стартовые материалы; ваши записи не затронет</p></div><button class="btn" data-action="restore-content">📚 Вернуть</button></div>' +
          '<div class="set-row"><div><b>Начальные данные</b><p>Вернуть расписание, преподавателей и работы, с которых всё начиналось</p></div><button class="btn danger" data-action="reset">↩️ Сбросить</button></div>' +
          '<div class="set-row"><div><b>Очистить всё</b><p>Удалит предметы, расписание, конспекты и всё остальное</p></div><button class="btn danger" data-action="clear">🗑️ Очистить</button></div></div>' +
          '<p class="hint">Данные хранятся только в этом браузере (localStorage, ключ studyPlanner).</p>';
      }

      /* ---------- 6.6 Посещаемость ---------- */
      const ST_INFO = {'п': ['Присутствую', 'ok'], 'о': ['Опоздал(а)', 'late'], 'н': ['Нет', 'no'], 'у': ['По справке', 'exc']};
      const statusBtns = (date, pair, cur, uid, locked) => '<div class="att-btns">' + ['п', 'о', 'н'].map(k =>
        '<button class="att-b ' + ST_INFO[k][1] + (cur === k ? ' on' : '') + '" ' + (locked ? 'disabled ' : '') + 'data-action="att-mark" data-date="' + date + '" data-pair="' + pair + '" data-st="' + k + '"' + (uid ? ' data-uid="' + uid + '"' : '') + ' title="' + ST_INFO[k][0] + '">' + k + '</button>').join('') + '</div>';

      /* Пары выбранного дня с кнопками п / о / н. uid — чьи отметки правим (админ), locked — запрет правки */
      function attDayHtml(date, marks, certs, sub, uid, locked) {
        const prs = Att.pairs(date, sub);
        if (!prs.length) return '<div class="empty"><div class="mini-mascot">' + Mascot.svg('wink', 70) + '</div>В этот день пар нет</div>';
        return '<div class="items">' + prs.map(pr => {
          const cur = Att.eff(marks, certs, date, pr.pair), raw = marks[date + '|' + pr.pair], tm = pairTime(pr.pair);
          return '<div class="item att-row"><div class="att-num"><b>' + pr.pair + '</b><small>' + (tm || '') + '</small></div><div class="item-main">' +
            pr.lessons.map(l => {
              const sb = subj(l.subjectId); return '<div class="item-title">' + U.esc(sb ? sb.name : '—') + '</div><div class="item-meta">' + (sb ? '<span class="chip" style="--c:' + sb.color + '">' + U.esc(sb.short || sb.name) + '</span>' : '') +
                (l.room ? '<span class="tag">ауд. ' + U.esc(l.room) + '</span>' : '') + (l.subgroup ? '<span class="tag">' + U.esc(l.subgroup) + '</span>' : '') + (l.who ? '<span class="tag">' + U.esc(l.who) + '</span>' : '') + '</div>';
            }).join('') + '</div>' +
            (cur === 'у' && !raw ? '<span class="tag exc">по справке</span>' : '<div class="att-cell">' + statusBtns(date, pr.pair, raw, uid, locked || lockedMark(raw, uid)) + (lockedMark(raw, uid) ? '<small class="lock">🔒 исправить может только админ</small>' : '') + '</div>') + '</div>';
        }).join('') + '</div>';

      const pctCls = p => p == null ? '' : (p >= 85 ? 'good' : p >= 70 ? 'mid' : 'bad');
      function statCards(st) {
        return '<div class="grid-stats att-stats">' +
          '<div class="stat"><b>' + (st.pct == null ? '—' : st.pct + '%') + '</b><small>посещаемость</small></div>' +
          '<div class="stat ok"><b>' + st.p + '</b><small>п · присутствовал(а)</small></div>' +

      function subjTable(st) {
        const ids = Object.keys(st.bySubj);
        if (!ids.length) return '<div class="empty">Пока нет данных за этот период</div>';
        return '<div class="tbl-wrap"><table class="grid-tbl"><thead><tr><th>Предмет</th><th>п</th><th>о</th><th>н</th><th>справка</th><th>не отм.</th><th>%</th></tr></thead><tbody>' +
          ids.map(id => {
            const sb = subj(id), b = st.bySubj[id]; return '<tr><td>' + (sb ? '<span class="chip" style="--c:' + sb.color + '">' + U.esc(sb.short || sb.name) + '</span>' : '—') + '</td><td>' + b.p + '</td><td>' + b.l + '</td><td>' + b.a + '</td><td>' + b.x + '</td><td>' + b.u + '</td>' +
              '<td><div class="pbar ' + pctCls(b.pct) + '"><i style="width:' + (b.pct == null ? 0 : b.pct) + '%"></i><span>' + (b.pct == null ? '—' : b.pct + '%') + '</span></div></td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      function monthCal(ym, byDay, selected, pickAction) {
        const p = ym.split('-').map(Number), first = new Date(p[0], p[1] - 1, 1), offset = (first.getDay() + 6) % 7, days = new Date(p[0], p[1], 0).getDate(), today = U.iso(U.today());
        let h = '<div class="cal">' + DAYS.map(d => '<div class="cal-h">' + d + '</div>').join('');
        for (let i = 0; i < offset; i++)h += '<div></div>';
        for (let d = 1; d <= days; d++) {
          const di = ym + '-' + U.pad(d), arr = byDay[di] || []; let cls = '';

        }

      function periodControls() {
