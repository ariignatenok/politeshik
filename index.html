        async clear() {if (await UI.confirm('Удалить ВСЕ данные планировщика? Это нельзя отменить.', 'Очистить')) {ui.subjectId = null; Store.clear(); toast('Всё очищено');} }
      };

      /* ==========================================================================
         9. РЕЗЕРВНАЯ КОПИЯ: экспорт / импорт JSON
         ========================================================================== */
      const Backup = {
        json() {return JSON.stringify(Store.s, null, 2);},
        /* Скачивание: в Claude — через разрешение downloads, в обычном браузере — через ссылку */
        async download() {
          const text = Backup.json(), name = 'politeshik-' + U.iso(new Date()) + '.json';
          let dl = null;
          try {if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads');} catch (e) { }
          if (dl) {
            try {await dl.save({filename: name, data: text}); toast('Файл сохранён');}
            catch (e) {if (!e || e.code !== 'declined') toast('Не удалось сохранить — скопируйте текст'); if (!e || e.code !== 'declined') Backup.show();}
            return;
          }
          try {
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = name;
            document.body.appendChild(a); a.click(); a.remove(); toast('Скачивание запущено');
          } catch (e) {Backup.show();}
        },
        show() {
          UI.open('Экспорт: JSON', '<p class="md-help" style="margin:0 0 10px">Скопируйте текст и сохраните в заметки или файл — потом его можно вставить в «Импорт».</p>' +
            '<textarea class="input" id="json-out" rows="14" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px">' + U.esc(Backup.json()) + '</textarea>' +
            '<div class="modal-foot"><button class="btn" data-action="modal-close">Закрыть</button><button class="btn primary" data-action="copy-json">📋 Копировать</button></div>', {wide: true, noFocus: true});
        },
        async copy() {
          const ta = $('#json-out'); if (!ta) return;
          try {await navigator.clipboard.writeText(ta.value); toast('Скопировано');}
          catch (e) {ta.select(); try {document.execCommand('copy'); toast('Скопировано');} catch (_) {toast('Выделите текст и скопируйте вручную');} }
        },
        pasteDialog() {
          UI.open('Импорт: вставьте JSON', '<textarea class="input" id="import-text" rows="12" placeholder="{ &quot;subjects&quot;: [...] }" style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>' +
            '<div class="modal-foot"><button class="btn" data-action="modal-close">Отмена</button><button class="btn primary" data-action="import-run">Импортировать</button></div>', {wide: true});
        },
        /* Проверяем данные и заменяем текущие после подтверждения */
        async run(text) {
          let d; try {d = JSON.parse(text);} catch (e) {return toast('Это не JSON — проверьте текст');}
          const keys = ['subjects', 'teachers', 'works', 'homework', 'notes', 'schedule'];
          if (!d || typeof d !== 'object' || !keys.some(k => Array.isArray(d[k]))) return toast('Не похоже на данные планировщика');
          if (!await UI.confirm('Заменить текущие данные импортируемыми? Это действие нельзя отменить.', 'Заменить')) return;
          UI.close(); ui.subjectId = null; Store.replace(d); toast('Данные импортированы');
        },
        async file(input) {
          const f = input.files && input.files[0]; if (!f) return;
          try {const text = await (f.text ? f.text() : new Promise((res, rej) => {const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f);})); await Backup.run(text);}
          catch (e) {toast('Не удалось прочитать файл');}
          input.value = '';
        }
      };

      /* ---------- Единые слушатели событий ---------- */
      document.addEventListener('click', e => {
        const el = e.target.closest('[data-action]');
        if (!e.target.closest('#theme-pop,[data-action="theme"]')) {const tp = $('#theme-pop'); if (tp) tp.hidden = true;}
        if (el) {const fn = A[el.dataset.action]; if (fn) {if (el.tagName === 'LABEL') return; if (roBlocked(el)) {toast('Это может делать только админ группы'); return;} fn(el, e);} return;}
        if (e.target.classList && e.target.classList.contains('overlay') && e.target.parentNode.id === 'modal-root' && !UI.locked) UI.close();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && $('#modal-root').firstChild && !$('#confirm-root').firstChild && !UI.locked) UI.close();
        /* Режим заучивания карточек: Пробел — перевернуть, → знаю, ← повторить */
        if (ui.study && ui.tab === 'subjects' && !$('#modal-root').firstChild && !$('#confirm-root').firstChild && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName || '')) {
          const st = ui.study;
          if (e.key === ' ' || e.key === 'Enter') {e.preventDefault(); A['study-flip']();}
          else if (e.key === 'ArrowRight') {e.preventDefault(); if (st.flip) A['study-yes'](); else A['study-flip']();}
          else if (e.key === 'ArrowLeft' && st.flip) {e.preventDefault(); A['study-no']();}
        }
        /* Enter внутри полей формы = кнопка «Сохранить» */
        if (e.key === 'Enter' && !e.shiftKey && e.target.matches && e.target.matches('input:not([type=checkbox]):not([type=radio])')) {
          const f = e.target.closest('[data-form]'); const b = f && f.querySelector('[data-action="save-form"]'); if (b) {e.preventDefault(); b.click();}
        }
      });
      /* Поиск обновляет только список, чтобы поле не теряло фокус */
      document.addEventListener('input', e => {
        const k = e.target.dataset && e.target.dataset.input; if (!k) return;
        if (k === 'subj-search') {ui.subjQuery = e.target.value; $('#subj-list').innerHTML = subjectCards();}
        if (k === 'note-search') {ui.noteQuery = e.target.value; $('#note-list').innerHTML = noteList(subj(ui.subjectId));}
        if (k === 'teacher-search') {ui.teacherQuery = e.target.value; $('#t-list').innerHTML = teacherCards();}
        if (k === 'card-search') {ui.cardQuery = e.target.value; $('#card-list').innerHTML = cardList(subj(ui.subjectId));}
        if (k === 'formula-search') {ui.fQuery = e.target.value; $('#formula-list').innerHTML = formulaList(subj(ui.subjectId));}
        if (k === 'fm-preview') {const p = $('#fm-preview'); if (p) p.innerHTML = Fm.render(e.target.value);}
      });
      document.addEventListener('change', e => {
        const k = e.target.dataset && e.target.dataset.change; if (!k) return;
        if (k === 'teacher-filter') {ui.teacherSubject = e.target.value; $('#t-list').innerHTML = teacherCards();}
        if (k === 'lesson-subject') {const n = e.target.closest('[data-form]').querySelector('.new-subj'); n.hidden = e.target.value !== '__new'; if (!n.hidden) n.querySelector('input').focus();}
        if (k === 'import-file') Backup.file(e.target);
        if (k === 'card-shuffle') ui.cardShuffle = e.target.checked;
        if (k === 'rid-pick') {const f = e.target.closest('[data-form]'), ro = ROSTER_BY_ID[e.target.value], sgSel = f && f.querySelector('[name=subgroup]'); if (ro && sgSel && !sgSel.value) sgSel.value = ro.sub;}
        if (k === 'notif-toggle') {const n = Object.assign({}, Store.s.settings.notif || {}); n[e.target.dataset.k] = e.target.checked; Store.s.settings.notif = n; Store.save();}
        if (k === 'notif-mute') {const n = Object.assign({}, Store.s.settings.notif || {}); n.mute = Object.assign({}, n.mute || {}); if (e.target.checked) n.mute[e.target.dataset.id] = true; else delete n.mute[e.target.dataset.id]; Store.s.settings.notif = n; Store.save();}
        if (k === 'avatar-file') {
          const f = e.target.files && e.target.files[0];
          if (f) compressAvatar(f).then(d => {const m = Store.s.meta; m.photos = (m.photos || 0) + 1; Store.s.settings.avatar = {k: 'p', d}; Store.save(); Profile.push(); Ach.check(); UI.close(); App.render(); toast('Фото обновлено');}, () => toast('Не удалось обработать фото'));
        }
        if (k === 'cert-file') handleDraftFile(e.target, true);
        if (k === 'work-file') handleDraftFile(e.target, false);
        if (k === 'stud-date' && ui.stud) {
          ui.stud.date = e.target.value; const r = studentRows().find(x => x.id === ui.stud.uid), m = $('#stud-day');
          if (r && m && e.target.value >= ATT_START) m.innerHTML = attDayHtml(e.target.value, r.marks, r.certs, r.p.subgroup, ui.stud.uid, false);
        }
      });

      /* ==========================================================================
         10. ЗАПУСК
         ========================================================================== */
      const Views = {dashboard: viewDashboard, schedule: viewSchedule, attendance: viewAttendance, subjects: viewSubjects, hw: viewHw, chat: viewChat, teachers: viewTeachers, cabinet: viewCabinet, rating: viewRating, group: viewGroup, journal: viewJournal, more: viewMore, settings: viewSettings};
      const MORE_TABS = ['teachers', 'cabinet', 'rating', 'group', 'journal', 'settings', 'more'];
      const App = {
        /* Что показывать вместо приложения: loading — подключаемся, register — нет личного кабинета, offline — нет входа */
        gateMode() {
          if (Cloud.status === 'pending') return 'loading';
          if (Cloud.status === 'online' && !Cloud.hasCabinet()) return Cloud.claimsLoaded ? (ui.secret ? 'secret' : 'register') : 'loading';
          if (Cloud.status === 'offline' && !ui.localOk) return 'offline';
          return '';
        },
        renderGate(mode) {
          const g = $('#gate');
          const logged = Cloud.status === 'online';
          const hasCab = logged && Cloud.hasCabinet();
          const needClaim = logged && !hasCab && Cloud.claimsLoaded;
          if (logged && hasCab) return '';
          document.body.classList.add('gated');
          $('#view').innerHTML = ''; $('#nav-side').innerHTML = ''; $('#nav-bottom').innerHTML = '';
          g.hidden = false;
          if (g.dataset.mode === mode) return '';
          g.dataset.mode = mode;
          const busy = Cloud.status === 'pending' || (logged && !Cloud.claimsLoaded);
          if (busy) {
            g.innerHTML = '<div class="gate-card"><div class="gate-mascot">' + Mascot.svg('thinking', 110) + '</div><h1>Политешик</h1><p class="gate-text">Подключаемся<span class="gate-dots"><span>.</span><span>.</span><span>.</span></span></p></div>';
            return '';
          }
          if (needClaim && mode === 'secret' && ui.secret) {                 // экран секретного пароля
            g.innerHTML = '<div class="gate-card"><div class="gate-mascot">' + Mascot.svg('thinking', 110) + '</div><h1>Политешик</h1><p class="gate-sub">Секретный пароль админа</p>' +
              '<p class="gate-text">«' + U.esc(ROSTER_BY_ID[ui.secret.rid].name) + '» — фамилия админа группы. Чтобы продолжить, введите секретный пароль.</p>' +
              '<div class="warn secret-warn" hidden>Секретный пароль ещё не задан. Задайте его в Supabase: скрипт politeshik_rls.sql (строка с ПРИДУМАЙТЕ_СЕКРЕТНЫЙ_ПАРОЛЬ).</div>' +
              '<div data-form="secret"><label class="field"><span>Секретный пароль</span><input class="input" name="secret" type="password" autocomplete="off" placeholder="••••••••"></label>' +
              '<button class="btn primary big" data-action="secret-do">Войти</button></div>' +
              '<button class="btn ghost" style="margin-top:10px;width:100%" data-action="secret-back">← Назад к выбору фамилии</button>' +
              '<button class="btn ghost" style="margin-top:6px;width:100%" data-action="logout-now">Выйти из аккаунта</button></div>';
            try {supa.rpc('admin_secret_is_set').then(r => {if (r && r.data === false) {const w = g.querySelector('.secret-warn'); if (w) w.hidden = false;}});} catch (e) { }
            const f0 = g.querySelector('input'); if (f0) setTimeout(() => {try {f0.focus();} catch (e) { } }, 80);
            return '';
          }
          if (needClaim) {
            const avail = ROSTER.filter(r => !r.flag), taken = r => Cloud.claims[r.id] && Cloud.claims[r.id] !== Cloud.uid, locked = r => false;
            g.innerHTML = '<div class="gate-card"><div class="gate-mascot">' + Mascot.svg('cheer', 120) + '</div><h1>Политешик</h1><p class="gate-sub">Создай личный кабинет</p>' +
              '<p class="gate-text">Ты вошёл(ла). Теперь выбери свою фамилию из списка группы — её нельзя будет сменить.</p>' +
              '<div data-form="profile">' +
              field('Это я', '<select class="input" name="rid" data-change="rid-pick"><option value="">— выбери свою фамилию —</option>' + avail.map(r => '<option value="' + r.id + '"' + (taken(r) || locked(r) ? ' disabled' : '') + '>' + U.esc(r.name) + (taken(r) ? ' — занято' : (r.id === ADMIN_RID && !Cloud.isAdmin) ? ' — нужен секретный пароль' : '') + '</option>').join('') + '</select>') +
              field('Подгруппа', '<select class="input" name="subgroup"><option value="">выбери</option><option value="1">1 подгруппа</option><option value="2">2 подгруппа</option></select>') +
              '<button class="btn primary big" data-action="save-form">Создать кабинет и войти</button></div>' +
              '<button class="btn ghost" style="margin-top:10px;width:100%" data-action="logout-now">Выйти из аккаунта</button>' +
              '<small class="gate-foot">Одну фамилию может занять только один аккаунт. Если выбрали не ту — напишите админу.</small></div>';
            return '';
          }
          g.innerHTML = '<div class="gate-card">' +
            '<div class="gate-mascot">' + Mascot.svg('wink', 110) + '</div>' +
            '<h1>Политешик</h1><p class="gate-sub">Вход в приложение</p>' +
            '<p class="gate-text">Войди, чтобы отмечаться на парах, писать заметки и общаться с админом. Данные сохраняются в облаке.</p>' +
            '<div data-form="login">' +
            '<label class="field"><span>Email</span><input class="input" name="email" type="email" placeholder="ivan@mail.ru" autocomplete="email"></label>' +
            '<label class="field"><span>Пароль (минимум 6 символов)</span><input class="input" name="password" type="password" placeholder="••••••" autocomplete="current-password"></label>' +
            '<button class="btn primary big" data-action="login-do">Войти</button>' +
            '<button class="btn big" style="margin-top:10px" data-action="signup-do">Зарегистрироваться</button>' +
            '</div>' +
            '<small class="gate-foot">Впервые здесь? Нажми «Зарегистрироваться», введи свою почту и пароль. Затем выбери свою фамилию из списка группы.</small>' +
            '</div>';
          const f = g.querySelector('input'); if (f) setTimeout(() => {try {f.focus();} catch (e) { } }, 80);
          return '';
        },
        render(animate) {
          const gm = App.gateMode();
          if (gm) {App.renderGate(gm); return;}
          document.body.classList.toggle('ro', !canEdit());
          if (document.body.classList.contains('gated')) {document.body.classList.remove('gated'); const g = $('#gate'); g.hidden = true; g.innerHTML = ''; g.dataset.mode = ''; animate = true;}
          if (!Views[ui.tab] || (ui.tab === 'group' && !Cloud.isAdmin)) ui.tab = 'dashboard';
          const v = $('#view');
          v.innerHTML = Views[ui.tab]();
          const at = $('.tab.on'); if (at && at.scrollIntoView) {try {at.scrollIntoView({inline: 'center', block: 'nearest'});} catch (e) { } }
          if (animate) {v.classList.remove('rise'); void v.offsetWidth; v.classList.add('rise');}
          const unread = Chat.unread(), badge = n => n ? '<span class="badge">' + n + '</span>' : '';
          $('#nav-side').innerHTML = NAV_ALL.filter(t => !t.admin || Cloud.isAdmin).map(t => '<button class="nav-btn' + (ui.tab === t.id ? ' on' : '') + '" data-action="nav" data-tab="' + t.id + '"><span class="ico">' + t.ico + '</span>' + t.label + (t.id === 'chat' ? badge(unread) : '') + '</button>').join('');
          $('#nav-bottom').innerHTML = NAV_BOTTOM.map(id => {
            const t = id === 'more' ? {id: 'more', ico: '☰', short: 'Ещё'} : NAV_ALL.find(x => x.id === id), on = id === 'more' ? MORE_TABS.includes(ui.tab) : ui.tab === id;
            return '<button class="nav-btn' + (on ? ' on' : '') + '" data-action="nav" data-tab="' + t.id + '"><span class="ico">' + t.ico + '</span>' + t.short + (id === 'chat' ? badge(unread) : '') + '</button>';
          }).join('');
          $('#side-date').textContent = U.fmtLong(new Date());
          $('#fab').style.display = (ui.tab === 'dashboard') ? '' : 'none';
          const mo = Mascot.current(), bm = $('#brand-mascot'), tm = $('#top-mascot');
          if (bm && bm.dataset.m !== mo) {bm.dataset.m = mo; bm.innerHTML = Mascot.svg(mo, 44);}
          if (tm && tm.dataset.m !== mo) {tm.dataset.m = mo; tm.innerHTML = Mascot.svg(mo, 26);}
          if (ui.tab === 'chat') {const bx = $('#chat-box'); if (bx) bx.scrollTop = bx.scrollHeight;}
        },
        /* мягкая перерисовка: не трогаем экран, пока человек печатает или открыто окно */
        renderSoft() {
          if ($('#modal-root').firstChild || $('#confirm-root').firstChild) return;
          const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
          App.render();
        },
        init() {
          Store.load();
          UI.applyTheme();
          App.render(true);
          Cloud.init().then(() => {UI.applyTheme(); Chat.tick(); Profile.push(); Ach.check(); App.render(true);});
          /* раз в минуту: письма Политешика и пересчёт срочности */
          setInterval(() => {
            if ($('#modal-root').firstChild || $('#confirm-root').firstChild) return;
            const ch = Chat.tick(); if (ch || ui.tab === 'dashboard') App.renderSoft();
          }, 60000);
          document.addEventListener('visibilitychange', () => {if (!document.hidden && Chat.tick()) App.renderSoft();});
          /* индикатор связи и автосинхронизация при возвращении сети */
          const setNet = () => {const b = $('#net-badge'); if (b) b.hidden = navigator.onLine !== false;};
          window.addEventListener('offline', setNet);
          window.addEventListener('online', () => {setNet(); if (Cloud.status === 'online') {Cloud.pushAtt(); Cloud.pushChat(); Cloud.pushProfile();} toast('Синхронизировано ✓');});
          setNet();
          ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {Reminders.lastTouch = Date.now();}, {passive: true}));
          setInterval(() => {Reminders.tick(); Ach.check(); Rating.compute();}, 30000); setTimeout(() => {Reminders.tick(); Ach.check();}, 1500);
          /* кнопки правки скрываются для студента одним правилом (список действий — RO_ACTIONS) */
          const roStyle = document.createElement('style');
          roStyle.textContent = [...RO_ACTIONS].filter(a => ['times', 'cell-add', 'cell-edit', 'pair-add', 'pair-del'].indexOf(a) < 0).map(a => 'body.ro [data-action="' + a + '"]').join(',') + '{display:none!important}';
          document.head.appendChild(roStyle);
        }
      };
      window.StudyPlanner = {Store, Md, U, Fm, Content, Cloud, Chat, Att, Mascot, ui, Changes, Notifier, Reminders, canEdit, Themes, THEMES, Ach, ACH, Rating, Profile, FAQ_DEFAULT, faqItems};   // удобно для отладки в консоли
      App.init();
    })();
  </script>
</body>
