<h2>Смена пароля в «Политешике»</h2>
<p>Введите этот код в окне восстановления пароля:</p>
<p style="font-size:32px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
<p>Код действует 10 минут. После подтверждения почты вы сможете задать новый пароль.</p>
<p>Можно также <a href="{{ .ConfirmationURL }}">открыть окно смены пароля</a>.</p>
<p>Если вы не запрашивали смену пароля, ничего не делайте. Никому не сообщайте код.</p>
