name: Sync Polytech schedule

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_schedule.py
      - .github/workflows/sync-schedule.yml

permissions:
  contents: write

concurrency:
  group: polytech-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate group schedule
        run: python3 scripts/sync_schedule.py
      - name: Save updated schedule
        run: |
          if git diff --quiet -- data/; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m 'Update schedules for both groups'
          git pull --rebase origin main
          git push origin HEAD:main
